<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Whale Scanner (Топ-180)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0e11; color: #eaecef; margin: 0; padding: 15px; }
        h1 { font-size: 20px; margin-bottom: 10px; }
        .header { background: #1e2329; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .settings { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        button { background: #f7931a; border: none; color: #1e2329; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .list { margin-top: 15px; }
        .notification { background: #2b3139; border-left: 4px solid #f7931a; padding: 10px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; }
        .time { color: #848e9c; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐋 Bybit Кит Сканер (Топ-180)</h1>
        <div class="settings">
            <button onclick="startScan()">▶ Запустить сканер</button>
            <button onclick="stopScan()">⏹ Стоп</button>
        </div>
        <div class="time">Статус: <span id="status" style="color: #848e9c;">Остановлен</span></div>
    </div>

    <div id="notifications" class="list"></div>

    <script>
        let ws;
        const notificationsDiv = document.getElementById('notifications');
        const statusDiv = document.getElementById('status');

        // Порог и глубины (стабильный вариант)
        const USDT_THRESHOLD = 500000;
        const DEPTH_LEVELS = 50;

        function sendNotification(title, body) {
            if (Notification.permission === "granted") {
                new Notification(title, { body: body, icon: 'https://cryptologos.cc/logos/bitcoin-btc-logo.png' });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") new Notification(title, { body: body });
                });
            }
        }

        async function startScan() {
            statusDiv.innerText = "Загрузка монет...";
            statusDiv.style.color = "#f7931a";

            // 1. Загрузка всех монет
            const response = await fetch('https://api.bybit.com/v5/market/tickers?category=linear');
            const json = await response.json();
            const allTickers = json.result.list;

            // 2. Фильтрация USDT + сортировка по обороту + срез топ-180
            const topCoins = allTickers
                .filter(coin => coin.symbol.endsWith('USDT'))
                .sort((a, b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
                .slice(0, 180);

            const symbols = topCoins.map(coin => coin.symbol);
            statusDiv.innerText = "Найдено монет: " + symbols.length + ". Подключение...";

            // 3. Подключение к WebSocket
            if (ws) ws.close();
            ws = new WebSocket(`wss://stream.bybit.com/v5/public/linear`);

            ws.onopen = () => {
                statusDiv.innerText = "Сканирование 180 монет (Активно)";
                statusDiv.style.color = "#27ae60";
                
                // 4. Подписка на стаканы (стабильные 50 уровней)
                const subscribeMsg = {
                    "op": "subscribe",
                    "args": symbols.map(sym => `orderbook.50.${sym}`)
                };
                ws.send(JSON.stringify(subscribeMsg));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.topic && data.topic.includes('orderbook') && data.type === 'snapshot') {
                    const symbol = data.topic.split('.')[2];
                    const bids = data.data.b;
                    const asks = data.data.a;
                    
                    // Считаем заявки (покупка + продажа) в долларах
                    const allOrders = [...bids.map(o => ({price: o[0], qty: o[1], side: 'Buy'})), 
                                       ...asks.map(o => ({price: o[0], qty: o[1], side: 'Sell'}))];
                    
                    allOrders.sort((a, b) => (b.price * b.qty) - (a.price * a.qty));
                    const biggest = allOrders[0];
                    const totalValue = biggest.price * biggest.qty;

                    // 5. Если сумма превышает 500к, шлем уведомление
                    if (totalValue >= USDT_THRESHOLD) {
                        const formattedValue = totalValue.toLocaleString('en-US', { maximumFractionDigits: 0 });
                        sendNotification(`💰 Заявка на ${symbol}!`, `Сумма: $${formattedValue}`);
                        
                        // Добавляем на экран
                        const div = document.createElement('div');
                        div.className = 'notification';
                        div.innerHTML = `<b>${symbol}</b> (${biggest.side})<br>Сумма: $${formattedValue}<br>Цена: ${biggest.price}`;
                        notificationsDiv.prepend(div);
                    }
                }
            };

            ws.onclose = () => {
                statusDiv.innerText = "Соединение закрыто";
                statusDiv.style.color = "red";
            };
        }

        function stopScan() {
            if (ws) ws.close();
            statusDiv.innerText = "Остановлен";
            statusDiv.style.color = "#848e9c";
        }
    </script>
</body>
</html>
