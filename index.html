<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Whale Levels Scanner (Pro Edition)</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 15px; background: #0b0e11; color: #eaecef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.header { background: #1e2329; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
h1 { font-size: 20px; margin: 0 0 15px 0; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
button, select { border: none; border-radius: 8px; padding: 10px 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
button:hover { filter: brightness(1.1); }
button { background: #f7931a; color: #1e2329; }
button.stop { background: #e74c3c; color: white; }
button.clear { background: #555; color: white; }
button.pause { background: #3498db; color: white; }
button.pause.active { background: #e67e22; }
select { background: #2b3139; color: white; outline: none; }
label { font-size: 13px; color: #848e9c; display: flex; align-items: center; gap: 4px; }
.status { color: #848e9c; font-size: 13px; margin-top: 8px; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: #161a1e; border-radius: 8px; padding: 9px; text-align: center; font-size: 11px; }
.stat-value { display: block; font-size: 15px; font-weight: bold; margin-top: 4px; }
.section-title { color: #848e9c; font-size: 14px; margin: 15px 0 8px; display: flex; justify-content: space-between; font-weight: 600; }

/* Кастомный скроллбар */
.signals { height: 68vh; min-height: 400px; overflow-y: auto; padding-right: 5px; }
.signals::-webkit-scrollbar { width: 6px; }
.signals::-webkit-scrollbar-track { background: #0b0e11; }
.signals::-webkit-scrollbar-thumb { background: #2b3139; border-radius: 4px; }
.signals::-webkit-scrollbar-thumb:hover { background: #555; }

.signal { background: #1e2329; border-radius: 11px; padding: 13px; margin-bottom: 9px; border-left: 5px solid #555; position: relative; animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.signal.long { border-left-color: #27ae60; }
.signal.short { border-left-color: #e74c3c; }
.signal-top { display: flex; justify-content: space-between; align-items: center; }
.symbol { font-size: 17px; font-weight: bold; }
.direction { font-weight: bold; font-size: 14px; padding: 4px 8px; border-radius: 4px; }
.direction.long { background: rgba(39, 174, 96, 0.2); color: #27ae60; }
.direction.short { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
.score { font-size: 20px; font-weight: bold; margin-top: 5px; }
.data-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-top: 10px; }
.data-box { background: #161a1e; padding: 8px; border-radius: 7px; font-size: 11px; color: #848e9c; }
.data-box strong { display: block; color: #eaecef; font-size: 13px; margin-top: 3px; }
.reason { margin-top: 9px; padding: 8px; border-radius: 7px; background: #161a1e; font-size: 12px; line-height: 1.5; border-left: 2px solid #f7931a; }
.empty { text-align: center; color: #848e9c; padding: 60px 15px; }
.green { color: #27ae60; }
.red { color: #e74c3c; }
.gray { color: #848e9c; }

@media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .signals { height: 60vh; }
}
</style>
</head>
<body>

<div class="header">
    <h1>🐋 Bybit Whale Levels Scanner (Pro)</h1>
    <div class="controls">
        <button onclick="startScanner()">▶ Запустить</button>
        <button class="stop" onclick="stopScanner()">⏹ Стоп</button>
        <button id="pauseBtn" class="pause" onclick="togglePause()">⏸ Пауза UI</button>
        <button class="clear" onclick="clearSignals()">🗑 Очистить</button>
    </div>
    <div class="controls">
        <label>Выдержка:
            <select id="wallAge">
                <option value="30">30 сек (быстрый)</option>
                <option value="60" selected>1 минута</option>
                <option value="120">2 минуты</option>
            </select>
        </label>
        <label>Объём 24h:
            <select id="volSens">
                <option value="0.0003">0.03% (Меньше стен)</option>
                <option value="0.0005" selected>0.05% (Базовый)</option>
                <option value="0.001">0.10% (Только гиганты)</option>
            </select>
        </label>
        <label>Мин. Score:
            <select id="minScore">
                <option value="60">60</option>
                <option value="70" selected>70</option>
                <option value="80">80</option>
            </select>
        </label>
        <label><input type="checkbox" id="soundToggle" checked> 🔔</label>
    </div>
    <div class="status">Статус: <span id="status">Остановлен</span></div>
    <div class="stats">
        <div class="stat">TOP <span id="coinCount" class="stat-value">0</span></div>
        <div class="stat">WS <span id="wsStatus" class="stat-value">OFF</span></div>
        <div class="stat">Кандидатов <span id="candidateCount" class="stat-value">0</span></div>
        <div class="stat">Сигналов <span id="signalCount" class="stat-value">0</span></div>
    </div>
</div>

<div class="section-title">
    <span>📌 Подтвержденные крупные уровни</span>
    <span id="pauseStatus" style="color: #f7931a; display: none;">[ОБНОВЛЕНИЕ UI НА ПАУЗЕ]</span>
</div>
<div id="signals" class="signals">
    <div id="empty" class="empty">Запустите сканер.<br><br>Ищем плиты с выдержкой 1-2 минуты...</div>
</div>

<script>
/* =====================================================
   CONFIG & STATE
===================================================== */
const MAX_SYMBOLS = 100;
const ORDERBOOK_DEPTH = 50;
const MAX_SIGNALS = 15;
const ANALYSIS_INTERVAL = 1000;
const UI_INTERVAL = 1500;
const SYMBOL_REFRESH = 5 * 60 * 1000;
const MIN_WALL_RATIO = 3;
const MAX_WALL_DISTANCE = 0.012; 
const TRADE_WINDOW = 30000;      
const PRICE_WINDOW = 120000;     
const GC_INTERVAL = 300000; // Очистка памяти каждые 5 мин

let ws = null;
let running = false;
let uiPaused = false;
let lastRenderedHtml = ""; // Кеш для рендера

let reconnectTimer = null;
let symbolRefreshTimer = null;
let analysisTimer = null;
let uiTimer = null;
let gcTimer = null;

const symbols = [];
const symbolRanks = new Map();
const symbolTurnovers = new Map();
const books = new Map();
const trades = new Map();
const wallHistory = new Map();
const signals = new Map();

/* =====================================================
   DOM & AUDIO
===================================================== */
const statusEl = document.getElementById("status");
const wsEl = document.getElementById("wsStatus");
const coinCountEl = document.getElementById("coinCount");
const candidateCountEl = document.getElementById("candidateCount");
const signalCountEl = document.getElementById("signalCount");
const signalsEl = document.getElementById("signals");

let audioCtx = null;
function playBeep() {
    if (!document.getElementById("soundToggle").checked) return;
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.1;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } catch(e){}
}

/* =====================================================
   HELPERS & DYNAMIC THRESHOLD
===================================================== */
const now = () => Date.now();
const money = val => Number(val).toLocaleString("en-US", { maximumFractionDigits: 0 });
const percent = val => (val * 100).toFixed(2) + "%";

function priceFormat(value) {
    const n = Number(value);
    if (n >= 1000) return n.toFixed(2);
    if (n >= 1) return n.toFixed(4);
    return n.toFixed(8);
}

function getDynamicThreshold(symbol) {
    const turnover = symbolTurnovers.get(symbol) || 10000000;
    const sens = parseFloat(document.getElementById("volSens").value);
    return Math.max(30000, turnover * sens);
}

function togglePause() {
    uiPaused = !uiPaused;
    const btn = document.getElementById("pauseBtn");
    const status = document.getElementById("pauseStatus");
    btn.classList.toggle("active", uiPaused);
    btn.innerText = uiPaused ? "▶ Возобновить UI" : "⏸ Пауза UI";
    status.style.display = uiPaused ? "inline" : "none";
}

/* =====================================================
   GARBAGE COLLECTION (Очистка памяти)
===================================================== */
function collectGarbage() {
    const currentTime = now();
    
    // 1. Очистка старых стен (старше 10 минут)
    for (const [key, wall] of wallHistory.entries()) {
        if (currentTime - wall.lastSeen > 600000) wallHistory.delete(key);
    }
    
    // 2. Очистка сиротских трейдов для монет, по которым давно не было сделок
    for (const [symbol, list] of trades.entries()) {
        const cutoff = currentTime - PRICE_WINDOW;
        while (list.length > 0 && list[0].time < cutoff) list.shift();
        if (list.length === 0) trades.delete(symbol);
    }
}

/* =====================================================
   DATA PROCESSING
===================================================== */
function createBook(symbol) {
    books.set(symbol, { bids: new Map(), asks: new Map(), lastPrice: null });
}

function applySnapshot(symbol, data) {
    createBook(symbol);
    const book = books.get(symbol);
    if (data.b) data.b.forEach(([p, q]) => { if (q > 0) book.bids.set(parseFloat(p), parseFloat(q)); });
    if (data.a) data.a.forEach(([p, q]) => { if (q > 0) book.asks.set(parseFloat(p), parseFloat(q)); });
}

function applyDelta(symbol, data) {
    const book = books.get(symbol);
    if (!book) return;
    if (data.b) data.b.forEach(([p, q]) => {
        const price = parseFloat(p);
        parseFloat(q) === 0 ? book.bids.delete(price) : book.bids.set(price, parseFloat(q));
    });
    if (data.a) data.a.forEach(([p, q]) => {
        const price = parseFloat(p);
        parseFloat(q) === 0 ? book.asks.delete(price) : book.asks.set(price, parseFloat(q));
    });
}

function processTrade(data) {
    if (!Array.isArray(data)) return;
    const currentTime = now();
    const cutoff = currentTime - PRICE_WINDOW;
    
    for (const trade of data) {
        const { s: symbol, S: side, p, v, T } = trade;
        const price = parseFloat(p), qty = parseFloat(v);
        if (!symbol || !price || !qty) continue;

        if (!trades.has(symbol)) trades.set(symbol, []);
        const list = trades.get(symbol);
        list.push({ time: Number(T) || currentTime, side, price, value: price * qty });

        const book = books.get(symbol);
        if (book) book.lastPrice = price;
        
        // Быстрая очистка старых трейдов при поступлении новых
        while (list.length && list[0].time < cutoff) list.shift();
    }
}

function getTradeFlow(symbol) {
    const list = trades.get(symbol) || [];
    const cutoff = now() - TRADE_WINDOW;
    let buy = 0, sell = 0;

    for (let i = list.length - 1; i >= 0; i--) {
        const t = list[i];
        if (t.time < cutoff) break;
        t.side === "Buy" ? (buy += t.value) : (sell += t.value);
    }
    const total = buy + sell;
    return { buy, sell, total, imbalance: total > 0 ? (buy - sell) / total : 0 };
}

function getPriceChange(symbol) {
    const list = trades.get(symbol) || [];
    if (list.length < 2) return 0;
    
    const latestPrice = list[list.length - 1].price;
    const cutoff = now() - PRICE_WINDOW;
    let oldPrice = null;

    for (const t of list) {
        if (t.time >= cutoff) { oldPrice = t.price; break; }
    }
    return (!oldPrice) ? 0 : (latestPrice - oldPrice) / oldPrice;
}

function getLocalLiquidity(book, side, currentPrice) {
    if (!book || !currentPrice) return 1;
    const source = side === "Buy" ? book.bids : book.asks;
    let localSum = 0, count = 0;

    // Оптимизация: не собираем массивы, просто суммируем и усредняем или берем максимальную
    for (const [price, qty] of source) {
        if (Math.abs(price - currentPrice) / currentPrice <= 0.004) {
            localSum += (price * qty);
            count++;
        }
    }
    return count > 0 ? (localSum / count) : 1; 
}

/* =====================================================
   ANALYSIS & SCORE
===================================================== */
function getCurrentPriceOptimized(book) {
    if (book.lastPrice) return book.lastPrice;
    let bestBid = -Infinity, bestAsk = Infinity;
    
    // O(N) вместо O(N log N) сортировки
    for (const p of book.bids.keys()) if (p > bestBid) bestBid = p;
    for (const p of book.asks.keys()) if (p < bestAsk) bestAsk = p;
    
    if (bestBid !== -Infinity && bestAsk !== Infinity) return (bestBid + bestAsk) / 2;
    return null;
}

function findWalls(symbol) {
    const book = books.get(symbol);
    if (!book) return [];

    const currentPrice = getCurrentPriceOptimized(book);
    if (!currentPrice) return [];

    const result = [];
    const threshold = getDynamicThreshold(symbol);

    const checkWall = (source, side) => {
        for (const [price, qty] of source) {
            const distance = side === "Buy" ? (currentPrice - price) / currentPrice : (price - currentPrice) / currentPrice;
            if (distance < 0 || distance > MAX_WALL_DISTANCE) continue;
            
            const value = price * qty;
            const local = getLocalLiquidity(book, side, currentPrice);
            const ratio = value / Math.max(local, 1);

            if (value >= threshold && ratio >= MIN_WALL_RATIO) {
                result.push({ symbol, side, price, qty, value, distance, ratio, currentPrice, threshold });
            }
        }
    };

    checkWall(book.bids, "Buy");
    checkWall(book.asks, "Sell");

    return result.sort((a, b) => b.value - a.value).slice(0, 4);
}

function updateWallHistory(wall) {
    const key = `${wall.symbol}_${wall.side}_${wall.price}`;
    if (!wallHistory.has(key)) {
        wallHistory.set(key, { firstSeen: now(), lastSeen: now(), lastValue: wall.value });
    } else {
        const item = wallHistory.get(key);
        item.lastSeen = now();
        item.lastValue = wall.value;
    }
    return wallHistory.get(key);
}

function calculateScore(wall, flow, priceChange, ageSec) {
    let score = 0;
    score += Math.min(25, (wall.value / wall.threshold) * 10);
    score += Math.min(20, wall.ratio * 4);
    score += Math.min(25, (ageSec / 60) * 12.5);

    if (wall.side === "Buy") {
        if (priceChange >= 0) score += 15; 
        if (flow.imbalance > -0.1) score += 15; 
    } else {
        if (priceChange <= 0) score += 15; 
        if (flow.imbalance < 0.1) score += 15;
    }
    return Math.min(100, Math.round(score));
}

function analyzeAll() {
    if (!running) return;
    
    for (const symbol of symbols) {
        const book = books.get(symbol);
        if (!book) continue;

        const wallsFound = findWalls(symbol);
        const flow = getTradeFlow(symbol);
        const priceChange = getPriceChange(symbol);
        const requiredAgeSec = parseInt(document.getElementById("wallAge").value);
        const minScore = parseInt(document.getElementById("minScore").value);

        for (const wall of wallsFound) {
            const history = updateWallHistory(wall);
            const ageSec = (now() - history.firstSeen) / 1000;
            if (ageSec < requiredAgeSec) continue;

            const score = calculateScore(wall, flow, priceChange, ageSec);
            if (score < minScore) continue;

            const key = `${symbol}_${wall.side}_${wall.price}`;
            const isNew = !signals.has(key);

            signals.set(key, {
                key, symbol, rank: symbolRanks.get(symbol), setup: wall.side === "Buy" ? "LONG LEVEL" : "SHORT LEVEL", 
                score, wall, flow, priceChange, ageSec, updated: now()
            });

            if (isNew && score >= 75) playBeep();
        }
    }

    const expiry = now() - 15000;
    for (const [key, signal] of signals) {
        if (signal.updated < expiry) signals.delete(key);
    }
}

/* =====================================================
   RENDER
===================================================== */
function renderSignals() {
    candidateCountEl.innerText = signals.size;
    if (uiPaused) return;

    const sorted = [...signals.values()].sort((a, b) => b.score - a.score).slice(0, MAX_SIGNALS);
    signalCountEl.innerText = sorted.length;

    if (sorted.length === 0) {
        const emptyHtml = `<div class="empty">🔎 Поиск подтвержденных уровней...<br><br>Ждем плиты 1-2 мин.</div>`;
        if (lastRenderedHtml !== emptyHtml) {
            signalsEl.innerHTML = emptyHtml;
            lastRenderedHtml = emptyHtml;
        }
        return;
    }

    let html = "";
    for (const s of sorted) {
        const isLong = s.wall.side === "Buy";
        const dClass = isLong ? "long" : "short";
        
        html += `
            <div class="signal ${dClass}">
                <div class="signal-top">
                    <div class="symbol">${s.symbol} <span class="gray">#${s.rank}</span></div>
                    <div class="direction ${dClass}">${s.setup}</div>
                </div>
                <div class="score">Score: ${s.score}/100</div>
                <div class="data-grid">
                    <div class="data-box">Тип уровня<strong>${isLong ? "🛡 BUY" : "🛑 SELL"} (Плита)</strong></div>
                    <div class="data-box">Уровень<strong>${priceFormat(s.wall.price)}</strong></div>
                    <div class="data-box">Объём плиты<strong>$${money(s.wall.value)}</strong></div>
                    <div class="data-box">Порог (24h)<strong>$${money(s.wall.threshold)}</strong></div>
                    <div class="data-box">Время жизни<strong>${(s.ageSec / 60).toFixed(1)} мин</strong></div>
                    <div class="data-box">До стены<strong>${percent(s.wall.distance)}</strong></div>
                    <div class="data-box">Плотность<strong>${s.wall.ratio.toFixed(1)}x</strong></div>
                    <div class="data-box">Реакция цены<strong>${percent(s.priceChange)}</strong></div>
                </div>
                <div class="reason">💡 Плита стоит <b>${(s.ageSec / 60).toFixed(1)} мин</b>. Превышает порог ликвидности в <b>${(s.wall.value / s.wall.threshold).toFixed(1)} раз</b>.</div>
            </div>`;
    }
    
    // Обновляем DOM только если HTML изменился (сохраняем CPU и не сбрасываем скролл просто так)
    if (html !== lastRenderedHtml) {
        signalsEl.innerHTML = html;
        lastRenderedHtml = html;
    }
}

/* =====================================================
   WEBSOCKET
===================================================== */
function connectWebSocket() {
    if (!running) return;
    if (ws) { try { ws.onclose = null; ws.close(); } catch (e) {} }

    // ВАЖНО: Очищаем старые стаканы при реконнекте, иначе пропущенные дельты сломают логику
    books.clear(); 
    
    ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");
    ws.onopen = async () => {
        wsEl.innerText = "ON";
        wsEl.className = "stat-value green";
        statusEl.innerText = "Сканирование активно";
        statusEl.style.color = "#27ae60";

        const args = [];
        for (const symbol of symbols) {
            args.push(`orderbook.${ORDERBOOK_DEPTH}.${symbol}`);
            args.push(`publicTrade.${symbol}`);
        }

        const chunkSize = 10;
        for (let i = 0; i < args.length; i += chunkSize) {
            if (!running || ws.readyState !== WebSocket.OPEN) break;
            ws.send(JSON.stringify({ op: "subscribe", args: args.slice(i, i + chunkSize) }));
            await new Promise(res => setTimeout(res, 50));
        }
    };

    ws.onmessage = event => {
        try {
            const data = JSON.parse(event.data);
            if (!data.topic) return;

            if (data.topic.startsWith("orderbook.")) {
                const symbol = data.topic.split(".")[2];
                if (data.type === "snapshot") applySnapshot(symbol, data.data);
                else if (data.type === "delta") applyDelta(symbol, data.data);
            } else if (data.topic.startsWith("publicTrade.")) {
                processTrade(data.data);
            }
        } catch (e) {}
    };

    ws.onerror = () => { wsEl.innerText = "ERR"; wsEl.className = "stat-value red"; };
    ws.onclose = () => {
        wsEl.innerText = "OFF";
        wsEl.className = "stat-value red";
        if (running) {
            statusEl.innerText = "Переподключение...";
            statusEl.style.color = "#f7931a";
            reconnectTimer = setTimeout(connectWebSocket, 3000);
        }
    };
}

/* =====================================================
   LOAD SYMBOLS & CONTROL
===================================================== */
async function loadSymbols() {
    try {
        statusEl.innerText = "Загрузка TOP-100...";
        const res = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const json = await res.json();
        
        const list = json.result.list
            .filter(i => i.symbol.endsWith("USDT") && parseFloat(i.turnover24h) > 0)
            .sort((a, b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
            .slice(0, MAX_SYMBOLS);

        symbols.length = 0;
        list.forEach((item, idx) => {
            symbols.push(item.symbol);
            symbolRanks.set(item.symbol, idx + 1);
            symbolTurnovers.set(item.symbol, parseFloat(item.turnover24h));
        });
        coinCountEl.innerText = symbols.length;
        return true;
    } catch (e) {
        statusEl.innerText = "Ошибка загрузки TOP";
        statusEl.style.color = "#e74c3c";
        return false;
    }
}

async function startScanner() {
    if (running) return;
    running = true;
    if (!(await loadSymbols())) { running = false; return; }

    books.clear(); trades.clear(); signals.clear(); wallHistory.clear();
    lastRenderedHtml = "";
    
    connectWebSocket();
    analysisTimer = setInterval(analyzeAll, ANALYSIS_INTERVAL);
    uiTimer = setInterval(renderSignals, UI_INTERVAL);
    gcTimer = setInterval(collectGarbage, GC_INTERVAL);
    
    symbolRefreshTimer = setInterval(async () => {
        await loadSymbols();
        connectWebSocket();
    }, SYMBOL_REFRESH);
}

function stopScanner() {
    running = false;
    [analysisTimer, uiTimer, symbolRefreshTimer, gcTimer, reconnectTimer].forEach(t => clearInterval(t));
    if (ws) { try { ws.onclose = null; ws.close(); } catch(e){} ws = null; }

    wsEl.innerText = "OFF"; wsEl.className = "stat-value";
    statusEl.innerText = "Остановлен"; statusEl.style.color = "#848e9c";
}

function clearSignals() { signals.clear(); renderSignals(); }
setInterval(() => { if (ws && ws.readyState === WebSocket.OPEN) ws.send('{"op":"ping"}'); }, 20000);
</script>
</body>
</html>
