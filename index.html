<script>


/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

const MAX_SYMBOLS = 100;

const ORDERBOOK_DEPTH = 50;

const MAX_SIGNALS = 10;

const SYMBOL_REFRESH_TIME =
    5 * 60 * 1000;


/*
 * Анализ рынка происходит отдельно
 * от WebSocket.
 *
 * Это очень важно.
 *
 * WebSocket может присылать
 * сотни событий в секунду,
 * но интерфейс анализируется
 * только здесь.
 */

const ANALYSIS_INTERVAL = 500;

const UI_INTERVAL = 1000;


/*
 * Через сколько секунд
 * начинаем считать стену
 * подтверждённой.
 */

let stabilitySeconds = 5;


/*
 * Минимальный Score,
 * чтобы попасть в TOP-10.
 */

let minimumScore = 70;


/* =========================================================
   ПОРОГИ СТЕН
========================================================= */

const THRESHOLDS = {

    top5: 500000,

    top20: 300000,

    top50: 180000,

    top100: 100000

};


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let ws = null;

let isRunning = false;

let reconnectTimer = null;

let symbolRefreshTimer = null;

let analysisTimer = null;

let uiTimer = null;

let heartbeatTimer = null;


/*
 * TOP-100
 */

const symbols = [];

const symbolRanks =
    new Map();


/*
 * Стаканы.
 */

const orderBooks =
    new Map();


/*
 * Последние ticker данные.
 */

const tickerData =
    new Map();


/*
 * История цены.
 */

const priceHistory =
    new Map();


/*
 * История turnover.
 */

const turnoverHistory =
    new Map();


/*
 * Кандидаты стен.
 */

const wallCandidates =
    new Map();


/*
 * Активные торговые сетапы.
 */

const activeSignals =
    new Map();


/*
 * DOM элементов сигналов.
 */

const signalElements =
    new Map();


/* =========================================================
   DOM
========================================================= */

const signalsDiv =
    document.getElementById(
        "signals"
    );

const statusDiv =
    document.getElementById(
        "status"
    );

const wsStatusDiv =
    document.getElementById(
        "wsStatus"
    );

const coinCountDiv =
    document.getElementById(
        "coinCount"
    );

const signalCountDiv =
    document.getElementById(
        "signalCount"
    );

const cycleTimeDiv =
    document.getElementById(
        "cycleTime"
    );

const stabilitySelect =
    document.getElementById(
        "stabilitySelect"
    );

const scoreSelect =
    document.getElementById(
        "scoreSelect"
    );


/* =========================================================
   НАСТРОЙКИ
========================================================= */

stabilitySelect.addEventListener(
    "change",
    () => {

        stabilitySeconds =
            parseInt(
                stabilitySelect.value
            ) || 5;

    }
);


scoreSelect.addEventListener(
    "change",
    () => {

        minimumScore =
            parseInt(
                scoreSelect.value
            ) || 70;

    }
);


/* =========================================================
   ПОРОГ
========================================================= */

function getThreshold(symbol) {

    const rank =
        symbolRanks.get(symbol);


    if (!rank) {

        return THRESHOLDS.top100;

    }


    if (rank <= 5) {

        return THRESHOLDS.top5;

    }


    if (rank <= 20) {

        return THRESHOLDS.top20;

    }


    if (rank <= 50) {

        return THRESHOLDS.top50;

    }


    return THRESHOLDS.top100;

}


/* =========================================================
   ФОРМАТИРОВАНИЕ
========================================================= */

function formatMoney(value) {

    if (!isFinite(value)) {

        return "$0";

    }


    if (value >= 1000000) {

        return "$" +
            (value / 1000000)
                .toFixed(2) +
            "M";

    }


    if (value >= 1000) {

        return "$" +
            (value / 1000)
                .toFixed(0) +
            "K";

    }


    return "$" +
        Math.round(value)
            .toLocaleString(
                "en-US"
            );

}


function formatPrice(value) {

    const number =
        Number(value);


    if (!isFinite(number)) {

        return "—";

    }


    if (number >= 1000) {

        return number.toFixed(2);

    }


    if (number >= 1) {

        return number.toFixed(4);

    }


    if (number >= 0.01) {

        return number.toFixed(5);

    }


    return number.toPrecision(6);

}


function formatPercent(value) {

    if (!isFinite(value)) {

        return "0.00%";

    }


    return (
        value >= 0
            ? "+"
            : ""
    ) +
    value.toFixed(2) +
    "%";

}


/* =========================================================
   ORDER BOOK
========================================================= */

function createOrderBook(symbol) {

    orderBooks.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map()
        }
    );

}


/* =========================================================
   SNAPSHOT
========================================================= */

function applySnapshot(
    symbol,
    data
) {

    createOrderBook(symbol);


    const book =
        orderBooks.get(symbol);


    if (Array.isArray(data.b)) {

        data.b.forEach(
            level => {

                const price =
                    String(level[0]);

                const qty =
                    parseFloat(level[1]);


                if (
                    isFinite(qty) &&
                    qty > 0
                ) {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    if (Array.isArray(data.a)) {

        data.a.forEach(
            level => {

                const price =
                    String(level[0]);

                const qty =
                    parseFloat(level[1]);


                if (
                    isFinite(qty) &&
                    qty > 0
                ) {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );

    }

}


/* =========================================================
   DELTA
========================================================= */

function applyDelta(
    symbol,
    data
) {

    const book =
        orderBooks.get(symbol);


    if (!book) {

        return;

    }


    if (Array.isArray(data.b)) {

        data.b.forEach(
            level => {

                const price =
                    String(level[0]);

                const qty =
                    parseFloat(level[1]);


                if (
                    !isFinite(qty) ||
                    qty <= 0
                ) {

                    book.bids.delete(
                        price
                    );

                } else {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    if (Array.isArray(data.a)) {

        data.a.forEach(
            level => {

                const price =
                    String(level[0]);

                const qty =
                    parseFloat(level[1]);


                if (
                    !isFinite(qty) ||
                    qty <= 0
                ) {

                    book.asks.delete(
                        price
                    );

                } else {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );

    }

}


/* =========================================================
   TICKER
========================================================= */

function updateTicker(
    symbol,
    data
) {

    const price =
        parseFloat(
            data.lastPrice
        );

    const turnover =
        parseFloat(
            data.turnover24h
        );


    if (
        !isFinite(price) ||
        price <= 0
    ) {

        return;

    }


    const now =
        Date.now();


    tickerData.set(
        symbol,
        {
            price,
            turnover,
            time: now
        }
    );


    if (
        !priceHistory.has(symbol)
    ) {

        priceHistory.set(
            symbol,
            []
        );

    }


    const prices =
        priceHistory.get(symbol);


    prices.push({

        time: now,

        value: price

    });


    /*
     * Храним только
     * последние 2 минуты.
     */

    const cutoff =
        now -
        120000;


    while (
        prices.length &&
        prices[0].time < cutoff
    ) {

        prices.shift();

    }


    if (
        isFinite(turnover)
    ) {

        if (
            !turnoverHistory.has(
                symbol
            )
        ) {

            turnoverHistory.set(
                symbol,
                []
            );

        }


        const history =
            turnoverHistory.get(
                symbol
            );


        history.push({

            time: now,

            value: turnover

        });


        while (
            history.length &&
            history[0].time < cutoff
        ) {

            history.shift();

        }

    }

}


/* =========================================================
   PRICE CHANGE 1 MIN
========================================================= */

function getPriceChange1m(symbol) {

    const history =
        priceHistory.get(symbol);


    if (
        !history ||
        history.length < 2
    ) {

        return 0;

    }


    const now =
        Date.now();


    const target =
        now -
        60000;


    let old =
        history[0];


    for (
        const point of history
    ) {

        if (
            point.time <= target
        ) {

            old = point;

        } else {

            break;

        }

    }


    const current =
        history[
            history.length - 1
        ];


    if (
        !old ||
        !current ||
        old.value <= 0
    ) {

        return 0;

    }


    return (
        (current.value - old.value) /
        old.value
    ) * 100;

}


/* =========================================================
   TURNOVER CHANGE
========================================================= */

function getTurnoverChange1m(symbol) {

    const history =
        turnoverHistory.get(
            symbol
        );


    if (
        !history ||
        history.length < 2
    ) {

        return 0;

    }


    const now =
        Date.now();


    const target =
        now -
        60000;


    let old =
        history[0];


    for (
        const point of history
    ) {

        if (
            point.time <= target
        ) {

            old = point;

        } else {

            break;

        }

    }


    const current =
        history[
            history.length - 1
        ];


    if (
        !old ||
        !current
    ) {

        return 0;

    }


    const delta =
        current.value -
        old.value;


    /*
     * В нормальном случае
     * turnover24h постоянно растёт.
     */

    if (
        delta <= 0
    ) {

        return 0;

    }


    /*
     * Превращаем абсолютный
     * turnover в относительный
     * показатель активности.
     */

    const approximate =
        (
            delta /
            Math.max(
                old.value,
                1
            )
        ) * 100;


    return approximate;

}


/* =========================================================
   ПОИСК КРУПНЫХ СТЕН
========================================================= */

function scanWalls() {

    const now =
        Date.now();


    for (
        const symbol of symbols
    ) {

        const book =
            orderBooks.get(symbol);


        const ticker =
            tickerData.get(symbol);


        if (
            !book ||
            !ticker
        ) {

            continue;

        }


        const threshold =
            getThreshold(symbol);


        scanSide(
            symbol,
            book.bids,
            "Buy",
            threshold,
            ticker.price,
            now
        );


        scanSide(
            symbol,
            book.asks,
            "Sell",
            threshold,
            ticker.price,
            now
        );

    }


    /*
     * После анализа проверяем
     * исчезнувшие стены.
     */

    cleanupOldWalls(now);

}


/* =========================================================
   АНАЛИЗ СТОРОНЫ
========================================================= */

function scanSide(
    symbol,
    levels,
    side,
    threshold,
    currentPrice,
    now
) {

    for (
        const [
            price,
            qty
        ] of levels
    ) {

        const priceNumber =
            parseFloat(price);

        const qtyNumber =
            parseFloat(qty);


        if (
            !isFinite(priceNumber) ||
            !isFinite(qtyNumber)
        ) {

            continue;

        }


        const value =
            priceNumber *
            qtyNumber;


        if (
            value < threshold
        ) {

            continue;

        }


        const key =
            `${symbol}_${side}_${price}`;


        if (
            !wallCandidates.has(key)
        ) {

            wallCandidates.set(
                key,
                {

                    key,

                    symbol,

                    side,

                    price: priceNumber,

                    firstSeen: now,

                    lastSeen: now,

                    lastValue: value,

                    maxValue: value,

                    samples: 1,

                    totalValue: value

                }
            );

        } else {

            const wall =
                wallCandidates.get(
                    key
                );


            wall.lastSeen =
                now;


            wall.lastValue =
                value;


            wall.maxValue =
                Math.max(
                    wall.maxValue,
                    value
                );


            wall.samples++;

            wall.totalValue +=
                value;

        }

    }

}


/* =========================================================
   УДАЛЕНИЕ СТАРЫХ СТЕН
========================================================= */

function cleanupOldWalls(now) {

    const LOST_AFTER =
        2500;


    for (
        const [
            key,
            wall
        ] of wallCandidates
    ) {

        if (
            now -
            wall.lastSeen >
            LOST_AFTER
        ) {

            wallCandidates.delete(
                key
            );


            const signal =
                activeSignals.get(key);


            if (signal) {

                signal.invalidated =
                    true;

                signal.invalidatedAt =
                    now;

            }

        }

    }

}


/* =========================================================
   РАСЧЁТ SCORE
========================================================= */

function calculateScore(
    wall,
    currentPrice
) {

    const aliveSeconds =
        (
            Date.now() -
            wall.firstSeen
        ) / 1000;


    /*
     * ----------------------------------
     * 1. РАЗМЕР СТЕНЫ — 25
     * ----------------------------------
     */

    const threshold =
        getThreshold(
            wall.symbol
        );


    const sizeRatio =
        wall.lastValue /
        threshold;


    let sizeScore = 0;


    if (
        sizeRatio >= 3
    ) {

        sizeScore = 25;

    } else if (
        sizeRatio >= 2
    ) {

        sizeScore = 21;

    } else if (
        sizeRatio >= 1.5
    ) {

        sizeScore = 17;

    } else {

        sizeScore = 12;

    }


    /*
     * ----------------------------------
     * 2. УДЕРЖАНИЕ — 20
     * ----------------------------------
     */

    let persistenceScore = 0;


    if (
        aliveSeconds >= 15
    ) {

        persistenceScore = 20;

    } else if (
        aliveSeconds >= 10
    ) {

        persistenceScore = 18;

    } else if (
        aliveSeconds >= 7
    ) {

        persistenceScore = 15;

    } else if (
        aliveSeconds >= stabilitySeconds
    ) {

        persistenceScore = 12;

    }


    /*
     * ----------------------------------
     * 3. ДВИЖЕНИЕ ЦЕНЫ — 20
     * ----------------------------------
     */

    const priceChange =
        getPriceChange1m(
            wall.symbol
        );


    let priceScore = 0;


    if (
        wall.side === "Buy"
    ) {

        /*
         * Для BUY нас интересует
         * положительная динамика.
         */

        if (
            priceChange >= 1
        ) {

            priceScore = 20;

        } else if (
            priceChange >= 0.5
        ) {

            priceScore = 16;

        } else if (
            priceChange >= 0.2
        ) {

            priceScore = 12;

        } else if (
            priceChange > 0
        ) {

            priceScore = 7;

        }

    } else {

        /*
         * Для SELL нас интересует
         * отрицательная динамика.
         */

        if (
            priceChange <= -1
        ) {

            priceScore = 20;

        } else if (
            priceChange <= -0.5
        ) {

            priceScore = 16;

        } else if (
            priceChange <= -0.2
        ) {

            priceScore = 12;

        } else if (
            priceChange < 0
        ) {

            priceScore = 7;

        }

    }


    /*
     * ----------------------------------
     * 4. ОБЪЁМ / АКТИВНОСТЬ — 15
     * ----------------------------------
     */

    const volumeChange =
        getTurnoverChange1m(
            wall.symbol
        );


    let volumeScore = 0;


    if (
        volumeChange >= 0.5
    ) {

        volumeScore = 15;

    } else if (
        volumeChange >= 0.25
    ) {

        volumeScore = 12;

    } else if (
        volumeChange >= 0.1
    ) {

        volumeScore = 8;

    } else if (
        volumeChange > 0
    ) {

        volumeScore = 4;

    }


    /*
     * ----------------------------------
     * 5. БЛИЗОСТЬ ЦЕНЫ — 10
     * ----------------------------------
     */

    const distance =
        Math.abs(
            (
                currentPrice -
                wall.price
            ) /
            currentPrice
        ) * 100;


    let proximityScore = 0;


    if (
        distance <= 0.25
    ) {

        proximityScore = 10;

    } else if (
        distance <= 0.5
    ) {

        proximityScore = 8;

    } else if (
        distance <= 1
    ) {

        proximityScore = 6;

    } else if (
        distance <= 1.5
    ) {

        proximityScore = 3;

    }


    /*
     * ----------------------------------
     * 6. СТАБИЛЬНОСТЬ — 10
     * ----------------------------------
     */

    const averageValue =
        wall.totalValue /
        Math.max(
            wall.samples,
            1
        );


    const stabilityRatio =
        wall.lastValue /
        Math.max(
            averageValue,
            1
        );


    let stabilityScore = 0;


    if (
        stabilityRatio >= 0.9
    ) {

        stabilityScore = 10;

    } else if (
        stabilityRatio >= 0.75
    ) {

        stabilityScore = 8;

    } else if (
        stabilityRatio >= 0.6
    ) {

        stabilityScore = 5;

    } else {

        stabilityScore = 2;

    }


    const total =
        sizeScore +
        persistenceScore +
        priceScore +
        volumeScore +
        proximityScore +
        stabilityScore;


    return {

        score:
            Math.min(
                100,
                Math.round(total)
            ),

        aliveSeconds,

        priceChange,

        volumeChange,

        distance,

        sizeScore,

        persistenceScore,

        priceScore,

        volumeScore,

        proximityScore,

        stabilityScore

    };

}


/* =========================================================
   СОЗДАНИЕ / ОБНОВЛЕНИЕ SETUP
========================================================= */

function updateSignals() {

    const now =
        Date.now();


    for (
        const [
            key,
            wall
        ] of wallCandidates
    ) {

        /*
         * Стена должна реально
         * существовать.
         */

        if (
            now -
            wall.lastSeen >
            2500
        ) {

            continue;

        }


        const ticker =
            tickerData.get(
                wall.symbol
            );


        if (!ticker) {

            continue;

        }


        /*
         * Минимальное удержание.
         */

        const alive =
            (
                now -
                wall.firstSeen
            ) / 1000;


        if (
            alive <
            stabilitySeconds
        ) {

            continue;

        }


        /*
         * Цена должна находиться
         * относительно близко к стене.
         */

        const metrics =
            calculateScore(
                wall,
                ticker.price
            );


        /*
         * Очень важный фильтр:
         *
         * BUY wall должна быть ниже
         * текущей цены.
         *
         * SELL wall должна быть выше.
         */

        if (
            wall.side === "Buy" &&
            wall.price >=
            ticker.price
        ) {

            continue;

        }


        if (
            wall.side === "Sell" &&
            wall.price <=
            ticker.price
        ) {

            continue;

        }


        /*
         * Если Score недостаточный —
         * не показываем.
         */

        if (
            metrics.score <
            minimumScore
        ) {

            /*
             * Если сетап уже был,
             * сохраняем его для
             * плавного исчезновения.
             */

            if (
                activeSignals.has(key)
            ) {

                const signal =
                    activeSignals.get(
                        key
                    );

                signal.score =
                    metrics.score;

                signal.metrics =
                    metrics;

            }

            continue;

        }


        /*
         * Определяем LONG / SHORT.
         */

        const direction =
            wall.side === "Buy"
                ? "LONG"
                : "SHORT";


        /*
         * Создаём новый сигнал.
         */

        if (
            !activeSignals.has(key)
        ) {

            activeSignals.set(
                key,
                {

                    key,

                    symbol:
                        wall.symbol,

                    direction,

                    wall,

                    score:
                        metrics.score,

                    metrics,

                    createdAt:
                        now,

                    invalidated:
                        false

                }
            );

        } else {

            const signal =
                activeSignals.get(
                    key
                );


            signal.wall =
                wall;

            signal.metrics =
                metrics;

            signal.score =
                metrics.score;

            signal.invalidated =
                false;

        }

    }


    /*
     * Удаляем старые
     * неактуальные сетапы.
     */

    for (
        const [
            key,
            signal
        ] of activeSignals
    ) {

        const wall =
            wallCandidates.get(key);


        if (
            !wall
        ) {

            signal.invalidated =
                true;

        }


        if (
            signal.invalidated
        ) {

            /*
             * Оставляем сигнал
             * на короткое время,
             * чтобы интерфейс успел
             * показать INVALIDATED.
             */

            if (
                now -
                (
                    signal.invalidatedAt ||
                    now
                ) >
                5000
            ) {

                activeSignals.delete(
                    key
                );

                removeSignalElement(
                    key
                );

            }

        }

    }

}


/* =========================================================
   ENTRY / INVALIDATION
========================================================= */

function getEntryData(signal) {

    const price =
        tickerData.get(
            signal.symbol
        )?.price;


    const wallPrice =
        signal.wall.price;


    if (
        !price
    ) {

        return null;

    }


    /*
     * Это не рекомендация
     * конкретной цены входа.
     *
     * Это ориентир зоны,
     * где цена находится рядом
     * с наблюдаемой стеной.
     */

    if (
        signal.direction === "LONG"
    ) {

        const low =
            Math.min(
                price,
                wallPrice * 1.0025
            );

        const high =
            Math.max(
                price,
                wallPrice
            );


        const invalidation =
            wallPrice * 0.998;


        return {

            zone:
                `${formatPrice(low)} – ${formatPrice(high)}`,

            invalidation:
                formatPrice(
                    invalidation
                )

        };

    }


    const low =
        Math.min(
            price,
            wallPrice
        );

    const high =
        Math.max(
            price,
            wallPrice * 0.9975
        );


    const invalidation =
        wallPrice * 1.002;


    return {

        zone:
            `${formatPrice(low)} – ${formatPrice(high)}`,

        invalidation:
            formatPrice(
                invalidation
            )

    };

}


/* =========================================================
   REASON
========================================================= */

function getReasons(signal) {

    const m =
        signal.metrics;

    const reasons = [];


    if (
        m.sizeScore >= 20
    ) {

        reasons.push(
            "✓ очень крупная стена"
        );

    } else {

        reasons.push(
            "✓ крупная стена"
        );

    }


    if (
        m.persistenceScore >= 15
    ) {

        reasons.push(
            "✓ стена долго удерживается"
        );

    }


    if (
        m.priceScore >= 12
    ) {

        reasons.push(
            signal.direction === "LONG"
                ? "✓ цена движется вверх"
                : "✓ цена движется вниз"
        );

    }


    if (
        m.volumeScore >= 8
    ) {

        reasons.push(
            "✓ повышенная активность"
        );

    }


    if (
        m.proximityScore >= 8
    ) {

        reasons.push(
            "✓ цена близко к стене"
        );

    }


    if (
        m.stabilityScore >= 8
    ) {

        reasons.push(
            "✓ размер стены стабилен"
        );

    }


    return reasons.join(
        "<br>"
    );

}


/* =========================================================
   SCORE CLASS
========================================================= */

function getScoreClass(score) {

    if (
        score >= 85
    ) {

        return "high";

    }


    if (
        score >= 70
    ) {

        return "medium";

    }


    return "low";

}

/* =========================================================
   УДАЛЕНИЕ CARD
========================================================= */

function removeSignalElement(
    key
) {

    const div =
        signalElements.get(key);


    if (div) {

        div.remove();

    }


    signalElements.delete(
        key
    );

}


/* =========================================================
   RENDER TOP-10
========================================================= */

function renderSignals() {

    const signals =
        Array.from(
            activeSignals.values()
        );


    /*
     * Сначала живые.
     * INVALIDATED в конце.
     */

    signals.sort(
        (a, b) => {

            if (
                a.invalidated &&
                !b.invalidated
            ) {

                return 1;

            }


            if (
                !a.invalidated &&
                b.invalidated
            ) {

                return -1;

            }


            return (
                b.score -
                a.score
            );

        }
    );


    const top =
        signals.slice(
            0,
            MAX_SIGNALS
        );


    /*
     * Если ничего нет.
     */

    const empty =
        document.getElementById(
            "emptyMessage"
        );


    if (
        top.length === 0
    ) {

        if (!empty) {

            signalsDiv.innerHTML = `

                <div
                    id="emptyMessage"
                    class="empty"
                >

                    🔎 Ищем сетапы...<br><br>

                    Пока нет ситуаций
                    с достаточным Score.

                </div>

            `;

        }


    } else {

        if (empty) {

            empty.remove();

        }

    }


    /*
     * Отрисовываем TOP-10.
     */

    top.forEach(
        (
            signal,
            index
        ) => {

            renderSignal(
                signal,
                index
            );

        }
    );


    /*
     * Удаляем карточки,
     * которые больше не входят
     * в TOP-10.
     */

    const visibleKeys =
        new Set(
            top.map(
                signal =>
                    signal.key
            )
        );


    for (
        const key of
        signalElements.keys()
    ) {

        if (
            !visibleKeys.has(key)
        ) {

            removeSignalElement(
                key
            );

        }

    }


    signalCountDiv.innerText =
        top.filter(
            signal =>
                !signal.invalidated
        ).length;


    cycleTimeDiv.innerText =
        new Date()
            .toLocaleTimeString();

}


/* =========================================================
   WEBSOCKET MESSAGE
========================================================= */

function handleWebSocketMessage(
    event
) {

    try {

        const data =
            JSON.parse(
                event.data
            );


        if (
            !data.topic
        ) {

            return;

        }


        /*
         * ORDERBOOK
         */

        if (
            data.topic.startsWith(
                "orderbook."
            )
        ) {

            const parts =
                data.topic.split(".");


            const symbol =
                parts[2];


            if (!symbol) {

                return;

            }


            if (
                data.type ===
                "snapshot"
            ) {

                applySnapshot(
                    symbol,
                    data.data
                );

            }


            if (
                data.type ===
                "delta"
            ) {

                applyDelta(
                    symbol,
                    data.data
                );

            }


            return;

        }


        /*
         * TICKER
         */

        if (
            data.topic.startsWith(
                "tickers."
            )
        ) {

            const parts =
                data.topic.split(".");


            const symbol =
                parts[1];


            if (!symbol) {

                return;

            }


            if (
                data.data
            ) {

                updateTicker(
                    symbol,
                    data.data
                );

            }

        }

    } catch (error) {

        console.error(
            "WS message error:",
            error
        );

    }

}


/* =========================================================
   HEARTBEAT
========================================================= */

function startHeartbeat() {

    stopHeartbeat();


    heartbeatTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


function stopHeartbeat() {

    if (
        heartbeatTimer
    ) {

        clearInterval(
            heartbeatTimer
        );

        heartbeatTimer = null;

    }

}


/* =========================================================
   CONNECT
========================================================= */

function connectWebSocket() {

    if (!isRunning) {

        return;

    }


    if (ws) {

        try {

            ws.close();

        } catch (e) {}

    }


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        console.log(
            "WebSocket connected"
        );


        wsStatusDiv.innerText =
            "ON";

        wsStatusDiv.className =
            "stat-value green";


        statusDiv.innerText =
            "Сканирование активно";

        statusDiv.style.color =
            "#27ae60";


        /*
         * ORDERBOOK TOP-100
         */

        const orderbookTopics =
            symbols.map(
                symbol =>
                    `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );


        /*
         * TICKERS TOP-100
         */

        const tickerTopics =
            symbols.map(
                symbol =>
                    `tickers.${symbol}`
            );


        /*
         * Подписываемся пакетами.
         *
         * Это лучше, чем отправлять
         * один гигантский subscribe.
         */

        const allTopics =
            [
                ...orderbookTopics,
                ...tickerTopics
            ];


        const chunkSize =
            50;


        for (
            let i = 0;
            i < allTopics.length;
            i += chunkSize
        ) {

            const chunk =
                allTopics.slice(
                    i,
                    i + chunkSize
                );


            ws.send(
                JSON.stringify({

                    op: "subscribe",

                    args: chunk

                })
            );

        }


        startHeartbeat();

    };


    ws.onmessage =
        handleWebSocketMessage;


    ws.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );


            wsStatusDiv.innerText =
                "ERROR";

            wsStatusDiv.className =
                "stat-value red";

        };


    ws.onclose = () => {

        stopHeartbeat();


        wsStatusDiv.innerText =
            "OFF";

        wsStatusDiv.className =
            "stat-value red";


        if (isRunning) {

            statusDiv.innerText =
                "Переподключение...";

            statusDiv.style.color =
                "#f7931a";


            scheduleReconnect();

        }

    };

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (!isRunning) {

        return;

    }


    if (reconnectTimer) {

        return;

    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            3000
        );

}


/* =========================================================
   TOP-100
========================================================= */

async function loadSymbols() {

    try {

        statusDiv.innerText =
            "Загрузка TOP-100...";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Некорректный ответ Bybit"
            );

        }


        const topCoins =
            json.result.list

                .filter(
                    coin =>

                        coin.symbol &&
                        coin.symbol.endsWith(
                            "USDT"
                        ) &&

                        parseFloat(
                            coin.turnover24h
                        ) > 0
                )

                .sort(
                    (a, b) =>

                        parseFloat(
                            b.turnover24h
                        ) -

                        parseFloat(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length = 0;

        symbolRanks.clear();


        topCoins.forEach(
            (
                coin,
                index
            ) => {

                symbols.push(
                    coin.symbol
                );


                symbolRanks.set(
                    coin.symbol,
                    index + 1
                );

            }
        );


        coinCountDiv.innerText =
            symbols.length;


        console.log(
            "TOP-100:",
            symbols
        );


        return true;

    } catch (error) {

        console.error(
            "TOP-100 error:",
            error
        );


        statusDiv.innerText =
            "Ошибка загрузки TOP-100";

        statusDiv.style.color =
            "#e74c3c";


        return false;

    }

}

    connectWebSocket();

     * Запускаем анализ
     * независимо от WebSocket.
     */

    startAnalysisLoop();


    connectWebSocket();


    symbolRefreshTimer =
        setInterval(
            refreshSymbols,
            SYMBOL_REFRESH_TIME
        );


    renderSignals();

}


/* =========================================================
   STOP
========================================================= */

function stopScan() {

    isRunning = false;


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer = null;

    }


    if (symbolRefreshTimer) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer = null;

    }


    stopAnalysisLoop();

    stopHeartbeat();


    if (ws) {

        try {

            ws.close();

        } catch (e) {}

        ws = null;

    }


    orderBooks.clear();

    wallCandidates.clear();


    statusDiv.innerText =
        "Остановлен";

    statusDiv.style.color =
        "#848e9c";


    wsStatusDiv.innerText =
        "OFF";

    wsStatusDiv.className =
        "stat-value";


    signalCountDiv.innerText =
        "0";

}


/* =========================================================
   CLEAR
========================================================= */

function clearSignals() {

    activeSignals.clear();

    signalElements.clear();


    signalsDiv.innerHTML = `

        <div
            id="emptyMessage"
            class="empty"
        >

            Список очищен.<br><br>

            Ждём новые торговые сетапы.

        </div>

    `;


    signalCountDiv.innerText =
        "0";

}
