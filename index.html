<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bybit Whale Scanner</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background: #0b0e11;

            color: #eaecef;

            margin: 0;

            padding: 15px;

        h1 {

            font-size: 20px;

        }


        .header {

            background: #1e2329;

            padding: 15px;

        }


        .settings {

            display: flex;

            flex-wrap: wrap;

            margin-bottom: 12px;

            align-items: center;

        }


        button,
        select {

            background: #f7931a;

        }

        }


        button.pause {

        }


        button.clear {

        }


        .status {

            color: #848e9c;

            font-size: 13px;

        }

            display: grid;

            gap: 8px;

        }


        .stat {

            background: #161a1e;

            border-radius: 8px;

            padding: 10px;

            text-align: center;

            font-size: 12px;

        }


        .stat-value {

            display: block;

        .green {

        }


        .orange {

            color: #f7931a;

        }

        }


        .blue {

        }


        .section-title {

            font-size: 14px;

            color: #848e9c;

            margin: 15px 0 8px;

        }


        /*
         * =====================================================
         * SIGNAL BOARD
         * =====================================================
         *
         * Теперь здесь НЕТ бесконечной ленты.
         *
         * Всегда максимум 10 карточек.
         *
         * Карточки обновляются на месте.

        .list {

            height: 65vh;

            min-height: 350px;

            overflow-y: auto;

            padding-right: 4px;

        }


        .notification {

            background: #1e2329;

            padding: 14px;

            margin-bottom: 10px;

            border-radius: 10px;

            border-left: 5px solid #f7931a;

            font-size: 14px;

            transition:
                opacity 0.2s ease,
                border-color 0.2s ease;

        }


        .notification.buy {

            border-left-color:
                #27ae60;

        .notification.sell {

        .signal-header {

        .coin {

        }

        }


        .score {

        }


        .score-label {

            font-size: 10px;

        .amount {

        .progress {

            overflow: hidden;

        }


        .progress-bar {

            height: 100%;

            background: #f7931a;

                width 0.5s ease;

        }


        .time {

        .empty {

        }

        @media (max-width: 600px) {

</head>


<body>

</div>


<div class="section-title">

    🐋 TOP сигналов

</div>


<div
    id="notifications"
    class="list"
>


    <div
        id="emptyMessage"
        class="empty"
    >

        Запусти сканер.<br>

        Здесь появятся сильные сигналы.

    </div>


</div>


<script>


/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */


const MAX_SYMBOLS = 100;


const ORDERBOOK_DEPTH = 50;


/*
 * Обновляем TOP-100 раз в 5 минут.
 */

const SYMBOL_REFRESH_TIME =
    5 * 60 * 1000;


/*
 * Экран обновляется ОДИН РАЗ В СЕКУНДУ.
 */

const DISPLAY_INTERVAL =
    1000;


/*
 * Рыночные данные REST
 * обновляем раз в 15 секунд.
 */

const MARKET_DATA_INTERVAL =
    15000;


/*
 * Максимальный срок жизни
 * сигнала без подтверждения.
 */

const CANDIDATE_MAX_AGE =
    60 * 1000;


/*
 * После исчезновения крупной заявки
 * не держим её в памяти бесконечно.
 */

const ORDER_CLEANUP_TIME =
    20 * 1000;


/*
 * Повторный сигнал по той же заявке.
 */

const ALERT_COOLDOWN =
    30 * 1000;


/*
 * Максимум кандидатов,
 * которые держим в памяти.
 */

const MAX_CANDIDATES =
    1500;


/* =========================================================
   ПОРОГИ
========================================================= */


const THRESHOLDS = {

    top5: 500000,

    top20: 300000,

    top50: 180000,

    top100: 100000

};


/* =========================================================
   СОСТОЯНИЕ
========================================================= */


let ws = null;


let isRunning = false;


let displayPaused = false;


let reconnectTimer = null;


let symbolRefreshTimer = null;


let heartbeatTimer = null;


let displayTimer = null;


let marketDataTimer = null;


/*
 * TOP-100
 */

const symbols = [];


/*
 * Ранги монет.
 */

const symbolRanks =
    new Map();


/*
 * Локальные стаканы.
 */

const orderBooks =
    new Map();


/*
 * Только крупные заявки.
 *
 * key:
 *
 * BTCUSDT_Buy_100000
 */

const candidates =
    new Map();


/*
 * Уже показанные сигналы.
 */

const alertedOrders =
    new Map();


/*
 * Рыночные данные.
 */

const marketData =
    new Map();


/*
 * Текущие сигналы.
 *
 * key -> signal
 */

const activeSignals =
    new Map();


/*
 * Статистика.
 */

let signalCount = 0;


/* =========================================================
   DOM
========================================================= */


const notificationsDiv =
    document.getElementById(
        "notifications"
    );


const statusDiv =
    document.getElementById(
        "status"
    );


const wsStatusDiv =
    document.getElementById(
        "wsStatus"
    );


const coinCountDiv =
    document.getElementById(
        "coinCount"
    );


const candidateCountDiv =
    document.getElementById(
        "candidateCount"
    );


const signalCountDiv =
    document.getElementById(
        "signalCount"
    );


const stabilitySelect =
    document.getElementById(
        "stabilitySelect"
    );


const scoreSelect =
    document.getElementById(
        "scoreSelect"
    );


const maxSignalsSelect =
    document.getElementById(
        "maxSignalsSelect"
    );


/* =========================================================
   НАСТРОЙКИ
========================================================= */


function getStabilityTime() {

    return (
        parseInt(
            stabilitySelect.value
        ) || 5
    );

}


function getMinimumScore() {

    return (
        parseInt(
            scoreSelect.value
        ) || 60
    );

}


function getMaxSignals() {

    return (
        parseInt(
            maxSignalsSelect.value
        ) || 10
    );

}


/* =========================================================
   ПОРОГ
========================================================= */


function getThreshold(symbol) {

    const rank =
        symbolRanks.get(symbol);


    if (!rank) {

        return THRESHOLDS.top100;

    }


    if (rank <= 5) {

        return THRESHOLDS.top5;

    }


    if (rank <= 20) {

        return THRESHOLDS.top20;

    }


    if (rank <= 50) {

        return THRESHOLDS.top50;

    }


    return THRESHOLDS.top100;

}


/* =========================================================
   ФОРМАТИРОВАНИЕ
========================================================= */


function formatMoney(value) {

    return Number(value).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 0
        }
    );

}


function formatPrice(value) {

    const number =
        Number(value);


    if (
        number >= 1000
    ) {

        return number.toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 2
            }
        );

    }


    if (
        number >= 1
    ) {

        return number.toFixed(4);

    }


    return number.toFixed(6);

}


function formatThreshold(value) {

    if (
        value >= 1000000
    ) {

        return "$" +
            (
                value / 1000000
            ).toFixed(1) +
            "M";

    }


    return "$" +
        (
            value / 1000
        ).toFixed(0) +
        "K";

}


/* =========================================================
   NOTIFICATION
========================================================= */


function sendNotification(
    title,
    body
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "granted"
    ) {

        try {

            new Notification(
                title,
                {
                    body: body
                }
            );

        } catch (e) {}

    }

}


/* =========================================================
   СОЗДАНИЕ СТАКА
========================================================= */


function createOrderBook(
    symbol
) {

    orderBooks.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map()
        }
    );

}


/* =========================================================
   SNAPSHOT
========================================================= */


function applySnapshot(
    symbol,
    data
) {

    createOrderBook(
        symbol
    );


    const book =
        orderBooks.get(
            symbol
        );


    if (
        Array.isArray(data.b)
    ) {

        data.b.forEach(
            order => {

                const price =
                    String(order[0]);


                const qty =
                    parseFloat(
                        order[1]
                    );


                if (
                    qty > 0
                ) {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    if (
        Array.isArray(data.a)
    ) {

        data.a.forEach(
            order => {

                const price =
                    String(order[0]);


                const qty =
                    parseFloat(
                        order[1]
                    );


                if (
                    qty > 0
                ) {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    /*
     * После snapshot один раз
     * проверяем крупные заявки.
     */

    inspectSnapshot(
        symbol
    );

}


/* =========================================================
   DELTA
========================================================= */


function applyDelta(
    symbol,
    data
) {

    if (
        !orderBooks.has(
            symbol
        )
    ) {

        return;

    }


    const book =
        orderBooks.get(
            symbol
        );


    /*
     * ВАЖНО:
     *
     * Мы больше НЕ перебираем весь стакан.
     *
     * Проверяем только те цены,
     * которые реально изменились.
     */


    if (
        Array.isArray(data.b)
    ) {

        data.b.forEach(
            order => {

                processBookChange(
                    symbol,
                    book.bids,
                    order,
                    "Buy"
                );

            }
        );

    }


    if (
        Array.isArray(data.a)
    ) {

        data.a.forEach(
            order => {

                processBookChange(
                    symbol,
                    book.asks,
                    order,
                    "Sell"
                );

            }
        );

    }

}


/* =========================================================
   ОБРАБОТКА ИЗМЕНЕНИЯ ЗАЯВКИ
========================================================= */


function processBookChange(
    symbol,
    sideMap,
    order,
    side
) {

    const price =
        String(order[0]);


    const qty =
        parseFloat(
            order[1]
        );


    if (
        qty === 0
    ) {

        sideMap.delete(
            price
        );


        /*
         * Заявка исчезла.
         *
         * Кандидат удаляем.
         */

        const key =
            makeOrderKey(
                symbol,
                side,
                price
            );


        candidates.delete(
            key
        );


        return;

    }


    sideMap.set(
        price,
        qty
    );


    /*
     * Проверяем только эту заявку.
     */

    evaluateOrder(
        symbol,
        price,
        qty,
        side
    );

}


/* =========================================================
   SNAPSHOT ANALYSIS
========================================================= */


function inspectSnapshot(
    symbol
) {

    const book =
        orderBooks.get(
            symbol
        );


    if (!book) {

        return;

    }


    /*
     * Snapshot проверяем один раз.
     *
     * После этого работают только delta.
     */

    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        evaluateOrder(
            symbol,
            price,
            qty,
            "Buy"
        );

    }


    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        evaluateOrder(
            symbol,
            price,
            qty,
            "Sell"
        );

    }

}


/* =========================================================
   KEY
========================================================= */


function makeOrderKey(
    symbol,
    side,
    price
) {

    return (
        symbol +
        "_" +
        side +
        "_" +
        price
    );

}


/* =========================================================
   ОЦЕНКА КРУПНОЙ ЗАЯВКИ
========================================================= */


function evaluateOrder(
    symbol,
    price,
    qty,
    side
) {

    const priceNumber =
        Number(price);


    const qtyNumber =
        Number(qty);


    if (
        !isFinite(priceNumber) ||
        !isFinite(qtyNumber) ||
        priceNumber <= 0 ||
        qtyNumber <= 0
    ) {

        return;

    }


    const value =
        priceNumber *
        qtyNumber;


    const threshold =
        getThreshold(
            symbol
        );


    const key =
        makeOrderKey(
            symbol,
            side,
            price
        );


    /*
     * Если заявка стала меньше порога,
     * она больше не кандидат.
     */

    if (
        value < threshold
    ) {

        candidates.delete(
            key
        );

        activeSignals.delete(
            key
        );

        return;

    }


    const now =
        Date.now();


    /*
     * Уже существует.
     */

    if (
        candidates.has(
            key
        )
    ) {

        const candidate =
            candidates.get(
                key
            );


        /*
         * Если заявка сильно изменилась,
         * обновляем её.
         */

        candidate.lastValue =
            value;


        candidate.lastQty =
            qtyNumber;


        candidate.lastSeen =
            now;


        /*
         * Отслеживаем максимальный размер.
         */

        if (
            value >
            candidate.maxValue
        ) {

            candidate.maxValue =
                value;

        }


        return;

    }


    /*
     * Новая крупная заявка.
     */

    candidates.set(
        key,
        {

            key,

            symbol,

            side,

            price: priceNumber,

            firstSeen: now,

            lastSeen: now,

            lastValue: value,

            maxValue: value,

            threshold

        }
    );


    /*
     * Ограничиваем память.
     */

    if (
        candidates.size >
        MAX_CANDIDATES
    ) {

        cleanupOldCandidates();

    }

}


/* =========================================================
   ОЧИСТКА СТАРЫХ КАНДИДАТОВ
========================================================= */


function cleanupOldCandidates() {

    const now =
        Date.now();


    for (
        const [
            key,
            candidate
        ]
        of candidates
    ) {

        if (
            now -
            candidate.lastSeen >
            ORDER_CLEANUP_TIME
        ) {

            candidates.delete(
                key
            );

        }

    }


    /*
     * Если всё ещё слишком много,
     * удаляем самые старые.
     */

    if (
        candidates.size >
        MAX_CANDIDATES
    ) {

        const sorted =
            [...candidates.values()]
                .sort(
                    (
                        a,
                        b
                    ) =>
                        a.lastSeen -
                        b.lastSeen
                );


        const removeCount =
            candidates.size -
            MAX_CANDIDATES;


        for (
            let i = 0;
            i < removeCount;
            i++
        ) {

            candidates.delete(
                sorted[i].key
            );

        }

    }

}


/* =========================================================
   SCORE
========================================================= */


/*
 * Score 0–100.
 *
 * Состав:
 *
 * размер заявки       0–25
 * время удержания     0–20
 * размер относительно
 * порога              0–15
 * движение цены       0–15
 * изменение объёма    0–15
 * стабильность        0–10
 */


function calculateScore(
    candidate
) {

    const market =
        marketData.get(
            candidate.symbol
        );


    const aliveSeconds =
        (
            Date.now() -
            candidate.firstSeen
        ) / 1000;


    let score =
        0;


    /*
     * =====================================================
     * 1. РАЗМЕР ЗАЯВКИ — 25
     * =====================================================
     */


    const sizeRatio =
        candidate.lastValue /
        candidate.threshold;


    if (
        sizeRatio >= 4
    ) {

        score += 25;

    }

    else if (
        sizeRatio >= 3
    ) {

        score += 22;

    }

    else if (
        sizeRatio >= 2
    ) {

        score += 18;

    }

    else if (
        sizeRatio >= 1.5
    ) {

        score += 12;

    }

    else {

        score += 7;

    }


    /*
     * =====================================================
     * 2. ДЛИТЕЛЬНОСТЬ — 20
     * =====================================================
     */


    const required =
        getStabilityTime();


    if (
        aliveSeconds >= 20
    ) {

        score += 20;

    }

    else if (
        aliveSeconds >= 15
    ) {

        score += 18;

    }

    else if (
        aliveSeconds >= 10
    ) {

        score += 15;

    }

    else if (
        aliveSeconds >= required
    ) {

        score += 10;

    }


    /*
     * =====================================================
     * 3. РАЗМЕР ОТНОСИТЕЛЬНО ПОРОГА — 15
     * =====================================================
     */


    if (
        sizeRatio >= 3
    ) {

        score += 15;

    }

    else if (
        sizeRatio >= 2
    ) {

        score += 12;

    }

    else if (
        sizeRatio >= 1.5
    ) {

        score += 8;

    }

    else {

        score += 5;

    }


    /*
     * =====================================================
     * 4. ЦЕНА — 15
     * =====================================================
     *
     * Для BUY:
     *
     * цена растёт = хорошо
     *
     * Для SELL:
     *
     * цена падает = хорошо
     */


    if (
        market
    ) {

        const priceChange =
            market.priceChange1m;


        if (
            candidate.side ===
            "Buy"
        ) {

            if (
                priceChange >= 1
            ) {

                score += 15;

            }

            else if (
                priceChange >= 0.5
            ) {

                score += 12;

            }

            else if (
                priceChange > 0
            ) {

                score += 8;

            }

            else if (
                priceChange > -0.5
            ) {

                score += 4;

            }

        }

        else {

            if (
                priceChange <= -1
            ) {

                score += 15;

            }

            else if (
                priceChange <= -0.5
            ) {

                score += 12;

            }

            else if (
                priceChange < 0
            ) {

                score += 8;

            }

            else if (
                priceChange < 0.5
            ) {

                score += 4;

            }

        }

    }


    /*
     * =====================================================
     * 5. ОБЪЁМ — 15
     * =====================================================
     */


    if (
        market
    ) {

        const volumeChange =
            market.volumeChange;


        if (
            volumeChange >= 200
        ) {

            score += 15;

        }

        else if (
            volumeChange >= 100
        ) {

            score += 12;

        }

        else if (
            volumeChange >= 50
        ) {

            score += 9;

        }

        else if (
            volumeChange >= 20
        ) {

            score += 6;

        }

        else if (
            volumeChange > 0
        ) {

            score += 3;

        }

    }


    /*
     * =====================================================
     * 6. СТАБИЛЬНОСТЬ — 10
     * =====================================================
     */


    if (
        candidate.lastValue >=
        candidate.maxValue * 0.95
    ) {

        score += 10;

    }

    else if (
        candidate.lastValue >=
        candidate.maxValue * 0.8
    ) {

        score += 7;

    }

    else if (
        candidate.lastValue >=
        candidate.maxValue * 0.6
    ) {

        score += 4;

    }


    return Math.min(
        100,
        Math.round(score)
    );

}


/* =========================================================
   АНАЛИЗ КАНДИДАТОВ
========================================================= */


function analyzeCandidates() {

    if (
        !isRunning
    ) {

        return;

    }


    const now =
        Date.now();


    const minimumScore =
        getMinimumScore();


    /*
     * Удаляем исчезнувшие заявки.
     */

    for (
        const [
            key,
            candidate
        ]
        of candidates
    ) {

        if (
            now -
            candidate.lastSeen >
            ORDER_CLEANUP_TIME
        ) {

            candidates.delete(
                key
            );

            activeSignals.delete(
                key
            );

        }

    }


    /*
     * Рассчитываем Score.
     */

    const signals = [];


    for (
        const candidate
        of candidates.values()
    ) {

        const aliveSeconds =
            (
                now -
                candidate.firstSeen
            ) / 1000;


        /*
         * Заявка ещё не подтверждена.
         */

        if (
            aliveSeconds <
            getStabilityTime()
        ) {

            continue;

        }


        const score =
            calculateScore(
                candidate
            );


        /*
         * Ниже минимального Score
         * на экран не попадает.
         */

        if (
            score <
            minimumScore
        ) {

            continue;

        }


        signals.push({

            ...candidate,

            score,

            aliveSeconds

        });

    }


    /*
     * Сначала самые сильные.
     */

    signals.sort(
        (
            a,
            b
        ) => {

            /*
             * Сначала Score.
             */

            if (
                b.score !==
                a.score
            ) {

                return (
                    b.score -
                    a.score
                );

            }


            /*
             * Если Score одинаковый —
             * большая заявка выше.
             */

            return (
                b.lastValue -
                a.lastValue
            );

        }
    );


    const topSignals =
        signals.slice(
            0,
            getMaxSignals()
        );


    /*
     * Обновляем экран.
     */

    renderSignals(
        topSignals
    );


    /*
     * Статистика.
     */

    candidateCountDiv.innerText =
        candidates.size;


    /*
     * Сигналы могут быть
     * не только те, что сейчас
     * отображаются.
     */

}


/* =========================================================
   RENDER
========================================================= */


function renderSignals(
    signals
) {

    if (
        displayPaused
    ) {

        return;

    }


    const existing =
        new Map();


    Array.from(
        notificationsDiv.children
    ).forEach(
        element => {

            if (
                element.dataset &&
                element.dataset.key
            ) {

                existing.set(
                    element.dataset.key,
                    element
                );

            }

        }
    );


    const usedKeys =
        new Set();


    /*
     * Если ничего нет.
     */

    if (
        signals.length === 0
    ) {

        if (
            !document.getElementById(
                "emptyMessage"
            )
        ) {

            notificationsDiv.innerHTML = `

                <div
                    id="emptyMessage"
                    class="empty"
                >
                    🔎 Сильных сигналов пока нет.<br>
                    Сканер продолжает анализировать рынок.
                </div>

            `;

        }

        return;

    }


    const empty =
        document.getElementById(
            "emptyMessage"
        );


    if (
        empty
    ) {

        empty.remove();

    }


    /*
     * Создаём / обновляем карточки.
     */

    signals.forEach(
        (
            signal,
            index
        ) => {

            usedKeys.add(
                signal.key
            );


            let element =
                existing.get(
                    signal.key
                );


            if (
                !element
            ) {

                element =
                    document.createElement(
                        "div"
                    );

                element.dataset.key =
                    signal.key;

                notificationsDiv.appendChild(
                    element
                );

            }


            updateSignalCard(
                element,
                signal,
                index + 1
            );

        }
    );


    /*
     * Удаляем карточки,
     * которые больше не входят
     * в TOP.
     */

    existing.forEach(
        (
            element,
            key
        ) => {

            if (
                !usedKeys.has(
                    key
                )
            ) {

                element.remove();

            }

        }
    );


    /*
     * Правильный порядок.
     *
     * Используем DOM move,
     * а не пересоздание всех карточек.
     */

    signals.forEach(
        signal => {

            const element =
                existing.get(
                    signal.key
                ) ||
                document.querySelector(
                    `[data-key="${CSS.escape(signal.key)}"]`
                );


            if (
                element
            ) {

                notificationsDiv.appendChild(
                    element
                );

            }

        }
    );

}

/* =========================================================
   ЗАГРУЗКА TOP-100
========================================================= */


async function loadSymbols() {

    try {

        statusDiv.innerText =
            "Загрузка TOP-100...";


        statusDiv.style.color =
            "#f7931a";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear"
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Некорректный ответ Bybit"
            );

        }


        const topCoins =
            json.result.list

                .filter(
                    coin =>

                        coin.symbol &&

                        coin.symbol.endsWith(
                            "USDT"
                        ) &&

                        parseFloat(
                            coin.turnover24h
                        ) > 0

                )

                .sort(
                    (
                        a,
                        b
                    ) =>

                        parseFloat(
                            b.turnover24h
                        ) -

                        parseFloat(
                            a.turnover24h
                        )

                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length =
            0;


        symbolRanks.clear();


        topCoins.forEach(
            (
                coin,
                index
            ) => {

                const symbol =
                    coin.symbol;


                symbols.push(
                    symbol
                );


                symbolRanks.set(
                    symbol,
                    index + 1
                );


                updateMarketData(
                    symbol,
                    parseFloat(
                        coin.lastPrice
                    ),
                    parseFloat(
                        coin.turnover24h
                    )
                );

            }
        );


        coinCountDiv.innerText =
            symbols.length;


        return true;


    } catch (error) {

        console.error(
            "Ошибка TOP-100:",
            error
        );


        statusDiv.innerText =
            "Ошибка загрузки TOP-100";


        statusDiv.style.color =
            "#e74c3c";


        return false;

    }

}


/* =========================================================
   MARKET DATA
========================================================= */


function updateMarketData(
    symbol,
    price,
    turnover24h
) {

    if (
        !isFinite(price) ||
        price <= 0
    ) {

        return;

    }


    const now =
        Date.now();


    let data =
        marketData.get(
            symbol
        );


    if (
        !data
    ) {

        data = {

            symbol,

            price,

            previousPrice:
                price,

            turnover24h,

            previousTurnover:
                turnover24h,

            priceSamples: [

                {
                    time: now,
                    price
                }

            ],

            volumeSamples: [

                {
                    time: now,
                    turnover:
                        turnover24h
                }

            ],

            priceChange1m: 0,

            volumeChange: 0

        };


        marketData.set(
            symbol,
            data
        );


        return;

    }


    data.previousPrice =
        data.price;


    data.price =
        price;


    data.previousTurnover =
        data.turnover24h;


    data.turnover24h =
        turnover24h;


    data.priceSamples.push({

        time: now,

        price

    });


    data.volumeSamples.push({

        time: now,

        turnover:
            turnover24h

    });


    /*
     * Оставляем примерно
     * 2 минуты истории.
     */

    const cutoff =
        now -
        2 * 60 * 1000;


    data.priceSamples =
        data.priceSamples.filter(
            item =>
                item.time >= cutoff
        );


    data.volumeSamples =
        data.volumeSamples.filter(
            item =>
                item.time >= cutoff
        );


    /*
     * Находим точку около
     * 1 минуты назад.
     */

    const target =
        now -
        60 * 1000;


    let oldPrice =
        null;


    for (
        let i =
            data.priceSamples.length -
            1;

        i >= 0;

        i--
    ) {

        if (
            data.priceSamples[i].time <=
            target
        ) {

            oldPrice =
                data.priceSamples[i].price;

            break;

        }

    }


    if (
        oldPrice &&
        oldPrice > 0
    ) {

        data.priceChange1m =
            (
                (
                    price -
                    oldPrice
                ) /
                oldPrice
            ) *
            100;

    }


    /*
     * Здесь turnover24h —
     * накопительный оборот.
     *
     * Сравниваем прирост
     * за последние интервалы.
     */

    const recentSamples =
        data.volumeSamples;


    if (
        recentSamples.length >= 2
    ) {

        const oldest =
            recentSamples[0];


        const newest =
            recentSamples[
                recentSamples.length - 1
            ];


        const turnoverDiff =
            newest.turnover -
            oldest.turnover;


        /*
         * Относительная оценка
         * активности.
         *
         * Это именно индикатор
         * ускорения оборота,
         * а не абсолютный объём.
         */

        if (
            oldest.turnover > 0
        ) {

            const base =
                Math.max(
                    oldest.turnover *
                    0.00001,
                    1
                );


            data.volumeChange =
                Math.min(
                    500,
                    (
                        turnoverDiff /
                        base
                    ) *
                    100
                );

        }

    }

}

   ОБНОВЛЕНИЕ MARKET DATA
========================================================= */


async function refreshMarketData() {

    if (
        !isRunning
    ) {

        return;

    }


    try {

            await fetch(

        const json =

        if (

            !Array.isArray(

        );

}


/* =========================================================
   HEARTBEAT
========================================================= */


function startHeartbeat() {

    stopHeartbeat();


    heartbeatTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


function stopHeartbeat() {

    if (
        heartbeatTimer
    ) {

        clearInterval(
            heartbeatTimer
        );


        heartbeatTimer =
            null;

    }

}


/* =========================================================
   WEBSOCKET
========================================================= */


function connectWebSocket() {

    if (
        !isRunning
    ) {

        return;

    }


    if (
        ws
    ) {

        try {

            ws.close();

        } catch (e) {}

    }


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen =
        () => {

            console.log(
                "WebSocket connected"
            );


            wsStatusDiv.innerText =
                "ON";


            wsStatusDiv.className =
                "green";


            statusDiv.innerText =
                "Сканирование активно";


            statusDiv.style.color =
                "#27ae60";


            /*
             * Подписываемся на TOP-100.
             */

            const topics =
                symbols.map(
                    symbol =>
                        `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
                );


            ws.send(
                JSON.stringify({

                    op:
                        "subscribe",

                    args:
                        topics

                })
            );


            startHeartbeat();

        };


    ws.onmessage =
        handleWebSocketMessage;


    ws.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );


            wsStatusDiv.innerText =
                "ERROR";


            wsStatusDiv.className =
                "red";

        };


    ws.onclose =
        () => {

            stopHeartbeat();


            wsStatusDiv.innerText =
                "OFF";


            wsStatusDiv.className =
                "red";


            if (
                isRunning
            ) {

                statusDiv.innerText =
                    "Переподключение...";


                statusDiv.style.color =
                    "#f7931a";


                scheduleReconnect();

            }

        };

}


/* =========================================================
   WS MESSAGE
========================================================= */


function handleWebSocketMessage(
    event
) {

    try {

        const data =
            JSON.parse(
                event.data
            );


        if (
            !data.topic
        ) {

            return;

        }


        if (
            !data.topic.startsWith(
                "orderbook."
            )
        ) {

            return;

        }


        const parts =
            data.topic.split(
                "."
            );


        const symbol =
            parts[2];


        if (
            !symbol ||
            !symbolRanks.has(
                symbol
            )
        ) {

            return;

        }


        if (
            data.type ===
            "snapshot"
        ) {

            applySnapshot(
                symbol,
                data.data
            );

        }


        else if (
            data.type ===
            "delta"
        ) {

            applyDelta(
                symbol,
                data.data
            );

        }


    } catch (error) {

        console.error(
            "WS processing error:",
            error
        );

    }

}


/* =========================================================
   RECONNECT
========================================================= */


function scheduleReconnect() {

    if (
        !isRunning
    ) {

        return;

    }


    if (
        reconnectTimer
    ) {

        return;

    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;


                connectWebSocket();

            },
            3000
        );

}

async function startScan() {

    if (
        isRunning
    ) {

        return;

    }


    isRunning =
        true;


    statusDiv.innerText =
        "Загрузка TOP-100...";


    statusDiv.style.color =
        "#f7931a";


    /*
     * Browser notification.
     */

    if (
        "Notification" in window &&
        Notification.permission ===
        "default"
    ) {

        try {

            await Notification.requestPermission();

        } catch (e) {}

    }


    const success =
        await loadSymbols();


    if (
        !success
    ) {

        isRunning =
            false;

        return;

    }


    /*
     * WebSocket.
     */

    connectWebSocket();


    /*
     * Анализ раз в секунду.
     */

    startDisplayLoop();


    /*
     * Market data.
     */

    await refreshMarketData();


    marketDataTimer =
        setInterval(
            refreshMarketData,
            MARKET_DATA_INTERVAL
        );


    /*
     * TOP-100 каждые 5 минут.
     */

    symbolRefreshTimer =
        setInterval(
            refreshSymbols,
            SYMBOL_REFRESH_TIME
        );

}

   STOP
========================================================= */


function stopScan() {

    isRunning =
        false;


    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );


        reconnectTimer =
            null;

    }


    if (
        symbolRefreshTimer
    ) {

        clearInterval(
            symbolRefreshTimer
        );


        symbolRefreshTimer =
            null;

    }


    if (
        marketDataTimer
    ) {

        clearInterval(
            marketDataTimer
        );


        marketDataTimer =
            null;

    }


    stopDisplayLoop();


    stopHeartbeat();


    if (

    ) {

        try {

            ws.close();

        } catch (e) {}


        ws =
            null;

    }


    orderBooks.clear();


    candidates.clear();


    activeSignals.clear();


    statusDiv.innerText =
