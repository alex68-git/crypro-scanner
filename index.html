<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Whale Flow Scanner</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #0b0e11;
    color: #eaecef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* =========================
   HEADER & CONTROLS
========================= */
.header {
    background: #1e2329;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

h1 {
    font-size: 20px;
    margin: 0 0 15px 0;
}

.controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

button, select {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: bold;
    cursor: pointer;
}

button {
    background: #f7931a;
    color: #1e2329;
}

button.stop {
    background: #e74c3c;
    color: white;
}

button.clear {
    background: #555;
    color: white;
}

select {
    background: #2b3139;
    color: white;
}

.status {
    color: #848e9c;
    font-size: 13px;
    margin-top: 8px;
}

/* =========================
   STATS & CARDS
========================= */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.stat {
    background: #161a1e;
    border-radius: 8px;
    padding: 9px;
    text-align: center;
    font-size: 11px;
}

.stat-value {
    display: block;
    font-size: 15px;
    font-weight: bold;
    margin-top: 4px;
}

.section-title {
    color: #848e9c;
    font-size: 14px;
    margin: 15px 0 8px;
}

.signals {
    height: 70vh;
    min-height: 400px;
    overflow-y: auto;
}

.signal {
    background: #1e2329;
    border-radius: 11px;
    padding: 13px;
    margin-bottom: 9px;
    border-left: 5px solid #555;
}

.signal.long { border-left-color: #27ae60; }
.signal.short { border-left-color: #e74c3c; }
.signal.breakout { border-left-color: #f7931a; }

.signal-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.symbol { font-size: 17px; font-weight: bold; }
.direction { font-weight: bold; font-size: 13px; }
.score { font-size: 21px; font-weight: bold; margin-top: 5px; }

.data-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
    margin-top: 10px;
}

.data-box {
    background: #161a1e;
    padding: 8px;
    border-radius: 7px;
    font-size: 11px;
    color: #848e9c;
}

.data-box strong {
    display: block;
    color: #eaecef;
    font-size: 13px;
    margin-top: 3px;
}

.reason {
    margin-top: 9px;
    padding: 8px;
    border-radius: 7px;
    background: #161a1e;
    font-size: 12px;
    line-height: 1.5;
}

.empty {
    text-align: center;
    color: #848e9c;
    padding: 60px 15px;
}

.green { color: #27ae60; }
.red { color: #e74c3c; }
.orange { color: #f7931a; }
.blue { color: #3498db; }
.gray { color: #848e9c; }

@media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .signals { height: 65vh; }
}
</style>
</head>

<body>

<div class="header">
    <h1>🐋 Bybit Whale Flow Scanner</h1>

    <div class="controls">
        <button onclick="startScanner()">▶ Запустить</button>
        <button class="stop" onclick="stopScanner()">⏹ Стоп</button>
        <button class="clear" onclick="clearSignals()">🗑 Очистить</button>
    </div>

    <div class="controls">
        <label>
            Подтверждение стены:
            <select id="wallAge">
                <option value="3">3 сек</option>
                <option value="5" selected>5 сек</option>
                <option value="10">10 сек</option>
            </select>
        </label>

        <label>
            Минимальный Score:
            <select id="minScore">
                <option value="60">60</option>
                <option value="70" selected>70</option>
                <option value="80">80</option>
            </select>
        </label>
    </div>

    <div class="status">
        Статус: <span id="status">Остановлен</span>
    </div>

    <div class="stats">
        <div class="stat">TOP <span id="coinCount" class="stat-value">0</span></div>
        <div class="stat">WS <span id="wsStatus" class="stat-value">OFF</span></div>
        <div class="stat">Кандидатов <span id="candidateCount" class="stat-value">0</span></div>
        <div class="stat">Сигналов <span id="signalCount" class="stat-value">0</span></div>
    </div>
</div>

<div class="section-title">🔥 Лучшие текущие торговые ситуации</div>

<div id="signals" class="signals">
    <div id="empty" class="empty">
        Запусти сканер.<br><br>
        Он будет искать:<br>
        🟢 LONG<br>
        🔴 SHORT<br>
        🟠 BREAKOUT
    </div>
</div>

<script>
/* =====================================================
   CONFIG & STATE
===================================================== */
const MAX_SYMBOLS = 100;
const ORDERBOOK_DEPTH = 50;
const MAX_SIGNALS = 10;
const ANALYSIS_INTERVAL = 500;
const UI_INTERVAL = 1000;
const SYMBOL_REFRESH = 5 * 60 * 1000;
const MIN_WALL_RATIO = 3;

const BASE_THRESHOLDS = {
    top5: 500000,
    top20: 300000,
    top50: 150000,
    top100: 50000
};

const MAX_WALL_DISTANCE = 0.008;
const TRADE_WINDOW = 10000;
const PRICE_WINDOW = 60000;

let ws = null;
let running = false;
let reconnectTimer = null;
let symbolRefreshTimer = null;
let analysisTimer = null;
let uiTimer = null;

const symbols = [];
const symbolRanks = new Map();
const books = new Map();
const trades = new Map();
const wallHistory = new Map();
const signals = new Map();

/* =====================================================
   DOM ELEMENTS
===================================================== */
const statusEl = document.getElementById("status");
const wsEl = document.getElementById("wsStatus");
const coinCountEl = document.getElementById("coinCount");
const candidateCountEl = document.getElementById("candidateCount");
const signalCountEl = document.getElementById("signalCount");
const signalsEl = document.getElementById("signals");

/* =====================================================
   HELPERS
===================================================== */
function now() { return Date.now(); }

function money(value) {
    return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function priceFormat(value) {
    const n = Number(value);
    if (n >= 1000) return n.toFixed(2);
    if (n >= 1) return n.toFixed(4);
    return n.toFixed(8);
}

function percent(value) {
    return (value * 100).toFixed(2) + "%";
}

function getBaseThreshold(symbol) {
    const rank = symbolRanks.get(symbol);
    if (!rank) return 50000;
    if (rank <= 5) return BASE_THRESHOLDS.top5;
    if (rank <= 20) return BASE_THRESHOLDS.top20;
    if (rank <= 50) return BASE_THRESHOLDS.top50;
    return BASE_THRESHOLDS.top100;
}

/* =====================================================
   ORDERBOOK & TRADE PROCESSING
===================================================== */
function createBook(symbol) {
    books.set(symbol, { bids: new Map(), asks: new Map(), lastPrice: null });
}

function applySnapshot(symbol, data) {
    createBook(symbol);
    const book = books.get(symbol);
    if (Array.isArray(data.b)) {
        for (const order of data.b) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (price > 0 && qty > 0) book.bids.set(price, qty);
        }
    }
    if (Array.isArray(data.a)) {
        for (const order of data.a) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (price > 0 && qty > 0) book.asks.set(price, qty);
        }
    }
}

function applyDelta(symbol, data) {
    const book = books.get(symbol);
    if (!book) return;
    if (Array.isArray(data.b)) {
        for (const order of data.b) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (qty === 0) book.bids.delete(price);
            else book.bids.set(price, qty);
        }
    }
    if (Array.isArray(data.a)) {
        for (const order of data.a) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (qty === 0) book.asks.delete(price);
            else book.asks.set(price, qty);
        }
    }
}

function processTrade(data) {
    if (!Array.isArray(data)) return;
    for (const trade of data) {
        const symbol = trade.s, side = trade.S;
        const price = parseFloat(trade.p), qty = parseFloat(trade.v);
        const timestamp = Number(trade.T) || now();
        if (!symbol || !price || !qty) continue;

        if (!trades.has(symbol)) trades.set(symbol, []);
        const list = trades.get(symbol);
        list.push({ time: timestamp, side, price, qty, value: price * qty });

        const book = books.get(symbol);
        if (book) book.lastPrice = price;

        const cutoff = now() - PRICE_WINDOW;
        while (list.length && list[0].time < cutoff) list.shift();
    }
}

function getTradeFlow(symbol) {
    const list = trades.get(symbol) || [];
    const cutoff = now() - TRADE_WINDOW;
    let buy = 0, sell = 0, buyCount = 0, sellCount = 0;

    for (let i = list.length - 1; i >= 0; i--) {
        const t = list[i];
        if (t.time < cutoff) break;
        if (t.side === "Buy") { buy += t.value; buyCount++; }
        else { sell += t.value; sellCount++; }
    }
    const total = buy + sell;
    const imbalance = total > 0 ? (buy - sell) / total : 0;
    return { buy, sell, total, imbalance, buyCount, sellCount };
}

function getPriceChange(symbol) {
    const list = trades.get(symbol) || [];
    if (list.length < 2) return 0;
    const latest = list[list.length - 1];
    const cutoff = now() - PRICE_WINDOW;
    let old = null;

    for (let i = 0; i < list.length; i++) {
        if (list[i].time >= cutoff) { old = list[i]; break; }
    }
    if (!old || !old.price) return 0;
    return (latest.price - old.price) / old.price;
}

function getLocalLiquidity(book, side, currentPrice) {
    if (!book || !currentPrice) return 1;
    const source = side === "Buy" ? book.bids : book.asks;
    const values = [];

    for (const [price, qty] of source) {
        if (Math.abs(price - currentPrice) / currentPrice <= 0.003) {
            const val = price * qty;
            if (val > 0) values.push(val);
        }
    }
    if (values.length === 0) return 1;
    values.sort((a, b) => a - b);
    return values[Math.floor(values.length / 2)];
}

/* =====================================================
   ANALYSIS & SCORE
===================================================== */
function findWalls(symbol) {
    const book = books.get(symbol);
    if (!book) return [];

    let currentPrice = book.lastPrice;
    if (!currentPrice) {
        const bids = [...book.bids.keys()].sort((a, b) => b - a);
        const asks = [...book.asks.keys()].sort((a, b) => a - b);
        if (bids.length && asks.length) currentPrice = (bids[0] + asks[0]) / 2;
    }
    if (!currentPrice) return [];

    const result = [];
    const threshold = getBaseThreshold(symbol);

    // BUY WALLS
    for (const [price, qty] of book.bids) {
        const distance = (currentPrice - price) / currentPrice;
        if (distance < 0 || distance > MAX_WALL_DISTANCE) continue;
        const value = price * qty;
        const local = getLocalLiquidity(book, "Buy", currentPrice);
        const ratio = value / Math.max(local, 1);

        if (value >= threshold && ratio >= MIN_WALL_RATIO) {
            result.push({ symbol, side: "Buy", price, qty, value, distance, ratio, currentPrice });
        }
    }

    // SELL WALLS
    for (const [price, qty] of book.asks) {
        const distance = (price - currentPrice) / currentPrice;
        if (distance < 0 || distance > MAX_WALL_DISTANCE) continue;
        const value = price * qty;
        const local = getLocalLiquidity(book, "Sell", currentPrice);
        const ratio = value / Math.max(local, 1);

        if (value >= threshold && ratio >= MIN_WALL_RATIO) {
            result.push({ symbol, side: "Sell", price, qty, value, distance, ratio, currentPrice });
        }
    }

    result.sort((a, b) => b.value - a.value);
    return result.slice(0, 6);
}

function updateWallHistory(wall) {
    const key = `${wall.symbol}_${wall.side}_${wall.price}`;
    if (!wallHistory.has(key)) {
        wallHistory.set(key, { firstSeen: now(), lastSeen: now(), lastValue: wall.value });
    } else {
        const item = wallHistory.get(key);
        item.lastSeen = now();
        item.lastValue = wall.value;
    }
    return wallHistory.get(key);
}

function calculateScore(wall, flow, priceChange, age) {
    let score = 0;
    const threshold = getBaseThreshold(wall.symbol);

    // 1. Размер стены (Корректная проверка без отрицательного логарифма)
    const sizeRatio = wall.value / Math.max(threshold, 1);
    const sizeScore = Math.min(20, Math.log10(Math.max(sizeRatio, 1)) * 10);
    score += Math.max(0, sizeScore);

    // 2. Relative wall ratio
    score += Math.min(20, wall.ratio * 5);

    // 3. Возраст стены
    score += Math.min(15, age / 1000);

    // 4. Агрессивный поток
    const alignedFlow = wall.side === "Buy" ? Math.max(0, flow.imbalance) : Math.max(0, -flow.imbalance);
    score += alignedFlow * 25;

    // 5. Изменение цены
    const alignedPrice = wall.side === "Buy" ? Math.max(0, priceChange) : Math.max(0, -priceChange);
    score += Math.min(20, alignedPrice * 1000);

    return Math.min(100, Math.round(score));
}

function determineSetup(wall, flow, priceChange) {
    if (wall.side === "Buy") {
        if (flow.imbalance > 0.15 && priceChange > 0) return "LONG";
        if (flow.imbalance < -0.20 && priceChange < 0) return "SHORT";
    }
    if (wall.side === "Sell") {
        if (flow.imbalance < -0.15 && priceChange < 0) return "SHORT";
        if (flow.imbalance > 0.20 && priceChange > 0) return "LONG";
    }
    return null;
}

function analyzeSymbol(symbol) {
    const book = books.get(symbol);
    if (!book) return;

    const wallsFound = findWalls(symbol);
    const flow = getTradeFlow(symbol);
    const priceChange = getPriceChange(symbol);

    for (const wall of wallsFound) {
        const history = updateWallHistory(wall);
        const age = now() - history.firstSeen;
        const requiredAge = parseInt(document.getElementById("wallAge").value) * 1000;

        if (age < requiredAge) continue;
        const setup = determineSetup(wall, flow, priceChange);
        if (!setup) continue;

        const score = calculateScore(wall, flow, priceChange, age);
        const minScore = parseInt(document.getElementById("minScore").value);
        if (score < minScore) continue;

        const key = `${symbol}_${wall.side}_${wall.price}`;
        signals.set(key, {
            key, symbol, rank: symbolRanks.get(symbol), setup, score, wall, flow, priceChange, age, updated: now()
        });
    }
}

function analyzeAll() {
    if (!running) return;
    for (const symbol of symbols) analyzeSymbol(symbol);

    const expiry = now() - 5000;
    for (const [key, signal] of signals) {
        if (signal.updated < expiry) signals.delete(key);
    }
}

/* =====================================================
   RENDER
===================================================== */
function renderSignals() {
    const sorted = [...signals.values()].sort((a, b) => b.score - a.score).slice(0, MAX_SIGNALS);
    candidateCountEl.innerText = signals.size;
    signalCountEl.innerText = sorted.length;

    if (sorted.length === 0) {
        signalsEl.innerHTML = `
            <div class="empty">
                🔎 Ищем ситуацию...<br><br>
                Пока нет подтверждённого LONG / SHORT сетапа.
            </div>`;
        return;
    }

    let html = "";
    for (const s of sorted) {
        let directionIcon = "🟢", directionClass = "long";
        if (s.setup === "SHORT") { directionIcon = "🔴"; directionClass = "short"; }
        if (s.setup === "BREAKOUT") { directionIcon = "🟠"; directionClass = "breakout"; }

        const wallSide = s.wall.side === "Buy" ? "BUY WALL" : "SELL WALL";
        const alignedFlow = s.wall.side === "Buy" ? s.flow.buy : s.flow.sell;
        const oppositeFlow = s.wall.side === "Buy" ? s.flow.sell : s.flow.buy;
        const reason = s.wall.side === "Buy"
            ? (s.flow.imbalance > 0 ? "BUY wall + агрессивные покупки" : "BUY wall + давление продавцов")
            : (s.flow.imbalance < 0 ? "SELL wall + агрессивные продажи" : "SELL wall + агрессивные покупки");

        html += `
            <div class="signal ${directionClass}">
                <div class="signal-top">
                    <div class="symbol">${directionIcon} ${s.symbol} <span class="gray">#${s.rank}</span></div>
                    <div class="direction">${s.setup}</div>
                </div>
                <div class="score">Score: ${s.score}/100</div>
                <div class="data-grid">
                    <div class="data-box">Лимитная ликвидность<strong>${wallSide} $${money(s.wall.value)}</strong></div>
                    <div class="data-box">Цена стены<strong>${priceFormat(s.wall.price)}</strong></div>
                    <div class="data-box">Относительный размер<strong>${s.wall.ratio.toFixed(1)}x</strong></div>
                    <div class="data-box">Стена живёт<strong>${(s.age / 1000).toFixed(1)} сек</strong></div>
                    <div class="data-box">Aggressive BUY<strong class="green">$${money(s.flow.buy)}</strong></div>
                    <div class="data-box">Aggressive SELL<strong class="red">$${money(s.flow.sell)}</strong></div>
                    <div class="data-box">BUY/SELL imbalance<strong>${percent(s.flow.imbalance)}</strong></div>
                    <div class="data-box">Цена / 1 мин<strong>${percent(s.priceChange)}</strong></div>
                </div>
                <div class="reason">
                    💡 ${reason}<br>
                    📍 До стены: ${percent(s.wall.distance)}<br>
                    ⚡ Aggressive flow: $${money(alignedFlow)} vs $${money(oppositeFlow)}
                </div>
            </div>`;
    }
    signalsEl.innerHTML = html;
}

/* =====================================================
   WEBSOCKET (FIXED FOR BYBIT LIMITS)
===================================================== */
function connectWebSocket() {
    if (!running) return;

    if (ws) {
        try { ws.onclose = null; ws.close(); } catch (e) {}
    }

    ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");

    ws.onopen = async () => {
        wsEl.innerText = "ON";
        wsEl.className = "stat-value green";
        statusEl.innerText = "Сканирование активно";
        statusEl.style.color = "#27ae60";

        const args = [];
        for (const symbol of symbols) {
            args.push(`orderbook.${ORDERBOOK_DEPTH}.${symbol}`);
            args.push(`publicTrade.${symbol}`);
        }

        // ИСПРАВЛЕНИЕ: Отправка подписок пакетами по 10 штук с паузой
        const chunkSize = 10;
        for (let i = 0; i < args.length; i += chunkSize) {
            if (!running || ws.readyState !== WebSocket.OPEN) break;
            const chunk = args.slice(i, i + chunkSize);
            ws.send(JSON.stringify({ op: "subscribe", args: chunk }));
            await new Promise(resolve => setTimeout(resolve, 50));
        }
    };

    ws.onmessage = event => {
        try {
            const data = JSON.parse(event.data);
            if (data.op === "pong") return;
            if (!data.topic) return;

            if (data.topic.startsWith("orderbook.")) {
                const symbol = data.topic.split(".")[2];
                if (data.type === "snapshot") applySnapshot(symbol, data.data);
                else if (data.type === "delta") applyDelta(symbol, data.data);
            } else if (data.topic.startsWith("publicTrade.")) {
                processTrade(data.data);
            }
        } catch (error) {
            console.error("WS message error:", error);
        }
    };

    ws.onerror = error => {
        console.error("WebSocket error:", error);
        wsEl.innerText = "ERROR";
        wsEl.className = "stat-value red";
    };

    ws.onclose = () => {
        wsEl.innerText = "OFF";
        wsEl.className = "stat-value red";
        if (running) {
            statusEl.innerText = "Переподключение...";
            statusEl.style.color = "#f7931a";
            reconnectTimer = setTimeout(connectWebSocket, 3000);
        }
    };
}

function startPing() {
    setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ op: "ping" }));
        }
    }, 20000);
}

/* =====================================================
   DATA LOADING & CONTROL
===================================================== */
async function loadSymbols() {
    try {
        statusEl.innerText = "Загрузка TOP-100...";
        statusEl.style.color = "#f7931a";

        const response = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const json = await response.json();

        if (!json.result || !Array.isArray(json.result.list)) {
            throw new Error("Invalid Bybit response");
        }

        const list = json.result.list
            .filter(item => item.symbol && item.symbol.endsWith("USDT") && parseFloat(item.turnover24h) > 0)
            .sort((a, b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
            .slice(0, MAX_SYMBOLS);

        symbols.length = 0;
        symbolRanks.clear();

        list.forEach((item, index) => {
            symbols.push(item.symbol);
            symbolRanks.set(item.symbol, index + 1);
        });

        coinCountEl.innerText = symbols.length;
        return true;
    } catch (error) {
        console.error("TOP loading error:", error);
        statusEl.innerText = "Ошибка загрузки TOP";
        statusEl.style.color = "#e74c3c";
        return false;
    }
}

async function startScanner() {
    if (running) return;
    running = true;

    const success = await loadSymbols();
    if (!success) { running = false; return; }

    books.clear();
    trades.clear();
    signals.clear();
    wallHistory.clear();

    connectWebSocket();

    analysisTimer = setInterval(analyzeAll, ANALYSIS_INTERVAL);
    uiTimer = setInterval(renderSignals, UI_INTERVAL);

    symbolRefreshTimer = setInterval(async () => {
        await loadSymbols();
        books.clear();
        trades.clear();
        wallHistory.clear();
        signals.clear();
        connectWebSocket();
    }, SYMBOL_REFRESH);
}

function stopScanner() {
    running = false;
    if (analysisTimer) { clearInterval(analysisTimer); analysisTimer = null; }
    if (uiTimer) { clearInterval(uiTimer); uiTimer = null; }
    if (symbolRefreshTimer) { clearInterval(symbolRefreshTimer); symbolRefreshTimer = null; }
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

    if (ws) {
        try { ws.onclose = null; ws.close(); } catch (e) {}
        ws = null;
    }

    wsEl.innerText = "OFF";
    wsEl.className = "stat-value";
    statusEl.innerText = "Остановлен";
    statusEl.style.color = "#848e9c";
}

function clearSignals() {
    signals.clear();
    renderSignals();
}

startPing();
