<script>

/* =====================================================
   CONFIG
===================================================== */

const MAX_SYMBOLS = 100;

const ORDERBOOK_DEPTH = 50;

const MAX_LEVELS_PER_SYMBOL = 8;

const MAX_SIGNALS = 20;


/*
 * Частота анализа.
 *
 * 500 мс достаточно для браузерного
 * realtime-сканера.
 */

const ANALYSIS_INTERVAL = 500;


/*
 * UI обновляем реже,
 * чтобы не перегружать Safari.
 */

const UI_INTERVAL = 1000;


/*
 * Обновление TOP.
 */

const SYMBOL_REFRESH =
    5 * 60 * 1000;


/*
 * История сделок.
 */

const TRADE_HISTORY =
    60 * 1000;


/*
 * Поток для оценки реакции.
 */

const FLOW_WINDOW =
    8000;


/*
 * История уровня.
 */

const LEVEL_HISTORY =
    120 * 1000;


/*
 * Максимальная дистанция
 * поиска уровня от цены.
 */

const MAX_LEVEL_DISTANCE =
    0.012;


/*
 * Зона объединения близких
 * ценовых уровней.
 */

const LEVEL_CLUSTER_DISTANCE =
    0.0007;


/*
 * Минимальная относительная
 * ликвидность.
 */

const MIN_RELATIVE_LIQUIDITY =
    2.0;


/*
 * Сколько секунд нужно,
 * чтобы считать уровень
 * стабильным.
 */

const MIN_LEVEL_AGE =
    3000;


/*
 * Минимальное движение,
 * которое считаем реакцией.
 */

const MIN_REACTION =
    0.00025;


/* =====================================================
   STATE
===================================================== */

let ws = null;

let running = false;

let reconnectTimer = null;

let symbolRefreshTimer = null;

let analysisTimer = null;

let uiTimer = null;

let pingTimer = null;

let currentFilter = "ALL";


/*
 * TOP-100.
 */

const symbols = [];

const symbolRanks = new Map();


/*
 * Стаканы.
 */

const books = new Map();


/*
 * Поток сделок.
 */

const trades = new Map();


/*
 * Уровни.
 */

const levels = new Map();


/*
 * Торговые сигналы.
 */

const signals = new Map();


/*
 * История уровней.
 */

const levelHistory = new Map();


/*
 * Состояние сценариев.
 *
 * Не позволяет моментально
 * переворачивать LONG/SHORT.
 */

const scenarios = new Map();


/* =====================================================
   DOM
===================================================== */

const statusEl =
    document.getElementById("status");

const wsEl =
    document.getElementById("wsStatus");

const coinCountEl =
    document.getElementById("coinCount");

const levelCountEl =
    document.getElementById("levelCount");

const signalCountEl =
    document.getElementById("signalCount");

const signalsEl =
    document.getElementById("signals");


/* =====================================================
   HELPERS
===================================================== */

function now() {

    return Date.now();

}


function money(value) {

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


function priceFormat(value) {

    const n = Number(value);

    if (!isFinite(n))
        return "-";

    if (n >= 1000)
        return n.toFixed(2);

    if (n >= 1)
        return n.toFixed(4);

    if (n >= 0.01)
        return n.toFixed(6);

    return n.toFixed(8);

}


function percent(value) {

    return (
        Number(value) * 100
    ).toFixed(2) + "%";

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/* =====================================================
   BOOK
===================================================== */

function createBook(symbol) {

    if (!books.has(symbol)) {

        books.set(
            symbol,
            {
                bids: new Map(),
                asks: new Map(),
                lastPrice: null,
                updated: 0
            }
        );

    }

}


/* =====================================================
   SNAPSHOT
===================================================== */

function applySnapshot(
    symbol,
    data
) {

    createBook(symbol);

    const book =
        books.get(symbol);

    book.bids.clear();

    book.asks.clear();

    if (Array.isArray(data.b)) {

        for (const row of data.b) {

            const price =
                parseFloat(row[0]);

            const qty =
                parseFloat(row[1]);

            if (
                price > 0 &&
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }

    if (Array.isArray(data.a)) {

        for (const row of data.a) {

            const price =
                parseFloat(row[0]);

            const qty =
                parseFloat(row[1]);

            if (
                price > 0 &&
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }

    book.updated = now();

}


/* =====================================================
   DELTA
===================================================== */

function applyDelta(
    symbol,
    data
) {

    const book =
        books.get(symbol);

    if (!book)
        return;

    if (Array.isArray(data.b)) {

        for (const row of data.b) {

            const price =
                parseFloat(row[0]);

            const qty =
                parseFloat(row[1]);

            if (!price)
                continue;

            if (qty === 0) {

                book.bids.delete(price);

            } else {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }

    if (Array.isArray(data.a)) {

        for (const row of data.a) {

            const price =
                parseFloat(row[0]);

            const qty =
                parseFloat(row[1]);

            if (!price)
                continue;

            if (qty === 0) {

                book.asks.delete(price);

            } else {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }

    book.updated = now();

}


/* =====================================================
   TRADES
===================================================== */

function processTrade(data) {

    if (!Array.isArray(data))
        return;

    for (const trade of data) {

        const symbol =
            trade.s;

        const side =
            trade.S;

        const price =
            parseFloat(trade.p);

        const qty =
            parseFloat(trade.v);

        const timestamp =
            Number(trade.T) || now();

        if (
            !symbol ||
            !price ||
            !qty
        )
            continue;

        const value =
            price * qty;

        if (!trades.has(symbol)) {

            trades.set(
                symbol,
                []
            );

        }

        const list =
            trades.get(symbol);

        list.push({

            time: timestamp,

            side: side,

            price: price,

            qty: qty,

            value: value

        });


        const book =
            books.get(symbol);

        if (book) {

            book.lastPrice =
                price;

        }


        /*
         * Очищаем старые сделки.
         */

        const cutoff =
            now() -
            TRADE_HISTORY;

        while (
            list.length &&
            list[0].time < cutoff
        ) {

            list.shift();

        }

    }

}


/* =====================================================
   CURRENT PRICE
===================================================== */

function getCurrentPrice(
    symbol
) {

    const book =
        books.get(symbol);

    if (!book)
        return null;

    if (book.lastPrice)
        return book.lastPrice;


    const bids =
        [...book.bids.keys()]
            .sort(
                (a, b) => b - a
            );

    const asks =
        [...book.asks.keys()]
            .sort(
                (a, b) => a - b
            );

    if (
        bids.length &&
        asks.length
    ) {

        return (
            bids[0] +
            asks[0]
        ) / 2;

    }

    return null;

}


/* =====================================================
   LOCAL LIQUIDITY
===================================================== */

function getLocalLiquidity(
    symbol,
    side,
    currentPrice
) {

    const book =
        books.get(symbol);

    if (
        !book ||
        !currentPrice
    )
        return 1;

    const source =
        side === "Buy"
            ? book.bids
            : book.asks;

    const values = [];

    for (
        const [price, qty]
        of source
    ) {

        const distance =
            Math.abs(
                price -
                currentPrice
            ) /
            currentPrice;

        if (
            distance <= 0.003
        ) {

            const value =
                price * qty;

            if (value > 0)
                values.push(value);

        }

    }

    if (!values.length)
        return 1;

    values.sort(
        (a, b) => a - b
    );

    const middle =
        Math.floor(
            values.length / 2
        );

    return Math.max(
        values[middle],
        1
    );

}


/* =====================================================
   FLOW
===================================================== */

function getTradeFlow(
    symbol
) {

    const list =
        trades.get(symbol) || [];

    const cutoff =
        now() -
        FLOW_WINDOW;

    let buy = 0;

    let sell = 0;

    let buyCount = 0;

    let sellCount = 0;

    let latestPrice = null;

    let oldestPrice = null;


    for (
        let i = list.length - 1;
        i >= 0;
        i--
    ) {

        const t =
            list[i];

        if (
            t.time < cutoff
        )
            break;

        if (!latestPrice)
            latestPrice = t.price;

        oldestPrice =
            t.price;


        /*
         * В Bybit publicTrade
         * S = taker side.
         */

        if (
            t.side === "Buy"
        ) {

            buy += t.value;
            buyCount++;

        } else {

            sell += t.value;
            sellCount++;

        }

    }


    const total =
        buy + sell;

    let imbalance = 0;

    if (total > 0) {

        imbalance =
            (
                buy -
                sell
            ) /
            total;

    }


    let flowPriceChange = 0;

    if (
        latestPrice &&
        oldestPrice
    ) {

        flowPriceChange =
            (
                latestPrice -
                oldestPrice
            ) /
            oldestPrice;

    }


    return {

        buy,
        sell,
        total,
        imbalance,
        buyCount,
        sellCount,
        flowPriceChange

    };

}


/* =====================================================
   LEVEL CANDIDATES
===================================================== */

function collectLevelCandidates(
    symbol
) {

    const book =
        books.get(symbol);

    const price =
        getCurrentPrice(symbol);

    if (
        !book ||
        !price
    )
        return [];


    const candidates = [];


    /*
     * BID LIQUIDITY
     */

    for (
        const [levelPrice, qty]
        of book.bids
    ) {

        const distance =
            (
                price -
                levelPrice
            ) /
            price;

        if (
            distance < 0 ||
            distance >
            MAX_LEVEL_DISTANCE
        )
            continue;

        const value =
            levelPrice * qty;

        const local =
            getLocalLiquidity(
                symbol,
                "Buy",
                price
            );

        const ratio =
            value /
            Math.max(local, 1);

        if (
            ratio >=
            MIN_RELATIVE_LIQUIDITY
        ) {

            candidates.push({

                symbol,

                side: "Buy",

                price: levelPrice,

                value,

                qty,

                distance,

                ratio

            });

        }

    }


    /*
     * ASK LIQUIDITY
     */

    for (
        const [levelPrice, qty]
        of book.asks
    ) {

        const distance =
            (
                levelPrice -
                price
            ) /
            price;

        if (
            distance < 0 ||
            distance >
            MAX_LEVEL_DISTANCE
        )
            continue;

        const value =
            levelPrice * qty;

        const local =
            getLocalLiquidity(
                symbol,
                "Sell",
                price
            );

        const ratio =
            value /
            Math.max(local, 1);

        if (
            ratio >=
            MIN_RELATIVE_LIQUIDITY
        ) {

            candidates.push({

                symbol,

                side: "Sell",

                price: levelPrice,

                value,

                qty,

                distance,

                ratio

            });

        }

    }


    return candidates;

}


/* =====================================================
   CLUSTER LEVELS
===================================================== */

function clusterLevels(
    symbol
) {

    const candidates =
        collectLevelCandidates(symbol);

    if (!candidates.length)
        return [];


    candidates.sort(
        (a, b) =>
            b.value -
            a.value
    );


    const clusters = [];


    for (
        const candidate
        of candidates
    ) {

        let cluster = null;

        for (
            const existing
            of clusters
        ) {

            const distance =
                Math.abs(
                    candidate.price -
                    existing.price
                ) /
                candidate.price;

            if (
                candidate.side ===
                existing.side &&
                distance <=
                LEVEL_CLUSTER_DISTANCE
            ) {

                cluster = existing;
                break;

            }

        }


        if (!cluster) {

            clusters.push({

                symbol,

                side:
                    candidate.side,

                price:
                    candidate.price,

                totalValue:
                    candidate.value,

                maxValue:
                    candidate.value,

                maxRatio:
                    candidate.ratio,

                count: 1,

                distance:
                    candidate.distance

            });

        } else {

            cluster.totalValue +=
                candidate.value;

            cluster.maxValue =
                Math.max(
                    cluster.maxValue,
                    candidate.value
                );

            cluster.maxRatio =
                Math.max(
                    cluster.maxRatio,
                    candidate.ratio
                );

            cluster.count++;

            /*
             * Взвешенная цена.
             */

            cluster.price =
                (
                    cluster.price *
                    (
                        cluster.count - 1
                    ) +
                    candidate.price
                ) /
                cluster.count;

        }

    }


    /*
     * Сортируем по относительной
     * значимости.
     */

    clusters.sort(
        (a, b) =>
            (
                b.totalValue *
                b.maxRatio
            ) -
            (
                a.totalValue *
                a.maxRatio
            )
    );


    return clusters.slice(
        0,
        MAX_LEVELS_PER_SYMBOL
    );

}


/* =====================================================
   LEVEL HISTORY
===================================================== */

function levelKey(
    level
) {

    /*
     * Округляем цену,
     * чтобы небольшие изменения
     * стакана не создавали новый уровень.
     */

    const rounded =
        Number(
            level.price.toPrecision(8)
        );

    return (
        level.symbol +
        "_" +
        level.side +
        "_" +
        rounded
    );

}


function updateLevelHistory(
    level
) {

    const key =
        levelKey(level);

    let history =
        levelHistory.get(key);


    if (!history) {

        history = {

            firstSeen: now(),

            lastSeen: now(),

            values: [
                {
                    time: now(),
                    value:
                        level.totalValue
                }
            ],

            previousValue:
                level.totalValue,

            tests: 0,

            rejectionCount: 0,

            absorptionScore: 0,

            lastPrice:
                getCurrentPrice(
                    level.symbol
                ),

            lastTestTime: 0

        };

        levelHistory.set(
            key,
            history
        );

    } else {

        history.lastSeen =
            now();


        /*
         * Сохраняем изменения
         * ликвидности.
         */

        history.values.push({

            time: now(),

            value:
                level.totalValue

        });


        /*
         * Не храним бесконечную историю.
         */

        const cutoff =
            now() -
            LEVEL_HISTORY;

        while (
            history.values.length &&
            history.values[0].time <
            cutoff
        ) {

            history.values.shift();

        }

    }


    /*
     * Stability.
     */

    const age =
        now() -
        history.firstSeen;


    /*
     * Насколько изменилась
     * ликвидность.
     */

    let stability = 100;


    if (
        history.previousValue > 0
    ) {

        const change =
            Math.abs(
                level.totalValue -
                history.previousValue
            ) /
            history.previousValue;

        stability =
            clamp(
                100 -
                change * 100,
                0,
                100
            );

    }


    history.previousValue =
        level.totalValue;


    /*
     * Test detection.
     */

    const currentPrice =
        getCurrentPrice(
            level.symbol
        );


    if (
        currentPrice &&
        history.lastPrice
    ) {

        const previousDistance =
            Math.abs(
                history.lastPrice -
                level.price
            ) /
            level.price;

        const currentDistance =
            Math.abs(
                currentPrice -
                level.price
            ) /
            level.price;

        const testDistance =
            parseFloat(
                document
                    .getElementById(
                        "testDistance"
                    )
                    .value
            );


        /*
         * Цена подошла к уровню.
         */

        if (
            currentDistance <=
            testDistance &&
            previousDistance >
            testDistance
        ) {

            if (
                now() -
                history.lastTestTime >
                3000
            ) {

                history.tests++;

                history.lastTestTime =
                    now();

            }

        }

    }


    history.lastPrice =
        currentPrice;


    /*
     * Rejection.
     */

    const reaction =
        getLevelReaction(
            level,
            history
        );


    history.rejectionCount =
        reaction.rejectionCount;

    history.absorptionScore =
        reaction.absorptionScore;


    return {

        key,

        age,

        stability,

        tests:
            history.tests,

        rejectionCount:
            history.rejectionCount,

        absorptionScore:
            history.absorptionScore,

        refill:
            calculateRefill(
                history,
                level
            )

    };

}


/* =====================================================
   REFILL
===================================================== */

function calculateRefill(
    history,
    level
) {

    if (
        history.values.length < 3
    )
        return 0;


    const values =
        history.values;


    let replenishments = 0;

    let opportunities = 0;


    for (
        let i = 1;
        i < values.length;
        i++
    ) {

        const previous =
            values[i - 1].value;

        const current =
            values[i].value;


        if (
            previous <= 0
        )
            continue;


        /*
         * Если ликвидность сначала
         * уменьшается, а потом
         * восстанавливается.
         */

        if (
            current <
            previous * 0.85
        ) {

            opportunities++;

        }


        if (
            opportunities > 0 &&
            current >
            previous * 1.10
        ) {

            replenishments++;

        }

    }


    if (
        opportunities === 0
    )
        return 0;


    return clamp(
        (
            replenishments /
            opportunities
        ) * 100,
        0,
        100
    );

}


/* =====================================================
   LEVEL REACTION
===================================================== */

function getLevelReaction(
    level,
    history
) {

    const list =
        trades.get(level.symbol) || [];


    const cutoff =
        now() -
        FLOW_WINDOW;


    let aggressiveIntoLevel = 0;

    let aggressiveAway = 0;


    for (
        let i = list.length - 1;
        i >= 0;
        i--
    ) {

        const trade =
            list[i];

        if (
            trade.time < cutoff
        )
            break;


        const distance =
            Math.abs(
                trade.price -
                level.price
            ) /
            level.price;


        /*
         * Учитываем только сделки
         * достаточно близко к уровню.
         */

        if (
            distance >
            0.001
        )
            continue;


        /*
         * BUY wall:
         * aggressive SELL давит
         * в поддержку.
         *
         * SELL wall:
         * aggressive BUY давит
         * в сопротивление.
         */

        if (
            level.side === "Buy"
        ) {

            if (
                trade.side === "Sell"
            ) {

                aggressiveIntoLevel +=
                    trade.value;

            } else {

                aggressiveAway +=
                    trade.value;

            }

        } else {

            if (
                trade.side === "Buy"
            ) {

                aggressiveIntoLevel +=
                    trade.value;

            } else {

                aggressiveAway +=
                    trade.value;

            }

        }

    }


    const pressure =
        aggressiveIntoLevel +
        aggressiveAway;


    let absorptionScore = 0;


    if (
        pressure > 0 &&
        level.totalValue > 0
    ) {

        /*
         * Давление относительно
         * лимитной ликвидности.
         */

        const pressureRatio =
            aggressiveIntoLevel /
            level.totalValue;


        /*
         * Чем больше агрессивного
         * потока поглощается,
         * тем выше показатель.
         */

        absorptionScore =
            clamp(
                pressureRatio * 70 +
                (
                    aggressiveIntoLevel /
                    Math.max(
                        pressure,
                        1
                    )
                ) * 30,
                0,
                100
            );

    }


    /*
     * Rejection:
     *
     * большой агрессивный поток
     * + цена не проходит уровень.
     */

    let rejectionCount = 0;


    const currentPrice =
        getCurrentPrice(
            level.symbol
        );


    if (currentPrice) {

        const distance =
            (
                currentPrice -
                level.price
            ) /
            level.price;


        if (
            level.side === "Buy"
        ) {

            /*
             * Цена немного ниже/около
             * уровня, но не уходит дальше.
             */

            if (
                aggressiveIntoLevel >
                level.totalValue * 0.20 &&
                distance > -0.001
            ) {

                rejectionCount = 1;

            }

        } else {

            if (
                aggressiveIntoLevel >
                level.totalValue * 0.20 &&
                distance < 0.001
            ) {

                rejectionCount = 1;

            }

        }

    }


    return {

        absorptionScore,

        rejectionCount

    };

}


/* =====================================================
   LEVEL SCORE
===================================================== */

function calculateLevelScore(
    level,
    history
) {

    let score = 0;


    /*
     * 1. Relative liquidity
     * 0–25
     */

    score += clamp(
        (
            level.maxRatio /
            5
        ) * 25,
        0,
        25
    );


    /*
     * 2. Stability
     * 0–15
     */

    score +=
        (
            history.stability /
            100
        ) * 15;


    /*
     * 3. Age
     * 0–10
     */

    score += clamp(
        history.age /
        1000,
        0,
        10
    );


    /*
     * 4. Multiple tests
     * 0–10
     */

    score += clamp(
        history.tests * 3,
        0,
        10
    );


    /*
     * 5. Rejection
     * 0–10
     */

    score +=
        history.rejectionCount *
        10;


    /*
     * 6. Refill
     * 0–10
     */

    score +=
        (
            history.refill /
            100
        ) * 10;


    /*
     * 7. Absorption
     * 0–20
     */

    score +=
        (
            history.absorptionScore /
            100
        ) * 20;


    return Math.round(
        clamp(
            score,
            0,
            100
        )
    );

}


/* =====================================================
   PRICE REACTION
===================================================== */

function calculatePriceReaction(
    level
) {

    const list =
        trades.get(level.symbol) || [];

    const cutoff =
        now() -
        FLOW_WINDOW;


    let oldest = null;

    let latest = null;


    for (
        let i = list.length - 1;
        i >= 0;
        i--
    ) {

        const trade =
            list[i];

        if (
            trade.time < cutoff
        )
            break;


        latest =
            latest || trade;

        oldest =
            trade;

    }


    if (
        !oldest ||
        !latest ||
        !oldest.price
    )
        return 0;


    return (
        latest.price -
        oldest.price
    ) /
    oldest.price;

}


/* =====================================================
   DETERMINE SCENARIO
===================================================== */

function determineScenario(
    level,
    history,
    flow,
    priceReaction
) {

    const currentPrice =
        getCurrentPrice(
            level.symbol
        );


    if (!currentPrice)
        return null;


    const distance =
        (
            currentPrice -
            level.price
        ) /
        level.price;


    const strongLevel =
        history.score >=
        parseInt(
            document
                .getElementById(
                    "minLevelScore"
                )
                .value
        );


    if (!strongLevel)
        return null;


    /*
     * ==================================
     * BUY LEVEL
     * ==================================
     */

    if (
        level.side === "Buy"
    ) {

        /*
         * LONG:
         *
         * Цена около поддержки
         * + продажи поглощаются
         * + есть реакция вверх.
         */

        const longConfirmation =
            distance >= -0.0015 &&
            history.absorptionScore >= 45 &&
            (
                flow.imbalance >= 0.08 ||
                priceReaction >=
                MIN_REACTION
            );


        if (
            longConfirmation
        ) {

            return {

                direction: "LONG",

                state: "CONFIRMED",

                reason:
                    "Поддержка удерживается: " +
                    "продажи поглощаются, " +
                    "появляется реакция вверх."

            };

        }


        /*
         * BREAKDOWN:
         *
         * поддержка не выдержала.
         */

        const breakdown =
            distance < -0.001 &&
            flow.imbalance < -0.15 &&
            priceReaction < 0 &&
            history.absorptionScore < 35;


        if (
            breakdown
        ) {

            return {

                direction: "SHORT",

                state: "CONFIRMED",

                reason:
                    "Поддержка теряет ликвидность: " +
                    "продавцы давят, поглощение слабое."

            };

        }

    }


    /*
     * ==================================
     * SELL LEVEL
     * ==================================
     */

    if (
        level.side === "Sell"
    ) {

        /*
         * SHORT:
         *
         * сопротивление удерживается.
         */

        const shortConfirmation =
            distance <= 0.0015 &&
            history.absorptionScore >= 45 &&
            (
                flow.imbalance <= -0.08 ||
                priceReaction <=
                -MIN_REACTION
            );


        if (
            shortConfirmation
        ) {

            return {

                direction: "SHORT",

                state: "CONFIRMED",

                reason:
                    "Сопротивление удерживается: " +
                    "покупки поглощаются, " +
                    "появляется реакция вниз."

            };

        }


        /*
         * BREAKOUT LONG
         */

        const breakout =
            distance > 0.001 &&
            flow.imbalance > 0.15 &&
            priceReaction > 0 &&
            history.absorptionScore < 35;


        if (
            breakout
        ) {

            return {

                direction: "LONG",

                state: "CONFIRMED",

                reason:
                    "Сопротивление поглощается: " +
                    "покупатели давят и цена " +
                    "выходит выше уровня."

            };

        }

    }


    /*
     * Если уровень сильный,
     * но подтверждения ещё нет,
     * создаём WATCH.
     */

    const closeToLevel =
        Math.abs(distance) <=
        0.002;


    if (
        closeToLevel &&
        history.age >=
        MIN_LEVEL_AGE
    ) {

        return {

            direction: "WATCH",

            state: "WATCH",

            reason:
                "Сильный уровень рядом с ценой. " +
                "Ждём подтверждение реакции."

        };

    }


    return null;

}


/* =====================================================
   SCENARIO STATE
===================================================== */

function updateScenarioState(
    level,
    scenario
) {

    const key =
        levelKey(level);


    let state =
        scenarios.get(key);


    if (!state) {

        state = {

            direction: null,

            state: "WATCH",

            firstConfirmed: 0,

            lastUpdate: now(),

            invalidated: false

        };

        scenarios.set(
            key,
            state
        );

    }


    /*
     * Если новый сигнал совпадает
     * с предыдущим — обновляем.
     */

    if (
        scenario &&
        scenario.direction !==
        "WATCH"
    ) {

        if (
            state.direction ===
            scenario.direction
        ) {

            state.state =
                "CONFIRMED";

            state.lastUpdate =
                now();

            return state;

        }


        /*
         * Защита от мгновенного
         * переворота.
         *
         * Чтобы LONG не стал
         * SHORT через 500 мс,
         * предыдущий сценарий должен
         * сначала потерять условия.
         */

        if (
            state.direction &&
            state.direction !==
            scenario.direction &&
            !state.invalidated
        ) {

            /*
             * Первый конфликт —
             * просто помечаем,
             * но не переворачиваем.
             */

            state.conflictSince =
                state.conflictSince ||
                now();

            /*
             * Нужно минимум 3 секунды
             * устойчивого противоположного
             * сценария.
             */

            if (
                now() -
                state.conflictSince <
                3000
            ) {

                return state;

            }

        }


        state.direction =
            scenario.direction;

        state.state =
            "CONFIRMED";

        state.invalidated =
            false;

        state.conflictSince =
            0;

        state.firstConfirmed =
            state.firstConfirmed ||
            now();

        state.lastUpdate =
            now();

        return state;

    }


    /*
     * WATCH не сбрасывает
     * подтверждённый сценарий
     * мгновенно.
     */

    if (
        scenario &&
        scenario.direction ===
        "WATCH"
    ) {

        if (
            !state.direction
        ) {

            state.state =
                "WATCH";

        }

    }


    return state;

}


/* =====================================================
   INVALIDATION
===================================================== */

function isScenarioInvalid(
    level,
    state,
    history,
    flow
) {

    if (
        !state.direction ||
        state.direction ===
        "WATCH"
    )
        return false;


    const price =
        getCurrentPrice(
            level.symbol
        );

    if (!price)
        return false;


    const distance =
        (
            price -
            level.price
        ) /
        level.price;


    /*
     * LONG от BUY wall:
     * поддержка разрушена.
     */

    if (
        state.direction ===
        "LONG" &&
        level.side === "Buy"
    ) {

        if (
            distance < -0.0025 &&
            flow.imbalance < -0.12 &&
            history.absorptionScore < 25
        ) {

            return true;

        }

    }


    /*
     * SHORT от SELL wall:
     * сопротивление пробито.
     */

    if (
        state.direction ===
        "SHORT" &&
        level.side === "Sell"
    ) {

        if (
            distance > 0.0025 &&
            flow.imbalance > 0.12 &&
            history.absorptionScore < 25
        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   FINAL SCORE
===================================================== */

function calculateSignalScore(
    level,
    history,
    flow,
    direction,
    priceReaction
) {

    let score =
        history.score * 0.45;


    /*
     * Flow alignment
     */

    let flowAlignment = 0;


    if (
        direction === "LONG"
    ) {

        flowAlignment =
            Math.max(
                0,
                flow.imbalance
            );

    } else {

        flowAlignment =
            Math.max(
                0,
                -flow.imbalance
            );

    }


    score +=
        flowAlignment * 25;


    /*
     * Reaction
     */

    score += clamp(
        Math.abs(
            priceReaction
        ) * 10000,
        0,
        15
    );


    /*
     * Tests
     */

    score += clamp(
        history.tests * 2,
        0,
        10
    );


    return Math.round(
        clamp(
            score,
            0,
            100
        )
    );

}


/* =====================================================
   ANALYZE SYMBOL
===================================================== */

function analyzeSymbol(
    symbol
) {

    const price =
        getCurrentPrice(symbol);

    if (!price)
        return;


    const found =
        clusterLevels(symbol);


    for (
        const level
        of found
    ) {

        const historyData =
            updateLevelHistory(
                level
            );


        const history = {

            ...historyData,

            score:
                calculateLevelScore(
                    level,
                    historyData
                )

        };


        const flow =
            getTradeFlow(symbol);


        const priceReaction =
            calculatePriceReaction(
                level
            );


        const scenario =
            determineScenario(
                level,
                history,
                flow,
                priceReaction
            );


        if (!scenario)
            continue;


        const state =
            updateScenarioState(
                level,
                scenario
            );


        if (
            isScenarioInvalid(
                level,
                state,
                history,
                flow
            )
        ) {

            state.invalidated =
                true;

            state.direction =
                null;

            state.state =
                "INVALIDATED";

            continue;

        }


        /*
         * WATCH.
         */

        if (
            state.state ===
            "WATCH" ||
            state.direction ===
            null
        ) {

            const key =
                levelKey(level);

            signals.set(
                key,
                {

                    key,

                    symbol,

                    rank:
                        symbolRanks.get(
                            symbol
                        ),

                    direction:
                        "WATCH",

                    state:
                        "WATCH",

                    score:
                        history.score,

                    level,

                    history,

                    flow,

                    priceReaction,

                    reason:
                        scenario.reason,

                    updated:
                        now()

                }
            );

            continue;

        }


        /*
         * CONFIRMED.
         */

        const score =
            calculateSignalScore(
                level,
                history,
                flow,
                state.direction,
                priceReaction
            );


        const minScore =
            parseInt(
                document
                    .getElementById(
                        "minScore"
                    )
                    .value
            );


        if (
            score < minScore
        )
            continue;


        const key =
            levelKey(level);


        signals.set(
            key,
            {

                key,

                symbol,

                rank:
                    symbolRanks.get(
                        symbol
                    ),

                direction:
                    state.direction,

                state:
                    "CONFIRMED",

                score,

                level,

                history,

                flow,

                priceReaction,

                reason:
                    scenario.reason,

                updated:
                    now()

            }
        );

    }

}


/* =====================================================
   CLEAN HISTORY
===================================================== */

function cleanHistory() {

    const cutoff =
        now() -
        LEVEL_HISTORY;


    for (
        const [
            key,
            history
        ]
        of levelHistory
    ) {

        if (
            history.lastSeen <
            cutoff
        ) {

            levelHistory.delete(
                key
            );

            scenarios.delete(
                key
            );

        }

    }

}


/* =====================================================
   ANALYZE ALL
===================================================== */

function analyzeAll() {

    if (!running)
        return;


    for (
        const symbol
        of symbols
    ) {

        analyzeSymbol(
            symbol
        );

    }


    cleanHistory();


    /*
     * Удаляем сигналы,
     * которые давно не обновлялись.
     *
     * Здесь специально 15 секунд,
     * а не 5 секунд как раньше.
     */

    const expiry =
        now() -
        15000;


    for (
        const [
            key,
            signal
        ]
        of signals
    ) {

        if (
            signal.updated <
            expiry
        ) {

            signals.delete(key);

        }

    }

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(filter) {

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    if (
        filter === "ALL"
    )
        document
            .getElementById(
                "filterAll"
            )
            .classList.add(
                "active"
            );


    if (
        filter === "LONG"
    )
        document
            .getElementById(
                "filterLong"
            )
            .classList.add(
                "active"
            );


    if (
        filter === "SHORT"
    )
        document
            .getElementById(
                "filterShort"
            )
            .classList.add(
                "active"
            );


    if (
        filter === "WATCH"
    )
        document
            .getElementById(
                "filterWatch"
            )
            .classList.add(
                "active"
            );


    renderSignals();

}


/* =====================================================
   RENDER
===================================================== */

function renderSignals() {

    let list =
        [...signals.values()];


    if (
        currentFilter !==
        "ALL"
    ) {

        list =
            list.filter(
                s =>
                    s.direction ===
                    currentFilter
            );

    }


    list.sort(
        (a, b) =>
            b.score -
            a.score
    );


    list =
        list.slice(
            0,
            MAX_SIGNALS
        );


    signalCountEl.innerText =
        list.length;


    levelCountEl.innerText =
        levelHistory.size;


    if (!list.length) {

        signalsEl.innerHTML = `

            <div class="empty">

                🔎 Ищем уровни...

/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket() {

    if (!running)
        return;


    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        wsEl.innerText =
            "ON";

        wsEl.className =
            "stat-value green";


        statusEl.innerText =
            "Сканирование активно";

        statusEl.style.color =
            "#27ae60";


        const args = [];


        for (
            const symbol
            of symbols
        ) {

            args.push(
                `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );

            args.push(
                `publicTrade.${symbol}`
            );

        }


        /*
         * Bybit допускает несколько
         * subscription requests.
         *
         * Разбиваем подписки пачками,
         * чтобы не отправлять огромный
         * JSON одним сообщением.
         */

        const chunkSize = 20;


        for (
            let i = 0;
            i < args.length;
            i += chunkSize
        ) {

            const chunk =
                args.slice(
                    i,
                    i + chunkSize
                );


            ws.send(
                JSON.stringify({

                    op: "subscribe",

                    args: chunk

                })
            );

        }

    };


    ws.onmessage = event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.op ===
                "pong"
            )
                return;


            if (
                !data.topic
            )
                return;


            /*
             * ORDERBOOK
             */

            if (
                data.topic.startsWith(
                    "orderbook."
                )
            ) {

                const parts =
                    data.topic.split(".");


                const symbol =
                    parts[2];


                if (
                    data.type ===
                    "snapshot"
                ) {

                    applySnapshot(
                        symbol,
                        data.data
                    );

                }


                else if (
                    data.type ===
                    "delta"
                ) {

                    applyDelta(
                        symbol,
                        data.data
                    );

                }

            }


            /*
             * TRADES
             */

            else if (
                data.topic.startsWith(
                    "publicTrade."
                )
            ) {

                processTrade(
                    data.data
                );

            }

        } catch (error) {

            console.error(
                "WS message error:",
                error
            );

        }

    };


    ws.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );


        wsEl.innerText =
            "ERROR";

        wsEl.className =
            "stat-value red";

    };


    ws.onclose = () => {

        wsEl.innerText =
            "OFF";

        wsEl.className =
            "stat-value red";


        if (running) {

            statusEl.innerText =
                "Переподключение...";

            statusEl.style.color =
                "#f7931a";


            reconnectTimer =
                setTimeout(
                    connectWebSocket,
                    3000
                );

        }

    };

}


/* =====================================================
   PING
===================================================== */

function startPing() {

    if (pingTimer)
        clearInterval(pingTimer);


    pingTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


/* =====================================================
   LOAD TOP 100
===================================================== */

async function loadSymbols() {

    try {

        statusEl.innerText =
            "Загрузка TOP-100...";

        statusEl.style.color =
            "#f7931a";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear"
            );


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Invalid Bybit response"
            );

        }


        const list =
            json.result.list

                .filter(
                    item =>
                        item.symbol &&
                        item.symbol.endsWith(
                            "USDT"
                        ) &&
                        parseFloat(
                            item.turnover24h
                        ) > 0
                )

                .sort(
                    (a, b) =>
                        parseFloat(
                            b.turnover24h
                        ) -
                        parseFloat(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length = 0;

        symbolRanks.clear();


        list.forEach(
            (item, index) => {

                symbols.push(
                    item.symbol
                );

                symbolRanks.set(
                    item.symbol,
                    index + 1
                );

            }
        );


        coinCountEl.innerText =
            symbols.length;


        return true;


    } catch (error) {

        console.error(
            "TOP error:",
            error
        );


        statusEl.innerText =
            "Ошибка загрузки TOP";

        statusEl.style.color =
            "#e74c3c";


        return false;

    }

}


/* =====================================================
   START
===================================================== */

async function startScanner() {

    if (running)
        return;


    running = true;


    const success =
        await loadSymbols();


    if (!success) {

        running = false;

        return;

    }


    books.clear();

    trades.clear();

    levels.clear();

    signals.clear();

    levelHistory.clear();

    scenarios.clear();


    connectWebSocket();


    analysisTimer =
        setInterval(
            analyzeAll,
            ANALYSIS_INTERVAL
        );


    uiTimer =
        setInterval(
            renderSignals,
            UI_INTERVAL
        );


    symbolRefreshTimer =
        setInterval(
            async () => {

                await loadSymbols();

                books.clear();

                trades.clear();

                levels.clear();

                signals.clear();

                levelHistory.clear();

                scenarios.clear();

                connectWebSocket();

            },
            SYMBOL_REFRESH
        );


    startPing();

}


/* =====================================================
   STOP
===================================================== */

function stopScanner() {

    running = false;


    if (analysisTimer) {

        clearInterval(
            analysisTimer
        );

        analysisTimer = null;

    }


    if (uiTimer) {

        clearInterval(
            uiTimer
        );

        uiTimer = null;

    }


    if (symbolRefreshTimer) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer = null;

    }


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer = null;

    }


    if (ws) {

        try {

            ws.close();

        } catch (e) {}

        ws = null;

    }


    wsEl.innerText =
        "OFF";

    wsEl.className =
        "stat-value";


    statusEl.innerText =
        "Остановлен";

    statusEl.style.color =
        "#848e9c";

}


/* =====================================================
   CLEAR
===================================================== */

function clearSignals() {

    signals.clear();

    levelHistory.clear();

    scenarios.clear();

    renderSignals();

}
