<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Whale Scanner</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b0e11; color: #eaecef; margin: 0; padding: 15px; }
        h1 { font-size: 20px; margin-bottom: 10px; }
        .header { background: #1e2329; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .settings { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        input, select { background: #2b3139; border: 1px solid #f7931a; color: white; padding: 10px; border-radius: 8px; font-size: 16px; }
        button { background: #f7931a; border: none; color: #1e2329; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .list { margin-top: 15px; }
        .coin { background: #1e2329; padding: 10px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .notification { background: #2b3139; border-left: 4px solid #f7931a; padding: 10px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; }
        .time { color: #848e9c; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐋 Bybit Кит Сканер</h1>
        <div class="settings">
            <input type="number" id="threshold" value="250000" placeholder="Порог в $" style="width: 100px;">
            <select id="symbol">
                <option value="BTCUSDT">BTCUSDT</option>
                <option value="ETHUSDT">ETHUSDT</option>
                <option value="SOLUSDT">SOLUSDT</option>
                <option value="XRPUSDT">XRPUSDT</option>
            </select>
            <button onclick="startScan()">▶ Старт</button>
        </div>
        <div class="time">Статус: <span id="status">Остановлен</span></div>
    </div>

    <div id="notifications" class="list"></div>

    <script>
        let ws;
        const notificationsDiv = document.getElementById('notifications');
        const statusDiv = document.getElementById('status');

        function startScan() {
            const threshold = parseFloat(document.getElementById('threshold').value);
            const symbol = document.getElementById('symbol').value;
            
            if (ws) ws.close();
            
            statusDiv.innerText = "Подключение...";
            statusDiv.style.color = "#f7931a";

            // Подключаемся к WebSocket Bybit
            ws = new WebSocket(`wss://stream.bybit.com/v5/public/linear`);

            ws.onopen = () => {
                statusDiv.innerText = "Активен (Следим за заявками)";
                statusDiv.style.color = "#27ae60";
                
                // Подписка на стакан выбранной монеты
                const msg = {
                    "op": "subscribe",
                    "args": [`orderbook.50.${symbol}`]
                };
                ws.send(JSON.stringify(msg));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Проверяем, что это данные стакана
                if (data.topic && data.topic.includes('orderbook') && data.type === 'snapshot') {
                    // Считаем сумму для всех заявок (bid и ask)
                    const bids = data.data.b;
                    const asks = data.data.a;
                    
                    // Сортируем по убыванию суммы (цена * кол-во)
                    const allOrders = [...bids.map(o => ({price: o[0], qty: o[1], side: 'Buy'})), 
                                       ...asks.map(o => ({price: o[0], qty: o[1], side: 'Sell'}))];
                    
                    allOrders.sort((a, b) => (b.price * b.qty) - (a.price * a.qty));

                    // Берем самую крупную заявку
                    const biggest = allOrders[0];
                    const totalValue = biggest.price * biggest.qty;

                    if (totalValue >= threshold) {
                        showNotification(biggest, symbol, totalValue);
                    }
                }
            };

            ws.onerror = () => {
                statusDiv.innerText = "Ошибка соединения";
                statusDiv.style.color = "red";
            };
        }

        function showNotification(order, symbol, totalValue) {
            const formattedValue = totalValue.toLocaleString('en-US', { maximumFractionDigits: 0 });
            
            // Добавляем на экран
            const div = document.createElement('div');
            div.className = 'notification';
            div.innerHTML = `<b>${order.side} ${symbol}</b><br>Сумма: $${formattedValue}<br>Цена: ${order.price}`;
            notificationsDiv.prepend(div);

            // Отправляем системное уведомление (если разрешено)
            if (Notification.permission === "granted") {
                new Notification(`Крупная заявка на ${symbol}!`, {
                    body: `Сумма: $${formattedValue}`,
                    icon: 'https://cryptologos.cc/logos/bitcoin-btc-logo.png'
                });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification(`Крупная заявка на ${symbol}!`, {
                            body: `Сумма: $${formattedValue}`
                        });
                    }
                });
            }
        }
    </script>
</body>
</html>
