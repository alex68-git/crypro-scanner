<script>


/* =====================================================
   CONFIG
===================================================== */


/*
 * Сканируем TOP 100 по обороту.
 */

const MAX_SYMBOLS = 100;


/*
 * Order Book 50.
 */

const ORDERBOOK_DEPTH = 50;


/*
 * Максимум отображаемых сигналов.
 */

const MAX_SIGNALS = 15;


/*
 * Частота анализа.
 */

const ANALYSIS_INTERVAL = 700;


/*
 * Частота UI.
 */

const UI_INTERVAL = 1000;


/*
 * Обновление TOP.
 */

const SYMBOL_REFRESH =
    10 * 60 * 1000;


/*
 * Максимальное расстояние стены
 * от текущей цены.
 */

const MAX_WALL_DISTANCE = 0.008;


/*
 * Агрессивный flow.
 */

const TRADE_WINDOW = 10000;


/*
 * Окно изменения цены.
 */

const PRICE_WINDOW = 60000;


/*
 * История стены.
 */

const WALL_MEMORY = 30000;


/*
 * Минимальный возраст стены.
 */

const MIN_WALL_AGE = 3000;


/*
 * Максимум уровней книги.
 */

const MAX_BOOK_LEVELS = 70;


/*
 * Batch subscribe.
 */

const SUBSCRIBE_BATCH_SIZE = 10;


/*
 * Сигнал живёт 8 секунд.
 */

const SIGNAL_EXPIRY = 8000;


/* =====================================================
   TOP 20
===================================================== */


/*
 * Для TOP 20 используем
 * локальную ликвидность.
 *
 * Минимальная абсолютная стена
 * всё равно ограничена снизу.
 */

const TOP20_MIN_WALL = {

    1: 2500000,

    2: 2000000,

    3: 1500000,

    4: 1200000,

    5: 1000000,

    6: 900000,

    7: 800000,

    8: 750000,

    9: 700000,

    10: 650000,

    11: 600000,

    12: 575000,

    13: 550000,

    14: 525000,

    15: 500000,

    16: 475000,

    17: 450000,

    18: 425000,

    19: 400000,

    20: 375000

};


/* =====================================================
   TOP 21-100
===================================================== */


/*
 * Для альтов ниже TOP20
 * порог постепенно уменьшается.
 */

function getAltThreshold(rank) {

    if (rank <= 30)
        return 350000;

    if (rank <= 40)
        return 300000;

    if (rank <= 50)
        return 275000;

    if (rank <= 60)
        return 250000;

    if (rank <= 70)
        return 225000;

    if (rank <= 80)
        return 200000;

    if (rank <= 90)
        return 175000;

    return 150000;

}


/* =====================================================
   STATE
===================================================== */

let ws = null;

let running = false;

let reconnectTimer = null;

let analysisTimer = null;

let uiTimer = null;

let symbolRefreshTimer = null;

let pingTimer = null;

let watchdogTimer = null;


/*
 * Symbols.
 */

const symbols = [];

const symbolRanks = new Map();

const symbolTurnovers = new Map();


/*
 * Books.
 */

const books = new Map();


/*
 * Trades.
 */

const trades = new Map();


/*
 * Walls.
 */

const wallHistory = new Map();


/*
 * Signals.
 */

const signals = new Map();


/*
 * Market stats.
 */

let lastMarketMessage = 0;

let marketMessageCount = 0;


/* =====================================================
   DOM
===================================================== */

const statusEl =
    document.getElementById("status");

const wsEl =
    document.getElementById("wsStatus");

const coinCountEl =
    document.getElementById("coinCount");

const candidateCountEl =
    document.getElementById("candidateCount");

const signalCountEl =
    document.getElementById("signalCount");

const signalsEl =
    document.getElementById("signals");

const dataWarningEl =
    document.getElementById("dataWarning");


/* =====================================================
   HELPERS
===================================================== */

function now() {

    return Date.now();

}


function money(value) {

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


function priceFormat(value) {

    const n = Number(value);

    if (n >= 1000)
        return n.toFixed(2);

    if (n >= 100)
        return n.toFixed(3);

    if (n >= 1)
        return n.toFixed(4);

    if (n >= 0.01)
        return n.toFixed(6);

    return n.toFixed(8);

}


function percent(value) {

    return (
        Number(value) * 100
    ).toFixed(2) + "%";

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/* =====================================================
   BASE THRESHOLD
===================================================== */

function getBaseThreshold(
    symbol
) {

    const rank =
        symbolRanks.get(symbol);


    if (!rank)
        return 150000;


    /*
     * TOP 20.
     */

    if (
        rank <= 20
    ) {

        return (
            TOP20_MIN_WALL[rank] ||
            375000
        );

    }


    /*
     * TOP 21-100.
     */

    return getAltThreshold(
        rank
    );

}


/* =====================================================
   LOCAL BOOK STATISTICS
===================================================== */

function getBookStatistics(
    symbol
) {

    const book =
        books.get(symbol);


    if (!book)
        return null;


    let price =
        book.lastPrice;


    if (!price) {

        const bids =
            [...book.bids.keys()]
                .sort(
                    (a, b) =>
                        b - a
                );

        const asks =
            [...book.asks.keys()]
                .sort(
                    (a, b) =>
                        a - b
                );


        if (
            bids.length &&
            asks.length
        ) {

            price =
                (
                    bids[0] +
                    asks[0]
                ) / 2;

        }

    }


    if (!price)
        return null;


    const bidValues = [];

    const askValues = [];


    for (
        const [
            p,
            q
        ]
        of book.bids
    ) {

        const distance =
            Math.abs(
                p - price
            ) / price;


        if (
            distance <= 0.003
        ) {

            bidValues.push(
                p * q
            );

        }

    }


    for (
        const [
            p,
            q
        ]
        of book.asks
    ) {

        const distance =
            Math.abs(
                p - price
            ) / price;


        if (
            distance <= 0.003
        ) {

            askValues.push(
                p * q
            );

        }

    }


    function median(values) {

        if (
            values.length === 0
        )
            return 0;


        values.sort(
            (a, b) =>
                a - b
        );


        return values[
            Math.floor(
                values.length / 2
            )
        ];

    }


    return {

        price,

        bidMedian:
            median(
                bidValues
            ),

        askMedian:
            median(
                askValues
            ),

        bidTotal:
            bidValues.reduce(
                (a, b) =>
                    a + b,
                0
            ),

        askTotal:
            askValues.reduce(
                (a, b) =>
                    a + b,
                0
            )

    };

}


/* =====================================================
   DYNAMIC WALL THRESHOLD
===================================================== */

function getDynamicThreshold(
    symbol,
    side
) {

    const rank =
        symbolRanks.get(symbol);


    const base =
        getBaseThreshold(
            symbol
        );


    /*
     * TOP 20.
     *
     * Учитываем локальную ликвидность.
     */

    if (
        rank &&
        rank <= 20
    ) {

        const stats =
            getBookStatistics(
                symbol
            );


        if (!stats)
            return base;


        const local =
            side === "Buy"
                ? stats.bidMedian
                : stats.askMedian;


        /*
         * Стена должна быть
         * значительно крупнее
         * обычного уровня.
         */

        const localThreshold =
            local > 0
                ? local * 4.0
                : 0;


        return Math.max(
            base,
            localThreshold
        );

    }


    /*
     * TOP 21-100.
     *
     * Здесь сохраняем более
     * стабильный абсолютный порог.
     */

    const turnover =
        symbolTurnovers.get(
            symbol
        ) || 0;


    /*
     * Очень ликвидные альты
     * получают небольшой adaptive boost.
     */

    const turnoverThreshold =
        turnover *
        0.0000125;


    return Math.max(
        base,
        turnoverThreshold
    );

}


/* =====================================================
   DYNAMIC FLOW THRESHOLD
===================================================== */

function getDynamicFlowThreshold(
    symbol
) {

    const rank =
        symbolRanks.get(symbol);


    const turnover =
        symbolTurnovers.get(
            symbol
        ) || 0;


    let threshold =
        turnover *
        0.0000015;


    /*
     * Базовые значения.
     */

    if (rank <= 5)
        threshold =
            Math.max(
                threshold,
                150000
            );

    else if (rank <= 20)
        threshold =
            Math.max(
                threshold,
                100000
            );

    else if (rank <= 50)
        threshold =
            Math.max(
                threshold,
                50000
            );

    else
        threshold =
            Math.max(
                threshold,
                30000
            );


    return threshold;

}


/* =====================================================
   CREATE BOOK
===================================================== */

function createBook(
    symbol
) {

    books.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map(),
            lastPrice: null,
            lastUpdate: 0
        }
    );

}


/* =====================================================
   SNAPSHOT
===================================================== */

function applySnapshot(
    symbol,
    data
) {

    createBook(symbol);

    const book =
        books.get(symbol);


    book.bids.clear();

    book.asks.clear();


    if (
        Array.isArray(data.b)
    ) {

        for (
            const order of data.b
        ) {

            const price =
                Number(
                    order[0]
                );

            const qty =
                Number(
                    order[1]
                );


            if (
                price > 0 &&
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        Array.isArray(data.a)
    ) {

        for (
            const order of data.a
        ) {

            const price =
                Number(
                    order[0]
                );

            const qty =
                Number(
                    order[1]
                );


            if (
                price > 0 &&
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    book.lastUpdate =
        now();

}


/* =====================================================
   DELTA
===================================================== */

function applyDelta(
    symbol,
    data
) {

    const book =
        books.get(symbol);


    if (!book)
        return;


    if (
        Array.isArray(data.b)
    ) {

        for (
            const order of data.b
        ) {

            const price =
                Number(
                    order[0]
                );

            const qty =
                Number(
                    order[1]
                );


            if (
                qty === 0
            ) {

                book.bids.delete(
                    price
                );

            } else {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        Array.isArray(data.a)
    ) {

        for (
            const order of data.a
        ) {

            const price =
                Number(
                    order[0]
                );

            const qty =
                Number(
                    order[1]
                );


            if (
                qty === 0
            ) {

                book.asks.delete(
                    price
                );

            } else {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        book.bids.size >
        MAX_BOOK_LEVELS
    ) {

        trimBook(
            book.bids,
            true
        );

    }


    if (
        book.asks.size >
        MAX_BOOK_LEVELS
    ) {

        trimBook(
            book.asks,
            false
        );

    }


    book.lastUpdate =
        now();

}


/* =====================================================
   TRIM BOOK
===================================================== */

function trimBook(
    map,
    bids
) {

    const entries =
        [...map.entries()]
            .sort(
                (a, b) =>
                    bids
                        ? b[0] - a[0]
                        : a[0] - b[0]
            );


    map.clear();


    entries
        .slice(
            0,
            MAX_BOOK_LEVELS
        )
        .forEach(
            ([price, qty]) => {

                map.set(
                    price,
                    qty
                );

            }
        );

}


/* =====================================================
   TRADES
===================================================== */

function processTrade(
    data
) {

    if (
        !Array.isArray(data)
    )
        return;


    for (
        const trade of data
    ) {

        const symbol =
            trade.s;

        const side =
            trade.S;

        const price =
            Number(
                trade.p
            );

        const qty =
            Number(
                trade.v
            );

        const timestamp =
            Number(
                trade.T
            ) ||
            now();


        if (
            !symbol ||
            !price ||
            !qty
        )
            continue;


        const value =
            price * qty;


        if (
            !trades.has(symbol)
        ) {

            trades.set(
                symbol,
                []
            );

        }


        const list =
            trades.get(symbol);


        list.push({

            time:
                timestamp,

            side,

            price,

            qty,

            value

        });


        const book =
            books.get(symbol);


        if (book) {

            book.lastPrice =
                price;

        }


        const cutoff =
            now() -
            PRICE_WINDOW;


        while (
            list.length &&
            list[0].time <
            cutoff
        ) {

            list.shift();

        }


        if (
            list.length >
            500
        ) {

            list.splice(
                0,
                list.length -
                500
            );

        }

    }

}


/* =====================================================
   TRADE FLOW
===================================================== */

function getTradeFlow(
    symbol
) {

    const list =
        trades.get(symbol) ||
        [];


    const cutoff =
        now() -
        TRADE_WINDOW;


    let buy = 0;

    let sell = 0;

    let buyCount = 0;

    let sellCount = 0;


    for (
        let i =
            list.length - 1;

        i >= 0;

        i--
    ) {

        const t =
            list[i];


        if (
            t.time <
            cutoff
        )
            break;


        if (
            t.side ===
            "Buy"
        ) {

            buy +=
                t.value;

            buyCount++;

        }

        else {

            sell +=
                t.value;

            sellCount++;

        }

    }


    const total =
        buy + sell;


    const imbalance =
        total > 0
            ? (
                buy -
                sell
            ) / total
            : 0;


    return {

        buy,

        sell,

        total,

        imbalance,

        buyCount,

        sellCount

    };

}


/* =====================================================
   PRICE CHANGE
===================================================== */

function getPriceChange(
    symbol
) {

    const list =
        trades.get(symbol) ||
        [];


    if (
        list.length < 2
    )
        return 0;


    const latest =
        list[
            list.length - 1
        ];


    const cutoff =
        now() -
        PRICE_WINDOW;


    let old = null;


    for (
        let i = 0;

        i < list.length;

        i++
    ) {

        if (
            list[i].time >=
            cutoff
        ) {

            old =
                list[i];

            break;

        }

    }


    if (
        !old ||
        !old.price
    )
        return 0;


    return (
        latest.price -
        old.price
    ) /
    old.price;

}


/* =====================================================
   FIND WALLS
===================================================== */

function findWalls(
    symbol
) {

    const book =
        books.get(symbol);


    if (!book)
        return [];


    let currentPrice =
        book.lastPrice;


    if (!currentPrice) {

        const bids =
            [...book.bids.keys()]
                .sort(
                    (a, b) =>
                        b - a
                );

        const asks =
            [...book.asks.keys()]
                .sort(
                    (a, b) =>
                        a - b
                );


        if (
            bids.length &&
            asks.length
        ) {

            currentPrice =
                (
                    bids[0] +
                    asks[0]
                ) / 2;

        }

    }


    if (!currentPrice)
        return [];


    const result = [];


    /*
     * BUY WALLS
     */

    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        const distance =
            (
                currentPrice -
                price
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        const threshold =
            getDynamicThreshold(
                symbol,
                "Buy"
            );


        if (
            value <
            threshold
        )
            continue;


        result.push({

            symbol,

            side: "Buy",

            price,

            qty,

            value,

            distance,

            currentPrice,

            threshold

        });

    }


    /*
     * SELL WALLS
     */

    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        const distance =
            (
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        const threshold =
            getDynamicThreshold(
                symbol,
                "Sell"
            );


        if (
            value <
            threshold
        )
            continue;


        result.push({

            symbol,

            side: "Sell",

            price,

            qty,

            value,

            distance,

            currentPrice,

            threshold

        });

    }


    /*
     * Считаем локальный ratio.
     */

    const stats =
        getBookStatistics(
            symbol
        );


    for (
        const wall of result
    ) {

        const local =
            wall.side === "Buy"
                ? stats?.bidMedian || 1
                : stats?.askMedian || 1;


        wall.ratio =
            wall.value /
            Math.max(
                local,
                1
            );

    }


    /*
     * Сортировка.
     */

    result.sort(
        (a, b) => {

            const scoreA =
                a.value *
                Math.min(
                    a.ratio,
                    10
                );

            const scoreB =
                b.value *
                Math.min(
                    b.ratio,
                    10
                );


            return scoreB -
                   scoreA;

        }
    );


    return result.slice(
        0,
        8
    );

}


/* =====================================================
   WALL KEY
===================================================== */

function getWallKey(
    wall
) {

    /*
     * Более точная нормализация
     * цены для альтов.
     */

    let precision = 6;


    if (
        wall.price >= 1000
    )
        precision = 1;

    else if (
        wall.price >= 100
    )
        precision = 2;

    else if (
        wall.price >= 1
    )
        precision = 4;

    else if (
        wall.price >= 0.01
    )
        precision = 6;

    else
        precision = 8;


    const normalized =
        Number(
            wall.price.toFixed(
                precision
            )
        );


    return (
        wall.symbol +
        "_" +
        wall.side +
        "_" +
        normalized
    );

}


/* =====================================================
   UPDATE WALL HISTORY
===================================================== */

function updateWallHistory(
    wall
) {

    const key =
        getWallKey(wall);


    const timestamp =
        now();


    if (
        !wallHistory.has(key)
    ) {

        wallHistory.set(
            key,
            {

                key,

                symbol:
                    wall.symbol,

                side:
                    wall.side,

                price:
                    wall.price,

                firstSeen:
                    timestamp,

                lastSeen:
                    timestamp,

                lastValue:
                    wall.value,

                maxValue:
                    wall.value,

                samples: 1,

                disappeared: false

            }
        );

    }

    else {

        const item =
            wallHistory.get(key);


        item.lastSeen =
            timestamp;


        item.lastValue =
            wall.value;


        item.maxValue =
            Math.max(
                item.maxValue,
                wall.value
            );


        item.samples++;


        item.disappeared =
            false;

    }


    return wallHistory.get(key);

}


/* =====================================================
   WALL STABILITY
===================================================== */

function getWallStability(
    history,
    currentValue
) {

    if (!history)
        return 0;


    const age =
        now() -
        history.firstSeen;


    /*
     * Возраст.
     */

    const ageFactor =
        clamp(
            age / 15000,
            0,
            1
        );


    /*
     * Стабильность размера.
     */

    const maxValue =
        Math.max(
            history.maxValue,
            1
        );


    const valueRatio =
        currentValue /
        maxValue;


    const valueFactor =
        clamp(
            valueRatio,
            0,
            1
        );


    /*
     * Количество наблюдений.
     */

    const sampleFactor =
        clamp(
            history.samples / 15,
            0,
            1
        );


    return (
        ageFactor * 0.45 +
        valueFactor * 0.30 +
        sampleFactor * 0.25
    );

}


/* =====================================================
   WALL ATTACK
===================================================== */

function getWallAttack(
    wall,
    flow
) {

    if (
        wall.side === "Buy"
    ) {

        /*
         * Продавцы атакуют BUY wall.
         */

        if (
            flow.sell >
            flow.buy * 1.35
        ) {

            return true;

        }

    }


    if (
        wall.side === "Sell"
    ) {

        /*
         * Покупатели атакуют SELL wall.
         */

        if (
            flow.buy >
            flow.sell * 1.35
        ) {

            return true;

        }

    }


    return false;

}


/* =====================================================
   ABSORPTION
===================================================== */

function isAbsorption(
    wall,
    flow,
    priceChange
) {

    if (
        wall.side === "Buy"
    ) {

        return (
            flow.sell >
            flow.buy * 1.15 &&
            priceChange >
            -0.0012
        );

    }


    if (
        wall.side === "Sell"
    ) {

        return (
            flow.buy >
            flow.sell * 1.15 &&
            priceChange <
            0.0012
        );

    }


    return false;

}


/* =====================================================
   SETUP
===================================================== */

function determineSetup(
    wall,
    flow,
    priceChange,
    stability
) {

    const flowThreshold =
        getDynamicFlowThreshold(
            wall.symbol
        );


    if (
        flow.total <
        flowThreshold
    )
        return null;


    /*
     * =========================================
     * BUY WALL
     * =========================================
     */

    if (
        wall.side === "Buy"
    ) {

        /*
         * LONG:
         *
         * Стена стоит,
         * продажи атакуют её,
         * цена не падает.
         *
         * Это absorption.
         */

        if (
            isAbsorption(
                wall,
                flow,
                priceChange
            ) &&
            stability >= 0.30
        ) {

            return "LONG";

        }


        /*
         * BREAKDOWN:
         *
         * BUY wall атакован
         * продавцами и цена
         * действительно идёт вниз.
         */

        if (
            flow.sell >
            flow.buy * 1.50 &&
            priceChange <
            -0.0006
        ) {

            return "BREAKOUT";

        }

    }


    /*
     * =========================================
     * SELL WALL
     * =========================================
     */

    if (
        wall.side === "Sell"
    ) {

        /*
         * SHORT:
         *
         * Покупатели атакуют
         * SELL wall, но цена
         * не проходит выше.
         */

        if (
            isAbsorption(
                wall,
                flow,
                priceChange
            ) &&
            stability >= 0.30
        ) {

            return "SHORT";

        }


        /*
         * BREAKOUT UP.
         */

        if (
            flow.buy >
            flow.sell * 1.50 &&
            priceChange >
            0.0006
        ) {

            return "BREAKOUT";

        }

    }


    return null;

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(
    wall,
    flow,
    priceChange,
    history
) {

    let score = 0;


    /*
     * 1.
     * Размер стены.
     *
     * 20 points.
     */

    const threshold =
        wall.threshold;


    const sizeRatio =
        wall.value /
        Math.max(
            threshold,
            1
        );


    score +=
        Math.min(
            20,
            Math.log10(
                Math.max(
                    sizeRatio,
                    1
                )
            ) * 16
        );


    /*
     * 2.
     * Wall ratio.
     *
     * 20 points.
     */

    const ratioScore =
        clamp(
            (
                wall.ratio -
                2
            ) * 4,
            0,
            20
        );


    score +=
        ratioScore;


    /*
     * 3.
     * Возраст.
     *
     * 15 points.
     */

    const age =
        now() -
        history.firstSeen;


    score +=
        Math.min(
            15,
            age / 1000
        );


    /*
     * 4.
     * Flow.
     *
     * 25 points.
     */

    const alignedFlow =
        wall.side === "Buy"
            ? Math.max(
                0,
                flow.imbalance
            )
            : Math.max(
                0,
                -flow.imbalance
            );


    const attackFlow =
        wall.side === "Buy"
            ? Math.max(
                0,
                -flow.imbalance
            )
            : Math.max(
                0,
                flow.imbalance
            );


    /*
     * Для absorption
     * полезен противоположный flow,
     * поэтому учитываем его отдельно.
     */

    const flowQuality =
        Math.max(
            alignedFlow,
            attackFlow
        );


    score +=
        Math.min(
            25,
            flowQuality * 35
        );


    /*
     * 5.
     * Price reaction.
     *
     * 10 points.
     */

    const priceQuality =
        Math.min(
            1,
            Math.abs(
                priceChange
            ) * 1200
        );


    score +=
        priceQuality * 10;


    /*
     * 6.
     * Stability.
     *
     * 10 points.
     */

    const stability =
        getWallStability(
            history,
            wall.value
        );


    score +=
        stability * 10;


    return clamp(
        Math.round(score),
        0,
        100
    );

}


/* =====================================================
   TARGETS
===================================================== */

function calculateTargets(
    wall,
    setup,
    price
) {

    let tp = 0;

    let sl = 0;


    /*
     * Расстояние зависит
     * от типа актива.
     */

    const rank =
        symbolRanks.get(
            wall.symbol
        ) || 100;


    let tpPercent;

    let slPercent;


    if (
        rank <= 10
    ) {

        tpPercent =
            0.0035;

        slPercent =
            0.0020;

    }

    else if (
        rank <= 20
    ) {

        tpPercent =
            0.0045;

        slPercent =
            0.0025;

    }

    else if (
        rank <= 50
    ) {

        tpPercent =
            0.0060;

        slPercent =
            0.0035;

    }

    else {

        tpPercent =
            0.0080;

        slPercent =
            0.0045;

    }


    /*
     * LONG.
     */

    if (
        setup === "LONG"
    ) {

        tp =
            price *
            (
                1 +
                tpPercent
            );

        sl =
            price *
            (
                1 -
                slPercent
            );

    }


    /*
     * SHORT.
     */

    else if (
        setup === "SHORT"
    ) {

        tp =
            price *
            (
                1 -
                tpPercent
            );

        sl =
            price *
            (
                1 +
                slPercent
            );

    }


    /*
     * BREAKOUT.
     */

    else {

        if (
            wall.side === "Sell"
        ) {

            tp =
                price *
                (
                    1 +
                    tpPercent *
                    1.35
                );

            sl =
                price *
                (
                    1 -
                    slPercent
                );

        }

        else {

            tp =
                price *
                (
                    1 -
                    tpPercent *
                    1.35
                );

            sl =
                price *
                (
                    1 +
                    slPercent
                );

        }

    }


    return {

        tp,

        sl,

        tpPercent,

        slPercent

    };

}


/* =====================================================
   ANALYZE SYMBOL
===================================================== */

function analyzeSymbol(
    symbol
) {

    const book =
        books.get(symbol);


    if (!book)
        return;


    /*
     * Старую книгу не анализируем.
     */

    if (
        now() -
        book.lastUpdate >
        10000
    ) {

        return;

    }


    const walls =
        findWalls(
            symbol
        );


    if (
        walls.length === 0
    )
        return;


    const flow =
        getTradeFlow(
            symbol
        );


    const priceChange =
        getPriceChange(
            symbol
        );


    const requiredAge =
        Math.max(
            MIN_WALL_AGE,
            Number(
                document
                    .getElementById(
                        "wallAge"
                    )
                    .value
            ) * 1000
        );


    const strict =
        document
            .getElementById(
                "scanMode"
            )
            .value ===
        "strict";


    for (
        const wall of walls
    ) {

        const history =
            updateWallHistory(
                wall
            );


        const age =
            now() -
            history.firstSeen;


        /*
         * Стена должна существовать
         * минимум заданное время.
         */

        if (
            age <
            requiredAge
        )
            continue;


        const stability =
            getWallStability(
                history,
                wall.value
            );


        /*
         * В strict требуем
         * более устойчивую стену.
         */

        if (
            strict &&
            stability <
            0.45
        )
            continue;


        /*
         * Flow.
         */

        const flowThreshold =
            getDynamicFlowThreshold(
                symbol
            );


        const finalFlowThreshold =
            strict
                ? flowThreshold * 1.5
                : flowThreshold;


        if (
            flow.total <
            finalFlowThreshold
        )
            continue;


        /*
         * Определяем setup.
         */

        const setup =
            determineSetup(
                wall,
                flow,
                priceChange,
                stability
            );


        if (!setup)
            continue;


        /*
         * Score.
         */

        const score =
            calculateScore(
                wall,
                flow,
                priceChange,
                history
            );


        const minScore =
            Number(
                document
                    .getElementById(
                        "minScore"
                    )
                    .value
            );


        if (
            score <
            minScore
        )
            continue;


        /*
         * TP / SL.
         */

        const targets =
            calculateTargets(
                wall,
                setup,
                wall.currentPrice
            );


        const key =
            [
                wall.symbol,
                wall.side,
                getWallKey(wall)
            ].join("_");


        signals.set(
            key,
            {

                key,

                symbol,

                rank:
                    symbolRanks.get(
                        symbol
                    ),

                setup,

                score,

                wall,

                flow,

                priceChange,

                age,

                stability,

                threshold:
                    wall.threshold,

                tp:
                    targets.tp,

                sl:
                    targets.sl,

                updated:
                    now()

            }
        );

    }

}


/* =====================================================
   ANALYZE ALL
===================================================== */

function analyzeAll() {

    if (!running)
        return;


    for (
        const symbol of symbols
    ) {

        analyzeSymbol(
            symbol
        );

    }


    /*
     * Удаляем старые сигналы.
     */

    const expiry =
        now() -
        SIGNAL_EXPIRY;


    for (
        const [
            key,
            signal
        ]
        of signals
    ) {

        if (
            signal.updated <
            expiry
        ) {

            signals.delete(
                key
            );

        }

    }


    /*
     * Чистим историю стен.
     */

    const historyExpiry =
        now() -
        WALL_MEMORY;


    for (
        const [
            key,
            item
        ]
        of wallHistory
    ) {

        if (
            item.lastSeen <
            historyExpiry
        ) {

            wallHistory.delete(
                key
            );

        }

    }

}

/* =====================================================
   SUBSCRIBE
===================================================== */

function subscribeInBatches() {

    if (
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
    )
        return;


    const args = [];


    for (
        const symbol of symbols
    ) {

        args.push(
            `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
        );

        args.push(
            `publicTrade.${symbol}`
        );

    }


    for (
        let i = 0;

        i < args.length;

        i += SUBSCRIBE_BATCH_SIZE
    ) {

        const batch =
            args.slice(
                i,
                i +
                SUBSCRIBE_BATCH_SIZE
            );


        setTimeout(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    try {

                        ws.send(
                            JSON.stringify({

                                op:
                                    "subscribe",

                                args:
                                    batch

                            })
                        );

                    }

                    catch (error) {

                        console.error(
                            "Subscribe error:",
                            error
                        );

                    }

                }

            },
            i * 35
        );

    }

}


/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket() {

    if (!running)
        return;


    if (ws) {

        try {
            ws.close();
        }

        catch (e) {}

    }


    statusEl.innerText =
        "Подключение WebSocket...";

    statusEl.style.color =
        "#f7931a";


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        wsEl.innerText =
            "ON";

        wsEl.className =
            "stat-value green";


        statusEl.innerText =
            `WS подключён — TOP ${symbols.length}`;

        statusEl.style.color =
            "#27ae60";


        lastMarketMessage =
            now();

        marketMessageCount = 0;


        subscribeInBatches();

    };


    ws.onmessage =
        event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            /*
             * Subscribe response.
             */

            if (
                data.op ===
                "subscribe"
            ) {

                if (
                    data.success ===
                    false
                ) {

                    console.error(
                        "Subscribe error:",
                        data
                    );

                }

                return;

            }


            /*
             * Pong.
             */

            if (
                data.op ===
                "pong"
            ) {

                return;

            }


            if (
                !data.topic
            )
                return;


            lastMarketMessage =
                now();

            marketMessageCount++;


            /*
             * ORDERBOOK
             */

            if (
                data.topic
                    .startsWith(
                        "orderbook."
                    )
            ) {

                const parts =
                    data.topic
                        .split(".");


                const symbol =
                    parts[2];


                if (
                    data.type ===
                    "snapshot"
                ) {

                    applySnapshot(
                        symbol,
                        data.data
                    );

                }


                else if (
                    data.type ===
                    "delta"
                ) {

                    applyDelta(
                        symbol,
                        data.data
                    );

                }

            }


            /*
             * PUBLIC TRADE
             */

            else if (
                data.topic
                    .startsWith(
                        "publicTrade."
                    )
            ) {

                processTrade(
                    data.data
                );

            }

        }

        catch (error) {

            console.error(
                "WS parse error:",
                error
            );

        }

    };


    ws.onerror =
        error => {

        console.error(
            "WebSocket error:",
            error
        );


        wsEl.innerText =
            "ERROR";

        wsEl.className =
            "stat-value red";

    };


    ws.onclose =
        () => {

        wsEl.innerText =
            "OFF";

        wsEl.className =
            "stat-value red";


        if (
            running
        ) {

            statusEl.innerText =
                "WS разорван — переподключение";

            statusEl.style.color =
                "#f7931a";


            scheduleReconnect();

        }

    };

}


/* =====================================================
   RECONNECT
===================================================== */

function scheduleReconnect() {

    if (
        reconnectTimer
    )
        return;


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;


                if (
                    running
                ) {

                    connectWebSocket();

                }

            },
            3000
        );

}


/* =====================================================
   PING
===================================================== */

function startPing() {

    if (
        pingTimer
    ) {

        clearInterval(
            pingTimer
        );

    }


    pingTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    try {

                        ws.send(
                            JSON.stringify({

                                op:
                                    "ping"

                            })
                        );

                    }

                    catch (e) {}

                }

            },
            20000
        );

}


/* =====================================================
   WATCHDOG
===================================================== */

function startWatchdog() {

    if (
        watchdogTimer
    ) {

        clearInterval(
            watchdogTimer
        );

    }


    watchdogTimer =
        setInterval(
            () => {

                if (!running)
                    return;


                const silence =
                    now() -
                    lastMarketMessage;


                if (
                    silence >
                    12000
                ) {

                    dataWarningEl.innerText =
                        "⚠️ Нет market data > 12 сек. Переподключение...";


                    if (ws) {

                        try {
                            ws.close();
                        }

                        catch (e) {}

                    }

                }

                else {

                    dataWarningEl.innerText =
                        "";

                }

            },
            5000
        );

}


/* =====================================================
   LOAD SYMBOLS
===================================================== */

async function loadSymbols() {

    try {

        statusEl.innerText =
            "Загрузка TOP 100...";

        statusEl.style.color =
            "#f7931a";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear",
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Invalid Bybit response"
            );

        }


        const list =
            json.result.list

                .filter(
                    item => {

                        return (
                            item.symbol &&
                            item.symbol
                                .endsWith(
                                    "USDT"
                                ) &&
                            Number(
                                item.turnover24h
                            ) > 0
                        );

                    }
                )

                .sort(
                    (a, b) =>
                        Number(
                            b.turnover24h
                        ) -
                        Number(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length =
            0;


        symbolRanks.clear();

        symbolTurnovers.clear();


        list.forEach(
            (item, index) => {

                symbols.push(
                    item.symbol
                );


                symbolRanks.set(
                    item.symbol,
                    index + 1
                );


                symbolTurnovers.set(
                    item.symbol,
                    Number(
                        item.turnover24h
                    )
                );

            }
        );


        coinCountEl.innerText =
            symbols.length;


        statusEl.innerText =
            `TOP ${symbols.length} загружен`;

        statusEl.style.color =
            "#27ae60";


        return true;

    }

    catch (error) {

        console.error(
            "TOP error:",
            error
        );


        statusEl.innerText =
            "Ошибка загрузки TOP";

        statusEl.style.color =
            "#e74c3c";


        return false;

    }

}


/* =====================================================
   RESET
===================================================== */

function resetMarketState() {

    books.clear();

    trades.clear();

    wallHistory.clear();

    signals.clear();

}


/* =====================================================
   START
===================================================== */

async function startScanner() {

    if (
        running
    )
        return;


    running = true;


    resetMarketState();


    const success =
        await loadSymbols();


    if (
        !success
    ) {

        running =
            false;

        return;

    }


    connectWebSocket();

    startPing();

    startWatchdog();


    analysisTimer =
        setInterval(
            analyzeAll,
            ANALYSIS_INTERVAL
        );


    uiTimer =
        setInterval(
            renderSignals,
            UI_INTERVAL
        );


    symbolRefreshTimer =
        setInterval(
            async () => {

                if (!running)
                    return;


                statusEl.innerText =
                    "Обновление TOP...";


                await loadSymbols();


                resetMarketState();


                connectWebSocket();

            },
            SYMBOL_REFRESH
        );


    renderSignals();

}


/* =====================================================
   STOP
===================================================== */

function stopScanner() {

    running = false;


    if (
        analysisTimer
    ) {

        clearInterval(
            analysisTimer
        );

        analysisTimer =
            null;

    }


    if (
        uiTimer
    ) {

        clearInterval(
            uiTimer
        );

        uiTimer =
            null;

    }


    if (
        symbolRefreshTimer
    ) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer =
            null;

    }


    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;

    }


    if (
        pingTimer
    ) {

        clearInterval(
            pingTimer
        );

        pingTimer =
            null;

    }


    if (
        watchdogTimer
    ) {

        clearInterval(
            watchdogTimer
        );

        watchdogTimer =
            null;

    }


    if (ws) {

        try {
            ws.close();
        }

        catch (e) {}

        ws = null;

    }


    wsEl.innerText =
        "OFF";

    wsEl.className =
        "stat-value";


    statusEl.innerText =
        "Остановлен";

    statusEl.style.color =
        "#848e9c";


    dataWarningEl.innerText =
        "";

}


/* =====================================================
   CLEAR
===================================================== */

function clearSignals() {

    signals.clear();

    renderSignals();

}


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===

        ) {

            if (

                if (
                    silence >
                    10000
                ) {

                    statusEl.innerText =
                        "Восстановление WebSocket...";


                    connectWebSocket();

                }

            }

        }

    }
);
