<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bybit Whale Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            background: #0b0e11;
            color: #eaecef;
            margin: 0;
            padding: 15px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 15px 0;
        }

        .header {
            background: #1e2329;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .settings {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        button,
        select {
            background: #f7931a;
            border: none;
            color: #1e2329;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        select {
            background: #2b3139;
            color: #eaecef;
        }

        button:hover {
            opacity: 0.9;
        }

        button.stop {
            background: #e74c3c;
            color: white;
        }

        button.pause {
            background: #3498db;
            color: white;
        }

        button.clear {
            background: #555;
            color: white;
        }

        .status {
            color: #848e9c;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .stat {
            background: #161a1e;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 12px;
        }

        .stat-value {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
        }

        .green {
            color: #27ae60;
        }

        .orange {
            color: #f7931a;
        }

        .red {
            color: #e74c3c;
        }

        .blue {
            color: #3498db;
        }

        .section-title {
            font-size: 14px;
            color: #848e9c;
            margin: 15px 0 8px;
        }

        /*
         * ВАЖНО:
         * Список сигналов НЕ прокручивается автоматически.
         * У него фиксированная высота.
         */
        .list {
            height: 65vh;
            min-height: 350px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .notification {
            background: #1e2329;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 5px solid #f7931a;
            font-size: 14px;
        }

        .notification.buy {
            border-left-color: #27ae60;
        }

        .notification.sell {
            border-left-color: #e74c3c;
        }

        .coin {
            font-size: 17px;
            font-weight: bold;
        }

        .side {
            font-weight: bold;
            margin-left: 5px;
        }

        .amount {
            font-size: 20px;
            font-weight: bold;
            margin: 7px 0;
        }

        .details {
            color: #b7bdc6;
            line-height: 1.7;
            font-size: 13px;
        }

        .time {
            color: #848e9c;
            font-size: 11px;
            margin-top: 7px;
        }

        .empty {
            text-align: center;
            color: #848e9c;
            padding: 50px 15px;
        }

        .paused {
            opacity: 0.7;
        }

        @media (max-width: 600px) {

            .stats {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .list {
                height: 60vh;
            }

            .amount {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <h1>🐋 Bybit Whale Scanner</h1>

    <div class="settings">

        <button onclick="startScan()">
            ▶ Запуск
        </button>

        <button class="stop" onclick="stopScan()">
            ⏹ Стоп
        </button>

        <button class="pause" onclick="toggleDisplayPause()">
            ⏸ Пауза экрана
        </button>

        <button class="clear" onclick="clearNotifications()">
            🗑 Очистить
        </button>

    </div>


    <div class="settings">

        <label>
            Подтверждение заявки:
        </label>

        <select id="stabilitySelect">
            <option value="3">3 секунды</option>
            <option value="5">5 секунд</option>
            <option value="10">10 секунд</option>
        </select>

    </div>


    <div class="status">

        Статус:
        <span id="status">
            Остановлен
        </span>

    </div>


    <div class="stats">

        <div class="stat">

            Монет

            <span
                class="stat-value"
                id="coinCount"
            >
                0
            </span>

        </div>


        <div class="stat">

            WebSocket

            <span
                class="stat-value"
                id="wsStatus"
            >
                OFF
            </span>

        </div>


        <div class="stat">

            Сигналов

            <span
                class="stat-value"
                id="signalCount"
            >
                0
            </span>

        </div>

    </div>

</div>


<div class="section-title">

    🐋 Подтверждённые крупные заявки

</div>


<div
    id="notifications"
    class="list"
>

    <div
        id="emptyMessage"
        class="empty"
    >
        Запусти сканер.<br>
        Здесь появятся подтверждённые заявки.
    </div>

</div>


<script>

/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

// Теперь сканируем только TOP-100
const MAX_SYMBOLS = 100;

// Глубина стакана
const ORDERBOOK_DEPTH = 50;

// Обновляем рейтинг монет каждые 5 минут
const SYMBOL_REFRESH_TIME = 5 * 60 * 1000;

// Максимум сигналов на экране
const MAX_SIGNALS = 50;

// Минимальное время между повторными
// сигналами одной и той же заявки
const ALERT_COOLDOWN = 10000;


/* =========================================================
   ПОРОГИ
=========================================================

   1–5      = $500,000
   6–20     = $300,000
   21–50    = $180,000
   51–100   = $100,000

========================================================= */

const THRESHOLDS = {

    top5: 500000,

    top20: 300000,

    top50: 180000,

    top100: 100000

};


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let ws = null;

let isRunning = false;

let displayPaused = false;

let reconnectTimer = null;

let symbolRefreshTimer = null;

let heartbeatTimer = null;


/*
 * Список TOP-100
 */
const symbols = [];


/*
 * Рейтинг:
 *
 * BTCUSDT -> 1
 * ETHUSDT -> 2
 * ...
 */
const symbolRanks = new Map();


/*
 * Локальные стаканы.
 */
const orderBooks = new Map();


/*
 * Заявки, которые мы отслеживаем.
 */
const stableOrders = new Map();


/*
 * Последние сигналы по заявкам.
 */
const alertedOrders = new Map();


/*
 * Счётчик сигналов.
 */
let signalCount = 0;


/* =========================================================
   DOM
========================================================= */

const notificationsDiv =
    document.getElementById("notifications");

const statusDiv =
    document.getElementById("status");

const wsStatusDiv =
    document.getElementById("wsStatus");

const coinCountDiv =
    document.getElementById("coinCount");

const signalCountDiv =
    document.getElementById("signalCount");

const stabilitySelect =
    document.getElementById("stabilitySelect");


/* =========================================================
   ПОЛУЧЕНИЕ ТЕКУЩЕГО ВРЕМЕНИ ПОДТВЕРЖДЕНИЯ
========================================================= */

function getStabilityTime() {

    return parseInt(
        stabilitySelect.value
    ) || 3;

}


/* =========================================================
   ПОЛУЧЕНИЕ ПОРОГА
========================================================= */

function getThreshold(symbol) {

    const rank =
        symbolRanks.get(symbol);

    if (!rank) {

        return THRESHOLDS.top100;

    }


    /*
     * 1–5
     */
    if (rank <= 5) {

        return THRESHOLDS.top5;

    }


    /*
     * 6–20
     */
    if (rank <= 20) {

        return THRESHOLDS.top20;

    }


    /*
     * 21–50
     */
    if (rank <= 50) {

        return THRESHOLDS.top50;

    }


    /*
     * 51–100
     */
    return THRESHOLDS.top100;

}


/* =========================================================
   ФОРМАТИРОВАНИЕ ДЕНЕГ
========================================================= */

function formatMoney(value) {

    return Number(value).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 0
        }
    );

}


/* =========================================================
   ФОРМАТИРОВАНИЕ ПОРОГА
========================================================= */

function formatThreshold(value) {

    if (value >= 1000000) {

        return "$" +
            (value / 1000000).toFixed(1) +
            "M";

    }

    return "$" +
        (value / 1000).toFixed(0) +
        "K";

}


/* =========================================================
   УВЕДОМЛЕНИЕ БРАУЗЕРА
========================================================= */

function sendNotification(
    title,
    body
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            title,
            {
                body: body
            }
        );

    }

}


/* =========================================================
   ДОБАВЛЕНИЕ СИГНАЛА
========================================================= */

function addNotification(
    symbol,
    side,
    price,
    value,
    rank,
    threshold
) {

    /*
     * Если отображение поставлено
     * на паузу — сигнал НЕ теряется
     * в логике сканера, но не появляется
     * на экране.
     */
    if (displayPaused) {

        return;

    }


    const empty =
        document.getElementById(
            "emptyMessage"
        );


    if (empty) {

        empty.remove();

    }


    const div =
        document.createElement(
            "div"
        );


    const sideText =
        side === "Buy"
            ? "🟢 BUY"
            : "🔴 SELL";


    const sideClass =
        side === "Buy"
            ? "buy"
            : "sell";


    div.className =
        "notification " +
        sideClass;


    div.innerHTML = `

        <div class="coin">

            🐋 ${symbol}

            <span class="side">
                ${sideText}
            </span>

        </div>


        <div class="amount">

            $${formatMoney(value)}

        </div>


        <div class="details">

            💵 Цена:
            <b>${price}</b>

            <br>

            📊 Рейтинг:
            <b>#${rank}</b>

            <br>

            🎯 Порог:
            <b>${formatThreshold(threshold)}</b>

        </div>


        <div class="time">

            Сигнал:
            ${new Date().toLocaleTimeString()}

        </div>

    `;


    /*
     * ВАЖНО:
     *
     * Добавляем в конец,
     * а не prepend().
     *
     * Поэтому экран не будет
     * постоянно прыгать.
     */
    notificationsDiv.appendChild(
        div
    );


    /*
     * Если сигналов стало больше 50,
     * удаляем самый старый.
     */
    while (
        notificationsDiv
            .children
            .length > MAX_SIGNALS
    ) {

        notificationsDiv
            .removeChild(
                notificationsDiv.firstElementChild
            );

    }


    signalCount++;

    signalCountDiv.innerText =
        signalCount;

}


/* =========================================================
   ЗАГРУЗКА TOP-100
========================================================= */

async function loadSymbols() {

    try {

        statusDiv.innerText =
            "Загрузка TOP-100...";

        statusDiv.style.color =
            "#f7931a";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Некорректный ответ Bybit"
            );

        }


        /*
         * Только USDT perpetual.
         */
        const topCoins =
            json.result.list

                .filter(
                    coin =>
                        coin.symbol &&
                        coin.symbol.endsWith(
                            "USDT"
                        ) &&
                        parseFloat(
                            coin.turnover24h
                        ) > 0
                )

                .sort(
                    (a, b) =>
                        parseFloat(
                            b.turnover24h
                        ) -
                        parseFloat(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        /*
         * Очищаем старый рейтинг.
         */
        symbols.length = 0;

        symbolRanks.clear();


        /*
         * Заполняем TOP-100.
         */
        topCoins.forEach(
            (coin, index) => {

                const symbol =
                    coin.symbol;

                const rank =
                    index + 1;


                symbols.push(
                    symbol
                );


                symbolRanks.set(
                    symbol,
                    rank
                );

            }
        );


        coinCountDiv.innerText =
            symbols.length;


        console.log(
            "TOP-100 загружен:",
            symbols
        );


        return true;


    } catch (error) {

        console.error(
            "Ошибка загрузки TOP-100:",
            error
        );


        statusDiv.innerText =
            "Ошибка загрузки";

        statusDiv.style.color =
            "#e74c3c";


        return false;

    }

}


/* =========================================================
   СОЗДАНИЕ СТАКАНА
========================================================= */

function createOrderBook(
    symbol
) {

    orderBooks.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map()
        }
    );

}


/* =========================================================
   SNAPSHOT
========================================================= */

function applySnapshot(
    symbol,
    data
) {

    createOrderBook(
        symbol
    );


    const book =
        orderBooks.get(
            symbol
        );


    /*
     * BID
     */
    if (
        Array.isArray(data.b)
    ) {

        data.b.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(
                        order[1]
                    );


                if (
                    qty > 0
                ) {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    /*
     * ASK
     */
    if (
        Array.isArray(data.a)
    ) {

        data.a.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(
                        order[1]
                    );


                if (
                    qty > 0
                ) {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );

    }

}


/* =========================================================
   DELTA
========================================================= */

function applyDelta(
    symbol,
    data
) {

    if (
        !orderBooks.has(
            symbol
        )
    ) {

        return;

    }


    const book =
        orderBooks.get(
            symbol
        );


    /*
     * BID
     */
    if (
        Array.isArray(data.b)
    ) {

        data.b.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(
                        order[1]
                    );


                if (
                    qty === 0
                ) {

                    book.bids.delete(
                        price
                    );

                } else {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    /*
     * ASK
     */
    if (
        Array.isArray(data.a)
    ) {

        data.a.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(
                        order[1]
                    );


                if (
                    qty === 0
                ) {

                    book.asks.delete(
                        price
                    );

                } else {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );

    }

}


/* =========================================================
   ПРОВЕРКА ОДНОЙ ЗАЯВКИ
========================================================= */

function checkOrder(
    symbol,
    price,
    qty,
    side
) {

    const priceNumber =
        parseFloat(price);

    const qtyNumber =
        parseFloat(qty);


    if (
        !isFinite(
            priceNumber
        ) ||
        !isFinite(
            qtyNumber
        ) ||
        priceNumber <= 0 ||
        qtyNumber <= 0
    ) {

        return;

    }


    /*
     * Размер заявки в USDT.
     */
    const value =
        priceNumber *
        qtyNumber;


    /*
     * Порог именно этой монеты.
     */
    const threshold =
        getThreshold(
            symbol
        );


    const key =
        `${symbol}_${side}_${price}`;


    /*
     * Если ниже порога —
     * прекращаем отслеживание.
     */
    if (
        value < threshold
    ) {

        stableOrders.delete(
            key
        );

        return;

    }


    const now =
        Date.now();


    /*
     * Новая крупная заявка.
     */
    if (
        !stableOrders.has(
            key
        )
    ) {

        stableOrders.set(
            key,
            {
                firstSeen: now,
                lastSeen: now,
                lastValue: value,
                side: side,
                price: price,
                symbol: symbol
            }
        );

        return;

    }


    const order =
        stableOrders.get(
            key
        );


    /*
     * Обновляем информацию.
     */
    order.lastSeen =
        now;

    order.lastValue =
        value;


    /*
     * Сколько заявка
     * находится выше порога.
     */
    const aliveTime =
        now -
        order.firstSeen;


    const requiredTime =
        getStabilityTime() *
        1000;


    /*
     * Ещё не достаточно времени.
     */
    if (
        aliveTime <
        requiredTime
    ) {

        return;

    }


    /*
     * Проверяем cooldown.
     */
    const lastAlert =
        alertedOrders.get(
            key
        ) || 0;


    if (
        now -
        lastAlert <
        ALERT_COOLDOWN
    ) {

        return;

    }


    alertedOrders.set(
        key,
        now
    );


    const rank =
        symbolRanks.get(
            symbol
        );


    /*
     * Уведомление.
     */
    sendNotification(

        `🐋 ${symbol} ${side}`,

        `Заявка $${formatMoney(value)} ` +
        `| рейтинг #${rank}`

    );


    /*
     * Сигнал на экране.
     */
    addNotification(

        symbol,
        side,
        price,
        value,
        rank,
        threshold

    );


    /*
     * Чтобы не получить
     * мгновенный повтор.
     */
    stableOrders.delete(
        key
    );

}


/* =========================================================
   АНАЛИЗ СТАКАНА
========================================================= */

function analyzeOrderBook(
    symbol
) {

    if (
        !orderBooks.has(
            symbol
        )
    ) {

        return;

    }


    const book =
        orderBooks.get(
            symbol
        );


    /*
     * BID
     */
    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        checkOrder(
            symbol,
            price,
            qty,
            "Buy"
        );

    }


    /*
     * ASK
     */
    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        checkOrder(
            symbol,
            price,
            qty,
            "Sell"
        );

    }

}


/* =========================================================
   WEBSOCKET MESSAGE
========================================================= */

function handleWebSocketMessage(
    event
) {

    try {

        const data =
            JSON.parse(
                event.data
            );


        if (
            !data.topic
        ) {

            return;

        }


        if (
            !data.topic.startsWith(
                "orderbook."
            )
        ) {

            return;

        }


        const parts =
            data.topic.split(
                "."
            );


        const symbol =
            parts[2];


        if (
            !symbol
        ) {

            return;

        }


        /*
         * SNAPSHOT
         */
        if (
            data.type ===
            "snapshot"
        ) {

            applySnapshot(
                symbol,
                data.data
            );

        }


        /*
         * DELTA
         */
        else if (
            data.type ===
            "delta"
        ) {

            applyDelta(
                symbol,
                data.data
            );

        }


        /*
         * Анализируем
         * обновлённый стакан.
         */
        analyzeOrderBook(
            symbol
        );


    } catch (error) {

        console.error(
            "WS processing error:",
            error
        );

    }

}


/* =========================================================
   HEARTBEAT
========================================================= */

function startHeartbeat() {

    stopHeartbeat();


    heartbeatTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


function stopHeartbeat() {

    if (
        heartbeatTimer
    ) {

        clearInterval(
            heartbeatTimer
        );

        heartbeatTimer = null;

    }

}


/* =========================================================
   WEBSOCKET CONNECT
========================================================= */

function connectWebSocket() {

    if (
        !isRunning
    ) {

        return;

    }


    if (
        ws
    ) {

        try {

            ws.close();

        } catch (e) {}

    }


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        console.log(
            "WebSocket connected"
        );


        wsStatusDiv.innerText =
            "ON";

        wsStatusDiv.className =
            "green";


        statusDiv.innerText =
            "Сканирование активно";

        statusDiv.style.color =
            "#27ae60";


        /*
         * TOP-100.
         */
        const topics =
            symbols.map(
                symbol =>
                    `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );


        ws.send(
            JSON.stringify({

                op: "subscribe",

                args: topics

            })
        );


        startHeartbeat();

    };


    ws.onmessage =
        handleWebSocketMessage;


    ws.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );

            wsStatusDiv.innerText =
                "ERROR";

            wsStatusDiv.className =
                "red";

        };


    ws.onclose = () => {

        stopHeartbeat();


        wsStatusDiv.innerText =
            "OFF";

        wsStatusDiv.className =
            "red";


        if (
            isRunning
        ) {

            statusDiv.innerText =
                "Переподключение...";

            statusDiv.style.color =
                "#f7931a";


            scheduleReconnect();

        }

    };

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (
        !isRunning
    ) {

        return;

    }


    if (
        reconnectTimer
    ) {

        return;

    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            3000
        );

}


/* =========================================================
   ОБНОВЛЕНИЕ TOP-100
========================================================= */

async function refreshSymbols() {

    if (
        !isRunning
    ) {

        return;

    }


    console.log(
        "Обновление TOP-100..."
    );


    const success =
        await loadSymbols();


    if (
        success
    ) {

        /*
         * Очищаем старые стаканы,
         * потому что состав рейтинга
         * мог измениться.
         */
        orderBooks.clear();

        stableOrders.clear();


        connectWebSocket();

    }

}


/* =========================================================
   ПАУЗА ЭКРАНА
========================================================= */

function toggleDisplayPause() {

    displayPaused =
        !displayPaused;


    const button =
        document.querySelector(
            ".pause"
        );


    if (
        displayPaused
    ) {

        button.innerText =
            "▶ Продолжить экран";


        button.classList.add(
            "paused"
        );


        statusDiv.innerText =
            "Сканирование идёт | экран на паузе";

    } else {

        button.innerText =
            "⏸ Пауза экрана";


        button.classList.remove(
            "paused"
        );


        statusDiv.innerText =
            "Сканирование активно";

    }

}


/* =========================================================
   ЗАПУСК
========================================================= */

async function startScan() {

    if (
        isRunning
    ) {

        return;

    }


    isRunning =
        true;


    statusDiv.innerText =
        "Загрузка TOP-100...";

    statusDiv.style.color =
        "#f7931a";


    /*
     * Разрешение уведомлений.
     */
    if (
        "Notification" in window &&
        Notification.permission ===
        "default"
    ) {

        try {

            await Notification.requestPermission();

        } catch (e) {}

    }


    /*
     * Получаем TOP-100.
     */
    const success =
        await loadSymbols();


    if (
        !success
    ) {

        isRunning =
            false;

        return;

    }


    /*
     * Подключаем WebSocket.
     */
    connectWebSocket();


    /*
     * Обновляем рейтинг каждые 5 минут.
     */
    symbolRefreshTimer =
        setInterval(
            refreshSymbols,
            SYMBOL_REFRESH_TIME
        );

}


/* =========================================================
   СТОП
========================================================= */

function stopScan() {

    isRunning =
        false;


    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;

    }


    if (
        symbolRefreshTimer
    ) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer =
            null;

    }


    stopHeartbeat();


    if (
        ws
    ) {

        try {

            ws.close();

        } catch (e) {}

        ws = null;

    }


    orderBooks.clear();

    stableOrders.clear();


    statusDiv.innerText =
        "Остановлен";

    statusDiv.style.color =
        "#848e9c";


    wsStatusDiv.innerText =
        "OFF";

    wsStatusDiv.className = "";

}


/* =========================================================
   ОЧИСТКА СИГНАЛОВ
========================================================= */

function clearNotifications() {

    notificationsDiv.innerHTML = `

        <div
            id="emptyMessage"
            class="empty"
        >
            Список очищен.<br>
            Ждём новые сигналы.
        </div>

    `;


    signalCount =
        0;


    signalCountDiv.innerText =
        "0";

}

);

);

    THRESHOLDS
);
