<script>


/* =====================================================
   CONFIG
===================================================== */


/*
 * Сканируем TOP-100.
 */

const MAX_SYMBOLS = 100;


/*
 * 50 уровней стакана.
 */

const ORDERBOOK_DEPTH = 50;


/*
 * Максимум одновременно
 * отображаемых сигналов.
 */

const MAX_SIGNALS = 10;


/*
 * Анализ.
 */

const ANALYSIS_INTERVAL = 500;


/*
 * UI.
 */

const UI_INTERVAL = 700;


/*
 * Обновление TOP.
 */

const SYMBOL_REFRESH =
    5 * 60 * 1000;


/*
 * Окно агрессивных сделок.
 */

const TRADE_WINDOW = 10000;


/*
 * Окно цены.
 */

const PRICE_WINDOW = 60000;


/*
 * Максимальное расстояние
 * стены от цены.
 */

const MAX_WALL_DISTANCE = 0.008;


/*
 * Risk / Reward.
 */

const TAKE_PROFIT_RR = 1.8;


/*
 * WebSocket heartbeat.
 */

const PING_INTERVAL = 20000;


/*
 * Сколько символов
 * на одно WS соединение.
 *
 * Это снижает нагрузку
 * и делает соединение
 * стабильнее.
 */

const WS_CHUNK_SIZE = 50;


/* =====================================================
   ADAPTIVE SETTINGS
===================================================== */


/*
 * Для каждой группы:
 *
 * localRange =
 * зона локальной ликвидности
 *
 * minRatio =
 * насколько стена должна быть
 * крупнее обычного уровня
 *
 * minWall =
 * абсолютный минимальный размер
 *
 * stopBuffer =
 * минимальный буфер SL.
 */

const GROUP_SETTINGS = {

    top5: {

        maxRank: 5,

        localRange: 0.0030,

        minRatio: 3.0,

        minWall: 500000,

        stopBuffer: 0.0018

    },


    top20: {

        maxRank: 20,

        localRange: 0.0035,

        minRatio: 2.8,

        minWall: 300000,

        stopBuffer: 0.0022

    },


    top50: {

        maxRank: 50,

        localRange: 0.0050,

        minRatio: 2.5,

        minWall: 150000,

        stopBuffer: 0.0030

    },


    top100: {

        maxRank: 100,

        localRange: 0.0070,

        minRatio: 2.2,

        minWall: 50000,

        stopBuffer: 0.0040

    }

};


/* =====================================================
   STATE
===================================================== */

let running = false;


/*
 * Несколько WS соединений.
 */

let sockets = [];


/*
 * Таймеры.
 */

let reconnectTimer = null;

let symbolRefreshTimer = null;

let analysisTimer = null;

let uiTimer = null;

let pingTimer = null;


/*
 * Чтобы не запускать
 * два reconnect одновременно.
 */

let reconnecting = false;


/*
 * TOP symbols.
 */

const symbols = [];

const symbolRanks = new Map();


/*
 * Order books.
 */

const books = new Map();


/*
 * Trades.
 */

const trades = new Map();


/*
 * Wall history.
 */

const wallHistory = new Map();


/*
 * Signals.
 */

const signals = new Map();


/* =====================================================
   DOM
===================================================== */

const statusEl =
    document.getElementById(
        "status"
    );

const wsEl =
    document.getElementById(
        "wsStatus"
    );

const coinCountEl =
    document.getElementById(
        "coinCount"
    );

const candidateCountEl =
    document.getElementById(
        "candidateCount"
    );

const signalCountEl =
    document.getElementById(
        "signalCount"
    );

const signalsEl =
    document.getElementById(
        "signals"
    );


/* =====================================================
   HELPERS
===================================================== */

function now() {

    return Date.now();

}


function money(value) {

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


function priceFormat(value) {

    const n =
        Number(value);


    if (!Number.isFinite(n))
        return "-";


    if (n >= 1000)
        return n.toFixed(2);


    if (n >= 100)
        return n.toFixed(3);


    if (n >= 1)
        return n.toFixed(4);


    if (n >= 0.01)
        return n.toFixed(5);


    if (n >= 0.0001)
        return n.toFixed(7);


    return n.toFixed(10);

}


function percent(value) {

    return (
        value * 100
    ).toFixed(2) + "%";

}


/* =====================================================
   GROUP SETTINGS
===================================================== */

function getGroupSettings(symbol) {

    const rank =
        symbolRanks.get(
            symbol
        );


    if (!rank)
        return GROUP_SETTINGS.top100;


    if (rank <= 5)
        return GROUP_SETTINGS.top5;


    if (rank <= 20)
        return GROUP_SETTINGS.top20;


    if (rank <= 50)
        return GROUP_SETTINGS.top50;


    return GROUP_SETTINGS.top100;

}


/* =====================================================
   CREATE BOOK
===================================================== */

function createBook(symbol) {

    books.set(
        symbol,
        {

            bids: new Map(),

            asks: new Map(),

            lastPrice: null,

            lastUpdate: now()

        }
    );

}


/* =====================================================
   SNAPSHOT
===================================================== */

function applySnapshot(
    symbol,
    data
) {

    /*
     * Snapshot всегда
     * полностью заменяет
     * старый стакан.
     */

    createBook(
        symbol
    );


    const book =
        books.get(
            symbol
        );


    if (Array.isArray(data.b)) {

        for (
            const order of data.b
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (
                price > 0 &&
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (Array.isArray(data.a)) {

        for (
            const order of data.a
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (
                price > 0 &&
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    book.lastUpdate =
        now();

}


/* =====================================================
   DELTA
===================================================== */

function applyDelta(
    symbol,
    data
) {

    const book =
        books.get(
            symbol
        );


    if (!book)
        return;


    if (Array.isArray(data.b)) {

        for (
            const order of data.b
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (!price)
                continue;


            if (qty === 0) {

                book.bids.delete(
                    price
                );

            } else {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (Array.isArray(data.a)) {

        for (
            const order of data.a
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (!price)
                continue;


            if (qty === 0) {

                book.asks.delete(
                    price
                );

            } else {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    book.lastUpdate =
        now();

}


/* =====================================================
   TRADE
===================================================== */

function processTrade(
    data
) {

    if (!Array.isArray(data))
        return;


    for (
        const trade of data
    ) {

        const symbol =
            trade.s;


        const side =
            trade.S;


        const price =
            parseFloat(
                trade.p
            );


        const qty =
            parseFloat(
                trade.v
            );


        const timestamp =
            Number(
                trade.T
            ) || now();


        if (
            !symbol ||
            !price ||
            !qty
        )
            continue;


        const value =
            price * qty;


        if (
            !trades.has(
                symbol
            )
        ) {

            trades.set(
                symbol,
                []
            );

        }


        const list =
            trades.get(
                symbol
            );


        list.push({

            time:
                timestamp,

            side:
                side,

            price:
                price,

            qty:
                qty,

            value:
                value

        });


        const book =
            books.get(
                symbol
            );


        if (book) {

            book.lastPrice =
                price;

        }


        const cutoff =
            now() -
            PRICE_WINDOW;


        while (
            list.length &&
            list[0].time <
            cutoff
        ) {

            list.shift();

        }

    }

}


/* =====================================================
   TRADE FLOW
===================================================== */

function getTradeFlow(
    symbol
) {

    const list =
        trades.get(
            symbol
        ) || [];


    const cutoff =
        now() -
        TRADE_WINDOW;


    let buy = 0;

    let sell = 0;

    let buyCount = 0;

    let sellCount = 0;


    for (
        let i =
            list.length - 1;

        i >= 0;

        i--
    ) {

        const t =
            list[i];


        if (
            t.time <
            cutoff
        )
            break;


        if (
            t.side === "Buy"
        ) {

            buy +=
                t.value;

            buyCount++;

        } else {

            sell +=
                t.value;

            sellCount++;

        }

    }


    const total =
        buy + sell;


    let imbalance = 0;


    if (total > 0) {

        imbalance =
            (
                buy -
                sell
            ) /
            total;

    }


    return {

        buy,

        sell,

        total,

        imbalance,

        buyCount,

        sellCount

    };

}


/* =====================================================
   PRICE CHANGE
===================================================== */

function getPriceChange(
    symbol
) {

    const list =
        trades.get(
            symbol
        ) || [];


    if (
        list.length < 2
    )
        return 0;


    const latest =
        list[
            list.length - 1
        ];


    const cutoff =
        now() -
        PRICE_WINDOW;


    let old = null;


    for (
        let i = 0;

        i < list.length;

        i++
    ) {

        if (
            list[i].time >=
            cutoff
        ) {

            old =
                list[i];

            break;

        }

    }


    if (
        !old ||
        !old.price
    )
        return 0;


    return (
        latest.price -
        old.price
    ) / old.price;

}


/* =====================================================
   LOCAL LIQUIDITY
===================================================== */


/*
 * Адаптивная локальная
 * ликвидность.
 *
 * Для каждого ранга
 * своя зона.
 *
 * Потенциальная стена
 * исключается из расчёта.
 */

function getLocalLiquidity(
    book,
    side,
    currentPrice,
    excludePrice,
    settings
) {

    if (
        !book ||
        !currentPrice
    )
        return 1;


    const source =
        side === "Buy"
            ? book.bids
            : book.asks;


    const values = [];


    for (
        const [
            price,
            qty
        ]
        of source
    ) {

        if (
            price ===
            excludePrice
        )
            continue;


        const distance =
            Math.abs(
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance >
            settings.localRange
        )
            continue;


        const value =
            price * qty;


        if (
            value > 0
        ) {

            values.push(
                value
            );

        }

    }


    if (
        values.length === 0
    )
        return 1;


    values.sort(
        (a, b) =>
            a - b
    );


    /*
     * Убираем верхние
     * экстремальные значения.
     *
     * Это защищает
     * baseline от другой
     * крупной стены.
     */

    let filtered =
        values;


    if (
        values.length >= 8
    ) {

        const upperIndex =
            Math.floor(
                values.length *
                0.80
            );


        filtered =
            values.slice(
                0,
                Math.max(
                    3,
                    upperIndex
                )
            );

    }


    const middle =
        Math.floor(
            filtered.length / 2
        );


    return Math.max(
        filtered[middle],
        1
    );

}


/* =====================================================
   FIND WALLS
===================================================== */

function findWalls(
    symbol
) {

    const book =
        books.get(
            symbol
        );


    if (!book)
        return [];


    let currentPrice =
        book.lastPrice;


    /*
     * Если trades ещё нет,
     * используем mid price.
     */

    if (!currentPrice) {

        const bids =
            [...book.bids.keys()]
                .sort(
                    (a, b) =>
                        b - a
                );


        const asks =
            [...book.asks.keys()]
                .sort(
                    (a, b) =>
                        a - b
                );


        if (
            bids.length &&
            asks.length
        ) {

            currentPrice =
                (
                    bids[0] +
                    asks[0]
                ) / 2;

        }

    }


    if (!currentPrice)
        return [];


    const settings =
        getGroupSettings(
            symbol
        );


    const result = [];


    /* =================================================
       BUY WALLS
    ================================================= */

    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        const distance =
            (
                currentPrice -
                price
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        if (
            value <
            settings.minWall
        )
            continue;


        const local =
            getLocalLiquidity(
                book,
                "Buy",
                currentPrice,
                price,
                settings
            );


        const ratio =
            value /
            Math.max(
                local,
                1
            );


        if (
            ratio >=
            settings.minRatio
        ) {

            result.push({

                symbol,

                side:
                    "Buy",

                price,

                qty,

                value,

                distance,

                ratio,

                currentPrice,

                settings

            });

        }

    }


    /* =================================================
       SELL WALLS
    ================================================= */

    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        const distance =
            (
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        if (
            value <
            settings.minWall
        )
            continue;


        const local =
            getLocalLiquidity(
                book,
                "Sell",
                currentPrice,
                price,
                settings
            );


        const ratio =
            value /
            Math.max(
                local,
                1
            );


        if (
            ratio >=
            settings.minRatio
        ) {

            result.push({

                symbol,

                side:
                    "Sell",

                price,

                qty,

                value,

                distance,

                ratio,

                currentPrice,

                settings

            });

        }

    }


    result.sort(
        (a, b) =>
            (
                b.ratio *
                Math.log10(
                    Math.max(
                        b.value,
                        1
                    )
                )
            ) -
            (
                a.ratio *
                Math.log10(
                    Math.max(
                        a.value,
                        1
                    )
                )
            )
    );


    return result.slice(
        0,
        6
    );

}


/* =====================================================
   WALL HISTORY
===================================================== */

function updateWallHistory(
    wall
) {

    /*
     * Округляем цену ключа,
     * чтобы небольшие изменения
     * не создавали бесконечно
     * новые стены.
     */

    const precision =
        wall.price < 1
            ? 6
            : 3;


    const normalizedPrice =
        Number(
            wall.price.toFixed(
                precision
            )
        );


    const key =
        `${wall.symbol}_${wall.side}_${normalizedPrice}`;


    if (
        !wallHistory.has(
            key
        )
    ) {

        wallHistory.set(
            key,
            {

                firstSeen:
                    now(),

                lastSeen:
                    now(),

                lastValue:
                    wall.value,

                lastDistance:
                    wall.distance

            }
        );

    } else {

        const item =
            wallHistory.get(
                key
            );


        item.lastSeen =
            now();


        item.lastValue =
            wall.value;


        item.lastDistance =
            wall.distance;

    }


    return {

        key,

        ...wallHistory.get(
            key
        )

    };

}


/* =====================================================
   CALCULATE SCORE
===================================================== */

function calculateScore(
    wall,
    flow,
    priceChange,
    age
) {

    let score = 0;


    /*
     * SIZE
     *
     * До 20.
     */

    const sizeBase =
        wall.settings.minWall;


    const sizeMultiple =
        wall.value /
        Math.max(
            sizeBase,
            1
        );


    const sizeScore =
        Math.min(
            20,
            Math.max(
                0,
                Math.log2(
                    Math.max(
                        sizeMultiple,
                        1
                    )
                ) * 7
            )
        );


    score +=
        sizeScore;


    /*
     * RELATIVE WALL
     *
     * До 25.
     */

    const ratioBase =
        wall.settings.minRatio;


    const ratioExcess =
        wall.ratio /
        Math.max(
            ratioBase,
            1
        );


    const ratioScore =
        Math.min(
            25,
            ratioExcess * 8
        );


    score +=
        ratioScore;


    /*
     * AGE
     *
     * До 15.
     */

    const ageScore =
        Math.min(
            15,
            age / 1000
        );


    score +=
        ageScore;


    /*
     * FLOW
     *
     * До 25.
     */

    let alignedFlow = 0;


    if (
        wall.side === "Buy"
    ) {

        alignedFlow =
            Math.max(
                0,
                flow.imbalance
            );

    } else {

        alignedFlow =
            Math.max(
                0,
                -flow.imbalance
            );

    }


    score +=
        alignedFlow * 25;


    /*
     * PRICE
     *
     * До 15.
     */

    let alignedPrice = 0;


    if (
        wall.side === "Buy"
    ) {

        alignedPrice =
            Math.max(
                0,
                priceChange
            );

    } else {

        alignedPrice =
            Math.max(
                0,
                -priceChange
            );

    }


    score +=
        Math.min(
            15,
            alignedPrice *
            700
        );


    return Math.min(
        100,
        Math.round(
            score
        )
    );

}


/* =====================================================
   DETERMINE SETUP
===================================================== */

function determineSetup(
    wall,
    flow,
    priceChange
) {

    /*
     * BUY WALL
     */

    if (
        wall.side ===
        "Buy"
    ) {

        /*
         * BUY wall +
         * aggressive buyers.
         */

        if (
            flow.imbalance >=
            0.12
        ) {

            return "LONG";

        }


        /*
         * BUY wall +
         * сильное давление продавцов.
         */

        if (
            flow.imbalance <=
                -0.22 &&
            priceChange < 0
        ) {

            return "SHORT";

        }

    }


    /*
     * SELL WALL
     */

    if (
        wall.side ===
        "Sell"
    ) {

        /*
         * SELL wall +
         * aggressive sellers.
         */

        if (
            flow.imbalance <=
            -0.12
        ) {

            return "SHORT";

        }


        /*
         * SELL wall +
         * покупатели съедают стену.
         */

        if (
            flow.imbalance >=
                0.22 &&
            priceChange > 0
        ) {

            return "LONG";

        }

    }


    return null;

}


/* =====================================================
   ENTRY / TP / SL
===================================================== */


/*
 * Рассчитываем торговый план.
 *
 * LONG:
 *
 * Entry = BUY wall
 *
 * SL = ниже стены
 *
 * TP = Entry + risk * RR
 *
 *
 * SHORT:
 *
 * Entry = SELL wall
 *
 * SL = выше стены
 *
 * TP = Entry - risk * RR
 */

function calculateTradePlan(
    wall,
    setup,
    priceChange
) {

    const entry =
        wall.price;


    /*
     * Базовый stop buffer
     * зависит от группы монеты.
     */

    let stopBuffer =
        wall.settings.stopBuffer;


    /*
     * Если монета сейчас
     * сильно двигается,
     * немного расширяем SL.
     */

    const movement =
        Math.abs(
            priceChange
        );


    if (
        movement >
        stopBuffer * 0.7
    ) {

        stopBuffer =
            Math.max(
                stopBuffer,
                movement * 0.65
            );

    }


    /*
     * Ограничиваем слишком
     * огромный stop.
     */

    stopBuffer =
        Math.min(
            stopBuffer,
            0.012
        );


    let stop;

    let takeProfit;


    if (
        setup ===
        "LONG"
    ) {

        stop =
            entry *
            (
                1 -
                stopBuffer
            );


        const risk =
            entry -
            stop;


        takeProfit =
            entry +
            (
                risk *
                TAKE_PROFIT_RR
            );

    }


    else {

        stop =
            entry *
            (
                1 +
                stopBuffer
            );


        const risk =
            stop -
            entry;


        takeProfit =
            entry -
            (
                risk *
                TAKE_PROFIT_RR
            );

    }


    /*
     * Проверка.
     */

    if (
        !Number.isFinite(
            entry
        ) ||
        !Number.isFinite(
            stop
        ) ||
        !Number.isFinite(
            takeProfit
        )
    ) {

        return null;

    }


    const riskPercent =
        Math.abs(
            entry -
            stop
        ) /
        entry;


    return {

        entry,

        stop,

        takeProfit,

        riskPercent,

        rr:
            TAKE_PROFIT_RR

    };

}


/* =====================================================
   ANALYZE SYMBOL
===================================================== */

function analyzeSymbol(
    symbol
) {

    const book =
        books.get(
            symbol
        );


    if (!book)
        return;


    /*
     * Не анализируем
     * полностью пустой стакан.
     */

    if (
        !book.bids.size ||
        !book.asks.size
    )
        return;


    const wallsFound =
        findWalls(
            symbol
        );


    if (
        !wallsFound.length
    )
        return;


    const flow =
        getTradeFlow(
            symbol
        );


    const priceChange =
        getPriceChange(
            symbol
        );


    for (
        const wall
        of wallsFound
    ) {

        const history =
            updateWallHistory(
                wall
            );


        const age =
            now() -
            history.firstSeen;


        /*
         * Минимальный возраст
         * стены.
         */

        const requiredAge =
            parseInt(
                document
                    .getElementById(
                        "wallAge"
                    )
                    .value
            ) * 1000;


        if (
            age <
            requiredAge
        )
            continue;


        const setup =
            determineSetup(
                wall,
                flow,
                priceChange
            );


        if (!setup)
            continue;


        const score =
            calculateScore(
                wall,
                flow,
                priceChange,
                age
            );


        const minScore =
            parseInt(
                document
                    .getElementById(
                        "minScore"
                    )
                    .value
            );


        if (
            score <
            minScore
        )
            continue;


        const tradePlan =
            calculateTradePlan(
                wall,
                setup,
                priceChange
            );


        if (!tradePlan)
            continue;


        const key =
            `${symbol}_${wall.side}_${history.key}`;


        signals.set(
            key,
            {

                key,

                symbol,

                rank:
                    symbolRanks.get(
                        symbol
                    ),

                setup,

                score,

                wall,

                flow,

                priceChange,

                age,

                tradePlan,

                updated:
                    now()

            }
        );

    }

}


/* =====================================================
   ANALYZE ALL
===================================================== */

function analyzeAll() {

    if (!running)
        return;


    for (
        const symbol
        of symbols
    ) {

        analyzeSymbol(
            symbol
        );

    }


    /*
     * Удаляем старые сигналы.
     */

    const expiry =
        now() -
        4000;


    for (
        const [
            key,
            signal
        ]
        of signals
    ) {

        /*
         * Если сигнал старый.
         */

        if (
            signal.updated <
            expiry
        ) {

            signals.delete(
                key
            );

            continue;

        }


        /*
         * Если сама стена
         * давно не обновлялась —
         * сигнал больше не актуален.
         */

        if (
            signal.wall &&
            now() -
            signal.wall.currentPrice >
            999999999
        ) {

            signals.delete(
                key
            );

        }

    }

}

/* =====================================================
   CLOSE ALL SOCKETS
===================================================== */

function closeAllSockets() {

    for (
        const socket
        of sockets
    ) {

        try {

            socket.close();

        } catch (e) {}

    }


    sockets = [];

}


/* =====================================================
   CONNECT ONE SOCKET
===================================================== */

function connectSocket(
    symbolChunk,
    index
) {

    if (!running)
        return;


    const socket =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    sockets[index] =
        socket;


    socket.onopen = () => {

        /*
         * Подписываем только
         * свой chunk.
         */

        const args = [];


        for (
            const symbol
            of symbolChunk
        ) {

            args.push(
                `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );


            args.push(
                `publicTrade.${symbol}`
            );

        }


        socket.send(
            JSON.stringify({

                op:
                    "subscribe",

                args:
                    args

            })
        );


        updateWSStatus();

    };


    socket.onmessage =
        event => {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                /*
                 * Pong.
                 */

                if (
                    data.op ===
                    "pong"
                ) {

                    return;

                }


                /*
                 * Subscribe response.
                 */

                if (
                    data.op ===
                    "subscribe"
                ) {

                    return;

                }


                if (
                    !data.topic
                )
                    return;


                /*
                 * ORDERBOOK
                 */

                if (
                    data.topic
                        .startsWith(
                            "orderbook."
                        )
                ) {

                    const parts =
                        data.topic
                            .split(
                                "."
                            );


                    const symbol =
                        parts[2];


                    if (
                        data.type ===
                        "snapshot"
                    ) {

                        applySnapshot(
                            symbol,
                            data.data
                        );

                    }


                    else if (
                        data.type ===
                        "delta"
                    ) {

                        applyDelta(
                            symbol,
                            data.data
                        );

                    }


                    return;

                }


                /*
                 * TRADES
                 */

                if (
                    data.topic
                        .startsWith(
                            "publicTrade."
                        )
                ) {

                    processTrade(
                        data.data
                    );

                }

            }


            catch (error) {

                console.error(
                    "WS message error:",
                    error
                );

            }

        };


    socket.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );

        };


    socket.onclose =
        () => {

            /*
             * Если scanner работает,
             * переподключаем весь набор.
             */

            if (
                running
            ) {

                updateWSStatus();


                scheduleReconnect();

            }

        };

}


/* =====================================================
   CONNECT ALL
===================================================== */

function connectAllSockets() {

    if (!running)
        return;


    closeAllSockets();


    /*
     * Делим TOP-100
     * на два соединения.
     */

    const chunks = [];


    for (
        let i = 0;

        i < symbols.length;

        i += WS_CHUNK_SIZE
    ) {

        chunks.push(
            symbols.slice(
                i,
                i +
                WS_CHUNK_SIZE
            )
        );

    }


    for (
        let i = 0;

        i < chunks.length;

        i++
    ) {

        /*
         * Небольшая задержка
         * между подключениями.
         */

        setTimeout(
            () => {

                if (
                    running
                ) {

                    connectSocket(
                        chunks[i],
                        i
                    );

                }

            },
            i * 500
        );

    }

}


/* =====================================================
   WS STATUS
===================================================== */

function updateWSStatus() {

    if (!running) {

        wsEl.innerText =
            "OFF";

        wsEl.className =
            "stat-value";

        return;

    }


    const opened =
        sockets.filter(
            socket =>
                socket &&
                socket.readyState ===
                WebSocket.OPEN
        ).length;


    const total =
        sockets.length;


    if (
        opened ===
        total &&
        total > 0
    ) {

        wsEl.innerText =
            `${opened}/${total}`;

        wsEl.className =
            "stat-value green";


        statusEl.innerText =
            "Сканирование активно";

        statusEl.style.color =
            "#27ae60";

    }


    else if (
        opened > 0
    ) {

        wsEl.innerText =
            `${opened}/${total}`;

        wsEl.className =
            "stat-value orange";


        statusEl.innerText =
            "Частичное подключение";

        statusEl.style.color =
            "#f7931a";

    }


    else {

        wsEl.innerText =
            "CONNECT";

        wsEl.className =
            "stat-value orange";

    }

}


/* =====================================================
   RECONNECT
===================================================== */

function scheduleReconnect() {

    if (
        reconnecting ||
        !running
    )
        return;


    reconnecting =
        true;


    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );

    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnecting =
                    false;


                if (
                    running
                ) {

                    statusEl.innerText =
                        "Переподключение...";

                    statusEl.style.color =
                        "#f7931a";


                    connectAllSockets();

                }

            },
            3000
        );

}


/* =====================================================
   PING
===================================================== */

function startPing() {

    if (
        pingTimer
    ) {

        clearInterval(
            pingTimer
        );

    }


    pingTimer =
        setInterval(
            () => {

                if (!running)
                    return;


                for (
                    const socket
                    of sockets
                ) {

                    if (
                        socket &&
                        socket.readyState ===
                        WebSocket.OPEN
                    ) {

                        try {

                            socket.send(
                                JSON.stringify({

                                    op:
                                        "ping"

                                })
                            );

                        }

                        catch (error) {

                            console.error(
                                "Ping error:",
                                error
                            );

                        }

                    }

                }

            },
            PING_INTERVAL
        );

}

   LOAD TOP 100
===================================================== */

async function loadSymbols() {

    try {

        statusEl.innerText =
            "Загрузка TOP-100...";

        statusEl.style.color =
            "#f7931a";


        const response =
            await fetch(

                "https://api.bybit.com/v5/market/tickers?category=linear",

                {

                    cache:
                        "no-store"

                }

            );


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Invalid Bybit response"
            );

        }


        const list =
            json.result.list

                .filter(
                    item =>
                        item.symbol &&
                        item.symbol
                            .endsWith(
                                "USDT"
                            ) &&

                        parseFloat(
                            item.turnover24h
                        ) > 0
                )

                .sort(
                    (a, b) =>
                        parseFloat(
                            b.turnover24h
                        ) -
                        parseFloat(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length =
            0;


        symbolRanks.clear();


        list.forEach(
            (
                item,
                index
            ) => {

                symbols.push(
                    item.symbol
                );


                symbolRanks.set(
                    item.symbol,
                    index + 1
                );

            }
        );


        coinCountEl.innerText =
            symbols.length;


        return true;

    }


    catch (error) {

        console.error(
            "TOP loading error:",
            error
        );


        statusEl.innerText =
            "Ошибка загрузки TOP";

        statusEl.style.color =
            "#e74c3c";


        return false;

    }

}


/* =====================================================
   START
===================================================== */

async function startScanner() {

    if (
        running
    )
        return;


    running =
        true;


    /*
     * Очищаем старые таймеры.
     */

    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;

    }


    if (
        analysisTimer
    ) {

        clearInterval(
            analysisTimer
        );

    }


    if (
        uiTimer
    ) {

        clearInterval(
            uiTimer
        );

    }


    if (
        symbolRefreshTimer
    ) {

        clearInterval(
            symbolRefreshTimer
        );

    }


    /*
     * Загружаем TOP.
     */

    const success =
        await loadSymbols();


    if (!success) {

        running =
            false;

        return;

    }


    /*
     * Чистим состояние.
     */

    books.clear();

    trades.clear();

    signals.clear();

    wallHistory.clear();


    /*
     * Запускаем heartbeat.
     */

    startPing();


    /*
     * Подключаем WS.
     */

    connectAllSockets();


    /*
     * Анализ.
     */

    analysisTimer =
        setInterval(
            analyzeAll,
            ANALYSIS_INTERVAL
        );


    /*
     * UI.
     */

    uiTimer =
        setInterval(
            renderSignals,
            UI_INTERVAL
        );


    /*
     * Обновляем TOP
     * каждые 5 минут.
     */

    symbolRefreshTimer =
        setInterval(
            async () => {

                if (!running)
                    return;


                const success =
                    await loadSymbols();


                if (!success)
                    return;


                /*
                 * Пересобираем
                 * подписки.
                 */

                books.clear();

                trades.clear();

                signals.clear();

                wallHistory.clear();


                connectAllSockets();

            },
            SYMBOL_REFRESH
        );


    statusEl.innerText =
        "Подключение к Bybit...";

    statusEl.style.color =
        "#f7931a";

}


/* =====================================================
   STOP
===================================================== */

function stopScanner() {

    running =
        false;


    reconnecting =
        false;


    if (
        analysisTimer
    ) {

        clearInterval(
            analysisTimer
        );

        analysisTimer =
            null;

    }


    if (
        uiTimer
    ) {

        clearInterval(
            uiTimer
        );

        uiTimer =
            null;

    }


    if (
        symbolRefreshTimer
    ) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer =
            null;

    }


    if (
        reconnectTimer
    ) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;

    }


    closeAllSockets();


    wsEl.innerText =
        "OFF";

    wsEl.className =
        "stat-value";


    statusEl.innerText =
        "Остановлен";

    statusEl.style.color =
        "#848e9c";


    renderSignals();

}


/* =====================================================
   CLEAR
===================================================== */

function clearSignals() {

    signals.clear();

    renderSignals();

}


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        /*
         * Если вкладка снова стала
         * активной и соединение
         * потерялось — восстанавливаем.
         */

        if (
            !document.hidden &&
            running
        ) {

            const opened =
                sockets.filter(
                    socket =>
                        socket &&
                        socket.readyState ===
                        WebSocket.OPEN
                ).length;


            if (
                opened === 0
            ) {

                scheduleReconnect();

            }

        }

    }
);
