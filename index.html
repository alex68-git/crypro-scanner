<script>

/* =========================================================
   ОСНОВНЫЕ НАСТРОЙКИ
========================================================= */

const MAX_SYMBOLS = 100;

const ORDERBOOK_DEPTH = 50;


/*
 * На экране максимум 10 сигналов.
 */
const MAX_SIGNALS = 10;


/*
 * Экран обновляется только раз в секунду.
 */
const DISPLAY_INTERVAL = 1000;


/*
 * TOP-100 пересчитываем каждые 5 минут.
 */
const SYMBOL_REFRESH_TIME =
    5 * 60 * 1000;


/*
 * Сколько времени заявка должна прожить
 * для первичного подтверждения.
 */
const DEFAULT_STABILITY = 5;


/*
 * После исчезновения стены
 * сигнал некоторое время остаётся,
 * чтобы не было мгновенного прыжка.
 */
const SIGNAL_KEEP_TIME =
    8 * 1000;


/*
 * Повтор одного и того же сигнала.
 */
const SIGNAL_COOLDOWN =
    30 * 1000;


/*
 * Минимальная цена для подтверждения.
 *
 * BUY:
 * цена должна подняться минимум
 * на 0.15% от момента появления стены.
 *
 * SELL:
 * цена должна упасть минимум
 * на 0.15%.
 */
const PRICE_CONFIRMATION = 0.15;


/*
 * Минимальный Score.
 */
const DEFAULT_MIN_SCORE = 70;


/*
 * Насколько заявка может уменьшиться,
 * не потеряв статус устойчивой.
 *
 * Например 0.60 = допускаем падение
 * размера до 60% от первоначального.
 */
const MIN_WALL_RATIO = 0.60;


/*
 * Пороговая структура.
 */
const THRESHOLDS = {

    top5: 500000,

    top20: 300000,

    top50: 180000,

    top100: 100000

};


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let ws = null;

let isRunning = false;

let displayPaused = false;

let reconnectTimer = null;

let symbolRefreshTimer = null;

let heartbeatTimer = null;

let displayTimer = null;


/*
 * TOP-100.
 */
const symbols = [];


/*
 * Ранги.
 */
const symbolRanks = new Map();


/*
 * Стаканы.
 */
const orderBooks = new Map();


/*
 * Кандидаты крупных стен.
 */
const candidates = new Map();


/*
 * Готовые сигналы.
 *
 * key -> signal
 */
const signals = new Map();


/*
 * Последнее время сигнала.
 */
const signalCooldowns = new Map();


/*
 * Последние цены.
 *
 * symbol ->
 * {
 *   price,
 *   time
 * }
 */
const priceHistory = new Map();


/*
 * Активность рынка.
 *
 * symbol ->
 * {
 *   current,
 *   previous,
 *   time
 * }
 */
const marketActivity = new Map();


/* =========================================================
   DOM
========================================================= */

const statusDiv =
    document.getElementById("status");

const wsStatusDiv =
    document.getElementById("wsStatus");

const coinCountDiv =
    document.getElementById("coinCount");

const candidateCountDiv =
    document.getElementById("candidateCount");

const entryCountDiv =
    document.getElementById("entryCount");

const signalsDiv =
    document.getElementById("signals");

const stabilitySelect =
    document.getElementById("stabilitySelect");

const scoreSelect =
    document.getElementById("scoreSelect");


/* =========================================================
   НАСТРОЙКИ
========================================================= */

function getStabilityTime() {

    return (
        parseInt(
            stabilitySelect.value
        ) ||
        DEFAULT_STABILITY
    );

}


function getMinScore() {

    return (
        parseInt(
            scoreSelect.value
        ) ||
        DEFAULT_MIN_SCORE
    );

}


/* =========================================================
   ПОРОГ
========================================================= */

function getThreshold(symbol) {

    const rank =
        symbolRanks.get(symbol);

    if (!rank) {

        return THRESHOLDS.top100;

    }

    if (rank <= 5) {

        return THRESHOLDS.top5;

    }

    if (rank <= 20) {

        return THRESHOLDS.top20;

    }

    if (rank <= 50) {

        return THRESHOLDS.top50;

    }

    return THRESHOLDS.top100;

}


/* =========================================================
   ФОРМАТИРОВАНИЕ
========================================================= */

function formatMoney(value) {

    if (!isFinite(value)) {
        return "0";
    }

    return Number(value).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 0
        }
    );

}


function formatPrice(value) {

    if (!isFinite(value)) {
        return "-";
    }

    if (value >= 1000) {

        return value.toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

    }

    if (value >= 1) {

        return value.toFixed(4);

    }

    if (value >= 0.01) {

        return value.toFixed(5);

    }

    return value.toPrecision(6);

}


function formatPercent(value) {

    if (!isFinite(value)) {
        return "0.00%";
    }

    const sign =
        value >= 0
            ? "+"
            : "";

    return (
        sign +
        value.toFixed(2) +
        "%"
    );

}


function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0.0 сек";
    }

    return seconds.toFixed(1) + " сек";

}


function formatThreshold(value) {

    if (value >= 1000000) {

        return (
            "$" +
            (value / 1000000).toFixed(1) +
            "M"
        );

    }

    return (
        "$" +
        (value / 1000).toFixed(0) +
        "K"
    );

}


/* =========================================================
   SCORE
========================================================= */

/*
 * Размер стены:
 *
 * максимум 25 баллов.
 */
function scoreWallSize(
    value,
    threshold
) {

    const ratio =
        value / threshold;

    if (ratio >= 3) {
        return 25;
    }

    if (ratio >= 2) {
        return 22;
    }

    if (ratio >= 1.5) {
        return 18;
    }

    if (ratio >= 1.2) {
        return 14;
    }

    return 8;

}


/*
 * Устойчивость:
 *
 * максимум 20.
 */
function scoreStability(
    aliveSeconds
) {

    if (aliveSeconds >= 20) {
        return 20;
    }

    if (aliveSeconds >= 15) {
        return 18;
    }

    if (aliveSeconds >= 10) {
        return 15;
    }

    if (aliveSeconds >= 7) {
        return 12;
    }

    if (aliveSeconds >= 5) {
        return 9;
    }

    return 0;

}


/*
 * Движение цены:
 *
 * максимум 30.
 */
function scorePriceMove(
    side,
    priceMove
) {

    let favorable = 0;

    if (side === "Buy") {

        favorable =
            priceMove;

    } else {

        favorable =
            -priceMove;

    }

    if (favorable >= 0.80) {
        return 30;
    }

    if (favorable >= 0.50) {
        return 26;
    }

    if (favorable >= 0.35) {
        return 22;
    }

    if (favorable >= 0.25) {
        return 18;
    }

    if (favorable >= 0.15) {
        return 14;
    }

    if (favorable >= 0.05) {
        return 7;
    }

    return 0;

}


/*
 * Активность:
 *
 * максимум 15.
 */
function scoreActivity(
    activityPercent
) {

    if (activityPercent >= 100) {
        return 15;
    }

    if (activityPercent >= 70) {
        return 13;
    }

    if (activityPercent >= 50) {
        return 11;
    }

    if (activityPercent >= 30) {
        return 8;
    }

    if (activityPercent >= 15) {
        return 5;
    }

    return 0;

}


/*
 * Дополнительные 10 баллов
 * за устойчивость размера стены.
 */
function scoreWallIntegrity(
    ratio
) {

    if (ratio >= 0.95) {
        return 10;
    }

    if (ratio >= 0.85) {
        return 8;
    }

    if (ratio >= 0.75) {
        return 6;
    }

    if (ratio >= 0.60) {
        return 3;
    }

    return 0;

}


/* =========================================================
   ЦЕНА
========================================================= */

function getCurrentPrice(
    symbol
) {

    const book =
        orderBooks.get(symbol);

    if (!book) {
        return null;
    }


    let bestBid = null;

    let bestAsk = null;


    for (
        const price of book.bids.keys()
    ) {

        const p =
            parseFloat(price);

        if (
            bestBid === null ||
            p > bestBid
        ) {

            bestBid = p;

        }

    }


    for (
        const price of book.asks.keys()
    ) {

        const p =
            parseFloat(price);

        if (
            bestAsk === null ||
            p < bestAsk
        ) {

            bestAsk = p;

        }

    }


    if (
        bestBid !== null &&
        bestAsk !== null
    ) {

        return (
            bestBid +
            bestAsk
        ) / 2;

    }


    return (
        bestBid ||
        bestAsk ||
        null
    );

}


/* =========================================================
   ИСТОРИЯ ЦЕНЫ
========================================================= */

function updatePriceHistory(
    symbol,
    price
) {

    if (
        !isFinite(price) ||
        price <= 0
    ) {

        return;

    }


    if (
        !priceHistory.has(symbol)
    ) {

        priceHistory.set(
            symbol,
            []
        );

    }


    const history =
        priceHistory.get(symbol);

    const now =
        Date.now();


    history.push({
        price: price,
        time: now
    });


    /*
     * Храним 90 секунд.
     */
    const cutoff =
        now - 90000;


    while (
        history.length &&
        history[0].time < cutoff
    ) {

        history.shift();

    }

}


/*
 * Цена в момент появления стены.
 */
function getPriceAtTime(
    symbol,
    time
) {

    const history =
        priceHistory.get(symbol);

    if (
        !history ||
        !history.length
    ) {

        return null;

    }


    let closest =
        history[0];


    for (
        const item of history
    ) {

        if (
            item.time <= time
        ) {

            closest = item;

        } else {

            break;

        }

    }


    return closest.price;

}


/* =========================================================
   АКТИВНОСТЬ
========================================================= */

function updateMarketActivity(
    symbol
) {

    /*
     * Мы используем количество
     * изменений стакана как индикатор
     * активности.
     *
     * Это НЕ объём в USDT.
     *
     * Но это хороший фильтр:
     * крупная стена + ускорение рынка.
     */

    if (
        !marketActivity.has(symbol)
    ) {

        marketActivity.set(
            symbol,
            {
                current: 0,
                previous: 0,
                time: Date.now()
            }
        );

    }


    const activity =
        marketActivity.get(symbol);

    activity.current++;

}


/*
 * Раз в 5 секунд пересчитываем
 * скорость изменений.
 */
setInterval(
    () => {

        const now =
            Date.now();


        marketActivity.forEach(
            activity => {

                activity.previous =
                    activity.current;

                activity.current = 0;

                activity.time =
                    now;

            }
        );

    },
    5000
);


/*
 * Получить условный рост активности.
 */
function getActivityPercent(
    symbol
) {

    const activity =
        marketActivity.get(symbol);

    if (!activity) {
        return 0;
    }


    /*
     * Используем текущее число
     * изменений за последние 5 сек.
     *
     * Базовый уровень — 10.
     */
    return Math.min(
        200,
        (
            activity.previous /
            10
        ) * 100
    );

}


/* =========================================================
   СОЗДАНИЕ СТАКАНА
========================================================= */

function createOrderBook(
    symbol
) {

    orderBooks.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map()
        }
    );

}


/* =========================================================
   SNAPSHOT
========================================================= */

function applySnapshot(
    symbol,
    data
) {

    createOrderBook(symbol);

    const book =
        orderBooks.get(symbol);


    if (
        Array.isArray(data.b)
    ) {

        data.b.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(order[1]);


                if (
                    qty > 0
                ) {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    if (
        Array.isArray(data.a)
    ) {

        data.a.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(order[1]);


                if (
                    qty > 0
                ) {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );

    }


    /*
     * После snapshot ищем крупные стены.
     */
    scanChangedLevels(
        symbol,
        data.b,
        "Buy"
    );

    scanChangedLevels(
        symbol,
        data.a,
        "Sell"
    );

}


/* =========================================================
   DELTA
========================================================= */

function applyDelta(
    symbol,
    data
) {

    if (
        !orderBooks.has(symbol)
    ) {

        return;

    }


    const book =
        orderBooks.get(symbol);


    /*
     * ВАЖНО:
     *
     * Мы больше НЕ перебираем
     * весь стакан после каждого delta.
     *
     * Проверяем только изменившиеся
     * уровни.
     */


    if (
        Array.isArray(data.b)
    ) {

        data.b.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(order[1]);


                if (qty === 0) {

                    book.bids.delete(
                        price
                    );

                } else {

                    book.bids.set(
                        price,
                        qty
                    );

                }

            }
        );


        scanChangedLevels(
            symbol,
            data.b,
            "Buy"
        );

    }


    if (
        Array.isArray(data.a)
    ) {

        data.a.forEach(
            order => {

                const price =
                    String(order[0]);

                const qty =
                    parseFloat(order[1]);


                if (qty === 0) {

                    book.asks.delete(
                        price
                    );

                } else {

                    book.asks.set(
                        price,
                        qty
                    );

                }

            }
        );


        scanChangedLevels(
            symbol,
            data.a,
            "Sell"
        );

    }

}


/* =========================================================
   СКАНИРОВАНИЕ ИЗМЕНЁННЫХ УРОВНЕЙ
========================================================= */

function scanChangedLevels(
    symbol,
    levels,
    side
) {

    if (
        !Array.isArray(levels)
    ) {

        return;

    }


    const threshold =
        getThreshold(symbol);


    const now =
        Date.now();


    for (
        const order of levels
    ) {

        const price =
            parseFloat(order[0]);

        const qty =
            parseFloat(order[1]);


        if (
            !isFinite(price) ||
            !isFinite(qty) ||
            price <= 0
        ) {

            continue;

        }


        const value =
            price * qty;


        const key =
            `${symbol}_${side}_${price}`;


        /*
         * Если заявка исчезла —
         * помечаем кандидата как исчезнувший.
         */
        if (
            qty <= 0 ||
            value < threshold
        ) {

            const candidate =
                candidates.get(key);

            if (candidate) {

                candidate.lastSeen =
                    now;

                candidate.lastValue =
                    0;

            }

            continue;

        }


        /*
         * Новая крупная заявка.
         */
        if (
            !candidates.has(key)
        ) {

            const currentPrice =
                getCurrentPrice(symbol);


            candidates.set(
                key,
                {

                    key,

                    symbol,

                    side,

                    price,

                    initialValue: value,

                    lastValue: value,

                    firstSeen: now,

                    lastSeen: now,

                    initialPrice:
                        currentPrice,

                    peakValue: value

                }
            );


            continue;

        }


        const candidate =
            candidates.get(key);


        /*
         * Обновляем.
         */
        candidate.lastSeen =
            now;

        candidate.lastValue =
            value;


        if (
            value >
            candidate.peakValue
        ) {

            candidate.peakValue =
                value;

        }

    }

}


/* =========================================================
   УДАЛЕНИЕ СТАРЫХ КАНДИДАТОВ
========================================================= */

function cleanupCandidates() {

    const now =
        Date.now();


    candidates.forEach(
        (
            candidate,
            key
        ) => {

            /*
             * Если уровень не обновлялся
             * более 3 секунд — считаем,
             * что стена исчезла.
             */
            if (
                now -
                candidate.lastSeen >
                3000
            ) {

                candidates.delete(key);

            }

        }
    );

}


/* =========================================================
   АНАЛИЗ КАНДИДАТОВ
========================================================= */

function evaluateCandidates() {

    const now =
        Date.now();


    cleanupCandidates();


    candidates.forEach(
        candidate => {

            evaluateCandidate(
                candidate,
                now
            );

        }
    );


    /*
     * Обновляем список сигналов.
     */
    cleanupSignals(now);

}


/* =========================================================
   ОЦЕНКА ОДНОЙ СТЕНЫ
========================================================= */

function evaluateCandidate(
    candidate,
    now
) {

    const symbol =
        candidate.symbol;

    const side =
        candidate.side;


    const threshold =
        getThreshold(symbol);


    const aliveSeconds =
        (
            now -
            candidate.firstSeen
        ) / 1000;


    /*
     * Стена должна прожить
     * минимум заданное время.
     */
    if (
        aliveSeconds <
        getStabilityTime()
    ) {

        return;

    }


    const currentPrice =
        getCurrentPrice(symbol);


    if (
        !currentPrice ||
        !candidate.initialPrice
    ) {

        return;

    }


    const priceMove =
        (
            (
                currentPrice -
                candidate.initialPrice
            ) /
            candidate.initialPrice
        ) *
        100;


    const wallRatio =
        candidate.lastValue /
        candidate.initialValue;


    /*
     * Если стена сильно уменьшилась —
     * не считаем её надёжной.
     */
    if (
        wallRatio <
        MIN_WALL_RATIO
    ) {

        return;

    }


    const activity =
        getActivityPercent(symbol);


    /*
     * Считаем компоненты Score.
     */
    const wallScore =
        scoreWallSize(
            candidate.lastValue,
            threshold
        );


    const stabilityScore =
        scoreStability(
            aliveSeconds
        );


    const priceScore =
        scorePriceMove(
            side,
            priceMove
        );


    const activityScore =
        scoreActivity(
            activity
        );


    const integrityScore =
        scoreWallIntegrity(
            wallRatio
        );


    let score =
        wallScore +
        stabilityScore +
        priceScore +
        activityScore +
        integrityScore;


    score =
        Math.min(
            100,
            Math.round(score)
        );


    /*
     * Цена должна подтвердить направление.
     */
    const favorableMove =
        side === "Buy"
            ? priceMove
            : -priceMove;


    /*
     * Определяем состояние.
     */
    let state =
        "WATCH";


    if (
        score >= 60 &&
        favorableMove >= 0.05
    ) {

        state =
            "SETUP";

    }


    if (
        score >= getMinScore() &&
        favorableMove >=
        PRICE_CONFIRMATION &&
        aliveSeconds >=
        getStabilityTime()
    ) {

        state =
            "ENTRY";

    }


    /*
     * Если цена идёт против стены —
     * сигнал не даём.
     */
    if (
        side === "Buy" &&
        priceMove < -0.10
    ) {

        return;

    }


    if (
        side === "Sell" &&
        priceMove > 0.10
    ) {

        return;

    }


    /*
     * Показываем только достаточно
     * сильные сигналы.
     */
    if (
        score <
        getMinScore()
    ) {

        return;

    }


    const key =
        candidate.key;


    const existing =
        signals.get(key);


    /*
     * Создаём / обновляем сигнал.
     */
    const signal = {

        key,

        symbol,

        side,

        price:
            candidate.price,

        value:
            candidate.lastValue,

        threshold,

        rank:
            symbolRanks.get(symbol),

        firstSeen:
            candidate.firstSeen,

        aliveSeconds,

        initialPrice:
            candidate.initialPrice,

        currentPrice,

        priceMove,

        favorableMove,

        wallRatio,

        activity,

        score,

        state,

        updatedAt:
            now

    };


    signals.set(
        key,
        signal
    );


    /*
     * Если получился ENTRY —
     * отправляем browser notification
     * только один раз за cooldown.
     */
    if (
        state === "ENTRY"
    ) {

        maybeNotify(
            signal
        );

    }

}


/* =========================================================
   УВЕДОМЛЕНИЯ
========================================================= */

async function requestNotifications() {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "default"
    ) {

        try {

            await Notification.requestPermission();

        } catch (e) {}

    }

}


function maybeNotify(
    signal
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission !==
        "granted"
    ) {

        return;

    }


    const now =
        Date.now();


    const last =
        signalCooldowns.get(
            signal.key
        ) || 0;


    if (
        now - last <
        SIGNAL_COOLDOWN
    ) {

        return;

    }


    signalCooldowns.set(
        signal.key,
        now
    );


    const direction =
        signal.side === "Buy"
            ? "🟢 LONG"
            : "🔴 SHORT";


    new Notification(
        `${direction} ${signal.symbol}`,
        {

            body:
                `ENTRY | Score ${signal.score}/100 | ` +
                `$${formatMoney(signal.value)} | ` +
                `Цена ${formatPercent(signal.priceMove)}`

        }
    );

}


/* =========================================================
   УДАЛЕНИЕ СТАРЫХ СИГНАЛОВ
========================================================= */

function cleanupSignals(now) {

    signals.forEach(
        (
            signal,
            key
        ) => {

            /*
             * Если кандидат исчез —
             * сохраняем сигнал ненадолго.
             */
            const candidate =
                candidates.get(key);


            if (!candidate) {

                if (
                    now -
                    signal.updatedAt >
                    SIGNAL_KEEP_TIME
                ) {

                    signals.delete(key);

                }

                return;

            }


            /*
             * Если Score сильно упал —
             * удаляем.
             */
            if (
                signal.score <
                getMinScore() - 10
            ) {

                signals.delete(key);

            }

        }
    );

}


/* =========================================================
   РАНЖИРОВАНИЕ
========================================================= */

function getBestSignals() {

    return Array.from(
        signals.values()
    )

    .sort(
        (a, b) => {

            /*
             * Сначала ENTRY.
             */
            if (
                a.state === "ENTRY" &&
                b.state !== "ENTRY"
            ) {

                return -1;

            }

            if (
                b.state === "ENTRY" &&
                a.state !== "ENTRY"
            ) {

                return 1;

            }


            /*
             * Затем Score.
             */
            if (
                b.score !==
                a.score
            ) {

                return (
                    b.score -
                    a.score
                );

            }


            /*
             * Затем устойчивость.
             */
            return (
                b.aliveSeconds -
                a.aliveSeconds
            );

        }
    )

    .slice(
        0,
        MAX_SIGNALS
    );

}


/* =========================================================
   ОТРИСОВКА
========================================================= */

function renderSignals() {

    if (
        displayPaused
    ) {

        return;

    }


    const best =
        getBestSignals();


    const currentKeys =
        new Set(
            best.map(
                signal =>
                    signal.key
            )
        );


    /*
     * Удаляем карточки,
     * которых больше нет в TOP-10.
     */
    Array.from(
        signalsDiv.querySelectorAll(
            ".signal"
        )
    ).forEach(
        element => {

            if (
                !currentKeys.has(
                    element.dataset.key
                )
            ) {

                element.remove();

            }

        }
    );


    /*
     * Пустой экран.
     */
    if (
        best.length === 0
    ) {

        if (
            !document.getElementById(
                "emptyMessage"
            )
        ) {

            signalsDiv.innerHTML = `

                <div
                    id="emptyMessage"
                    class="empty"
                >

                    🔎 Ищем подтверждённые
                    сетапы...<br><br>

                    Быстрые стены
                    отфильтровываются.

                </div>

            `;

        }

        return;

    }


    const empty =
        document.getElementById(
            "emptyMessage"
        );

    if (empty) {
        empty.remove();
    }


    /*
     * Обновляем / создаём карточки.
     *
     * ВАЖНО:
     * мы НЕ очищаем контейнер.
     *
     * Поэтому экран не прыгает.
     */
    best.forEach(
        (
            signal,
            index
        ) => {

            let card =
                signalsDiv.querySelector(
                    `[data-key="${CSS.escape(signal.key)}"]`
                );


            if (!card) {

                card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "signal";

                card.dataset.key =
                    signal.key;

                signalsDiv.appendChild(
                    card
                );

            }


            updateCard(
                card,
                signal,
                index
            );

        }
    );


    /*
     * Переставляем только если
     * действительно изменился рейтинг.
     *
     * Не создаём новые элементы.
     */
    best.forEach(
        signal => {

            const card =
                signalsDiv.querySelector(
                    `[data-key="${CSS.escape(signal.key)}"]`
                );

            if (card) {

                signalsDiv.appendChild(
                    card
                );

            }

        }
    );

}

========================================================= */

function startAnalysisLoop() {

    if (displayTimer) {

        clearInterval(
            displayTimer
        );

    }


    displayTimer =
        setInterval(
            () => {

                /*
                 * Цена и история.

                symbols.forEach(

                            getCurrentPrice(
                                symbol
                            );

                        if (price) {

                            );

                );

                 */
                evaluateCandidates();


                /*

                 * только раз в секунду.

                updateStats();

            },
            DISPLAY_INTERVAL
        );

        );

/* =========================================================
   TOP-100
========================================================= */

async function loadSymbols() {

    try {

        statusDiv.innerText =
            "Загрузка TOP-100...";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Некорректный ответ Bybit"
            );

        }


        const topCoins =
            json.result.list

                .filter(
                    coin =>
                        coin.symbol &&
                        coin.symbol.endsWith(
                            "USDT"
                        ) &&
                        parseFloat(
                            coin.turnover24h
                        ) > 0
                )

                .sort(
                    (a, b) =>
                        parseFloat(
                            b.turnover24h
                        ) -
                        parseFloat(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length = 0;

        symbolRanks.clear();


        topCoins.forEach(
            (
                coin,
                index
            ) => {

                symbols.push(
                    coin.symbol
                );

                symbolRanks.set(
                    coin.symbol,
                    index + 1
                );

            }
        );


        coinCountDiv.innerText =
            symbols.length;


        return true;


    } catch (error) {

        console.error(
            "TOP-100 error:",
            error
        );


        statusDiv.innerText =
            "Ошибка загрузки TOP-100";

        statusDiv.style.color =
            "#e74c3c";


        return false;

    }

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (!isRunning) {
        return;
    }


    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        console.log(
            "WebSocket connected"
        );


        wsStatusDiv.innerText =
            "ON";

        wsStatusDiv.className =
            "stat-value green";


        statusDiv.innerText =
            "Сканирование активно";

        statusDiv.style.color =
            "#27ae60";


        /*
         * Только стакан.
         *
         * Экран от него напрямую
         * НЕ обновляется.
         */
        const topics =
            symbols.map(
                symbol =>
                    `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );


        /*
         * Можно добавить ticker,
         * но для текущей архитектуры
         * mid-price берём из стакана.
         */
        ws.send(
            JSON.stringify({

                op: "subscribe",

                args: topics

            })
        );


        startHeartbeat();

    };


    ws.onmessage =
        handleWebSocketMessage;


    ws.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );


            wsStatusDiv.innerText =
                "ERROR";

            wsStatusDiv.className =
                "stat-value red";

        };


    ws.onclose = () => {

        stopHeartbeat();


        wsStatusDiv.innerText =
            "OFF";

        wsStatusDiv.className =
            "stat-value red";


        if (isRunning) {

            statusDiv.innerText =
                "Переподключение...";

            statusDiv.style.color =
                "#f7931a";


            scheduleReconnect();

        }

    };

}


/* =========================================================
   MESSAGE
========================================================= */

function handleWebSocketMessage(
    event
) {

    try {

        const data =
            JSON.parse(
                event.data
            );


        if (
            !data.topic ||
            !data.topic.startsWith(
                "orderbook."
            )
        ) {

            return;

        }


        const parts =
            data.topic.split(".");


        const symbol =
            parts[2];


        if (!symbol) {
            return;
        }


        /*
         * Каждое сообщение увеличивает
         * показатель активности.
         *
         * Но НИЧЕГО не рисуем.
         */
        updateMarketActivity(
            symbol
        );


        if (
            data.type ===
            "snapshot"
        ) {

            applySnapshot(
                symbol,
                data.data
            );

        }


        else if (
            data.type ===
            "delta"
        ) {

            applyDelta(
                symbol,
                data.data
            );

        }

    } catch (error) {

        console.error(
            "WS message error:",
            error
        );

    }

}


/* =========================================================
   HEARTBEAT
========================================================= */

function startHeartbeat() {

    stopHeartbeat();


    heartbeatTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


function stopHeartbeat() {

    if (heartbeatTimer) {

        clearInterval(
            heartbeatTimer
        );

        heartbeatTimer = null;

    }

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (!isRunning) {
        return;
    }


    if (reconnectTimer) {
        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            3000
        );

}

    orderBooks.clear();

    candidates.clear();

    priceHistory.clear();

    marketActivity.clear();


    connectWebSocket();

}


/* =========================================================
   ПАУЗА
========================================================= */

function togglePause() {

    displayPaused =
        !displayPaused;


    const button =
        document.querySelector(
            ".pause"
        );


    if (displayPaused) {

        button.innerText =
            "▶ Продолжить";


        statusDiv.innerText =
            "Сканирование идёт | экран на паузе";

    }

    else {

        button.innerText =
            "⏸ Пауза";


        statusDiv.innerText =
            "Сканирование активно";


        renderSignals();

    }

}


/* =========================================================
   ЗАПУСК
========================================================= */

async function startScan() {

    if (isRunning) {
        return;
    }


    isRunning =
        true;


    await requestNotifications();


    const success =
        await loadSymbols();


    if (!success) {

        isRunning =
            false;

        return;

    }


    startAnalysisLoop();

    connectWebSocket();


    symbolRefreshTimer =
        setInterval(
            refreshSymbols,
            SYMBOL_REFRESH_TIME
        );

}


/* =========================================================
   СТОП
========================================================= */

function stopScan() {

    isRunning =
        false;


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer =
            null;

    }


    if (symbolRefreshTimer) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer =
            null;

    }


    stopHeartbeat();

    stopAnalysisLoop();


    if (ws) {

        try {
            ws.close();
        } catch (e) {}

        ws = null;

    }


    orderBooks.clear();

    candidates.clear();

    priceHistory.clear();

    marketActivity.clear();

    signals.clear();


    candidateCountDiv.innerText =
        "0";

    entryCountDiv.innerText =
        "0";


    wsStatusDiv.innerText =
        "OFF";

    wsStatusDiv.className =
        "stat-value";


    statusDiv.innerText =
        "Остановлен";

    statusDiv.style.color =
        "#848e9c";


    renderSignals();

}


/* =========================================================
   ОЧИСТКА
========================================================= */

function clearSignals() {

    signals.clear();

    signalCooldowns.clear();


    signalsDiv.innerHTML = `

        <div
            id="emptyMessage"
            class="empty"
        >

            Список очищен.<br>

            Ждём новые
            подтверждённые сигналы.

        </div>

    `;


    entryCountDiv.innerText =
        "0";

}
