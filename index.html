<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bybit Swing Levels Scanner (15m-4h)</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    background: #0b0e11;
    color: #eaecef;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.header {
    background: #1e2329;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

h1 { font-size: 20px; margin: 0 0 15px 0; color: #f7931a; }

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    align-items: center;
}

button, select {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: bold;
    cursor: pointer;
}

button { background: #f7931a; color: #1e2329; }
button.stop { background: #e74c3c; color: white; }
button.clear { background: #555; color: white; }
button.pause { background: #3498db; color: white; }
button.pause.active { background: #e67e22; }

select { background: #2b3139; color: white; }
label { font-size: 13px; color: #848e9c; }

.status { color: #848e9c; font-size: 13px; margin-top: 8px; }

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.stat {
    background: #161a1e;
    border-radius: 8px;
    padding: 9px;
    text-align: center;
    font-size: 11px;
}

.stat-value {
    display: block;
    font-size: 15px;
    font-weight: bold;
    margin-top: 4px;
}

.section-title {
    color: #848e9c;
    font-size: 14px;
    margin: 15px 0 8px;
    display: flex;
    justify-content: space-between;
}

.signals { height: 68vh; min-height: 400px; overflow-y: auto; }

.signal {
    background: #1e2329;
    border-radius: 11px;
    padding: 15px;
    margin-bottom: 12px;
    border-left: 6px solid #555;
    position: relative;
}

.signal.long { border-left-color: #27ae60; }
.signal.short { border-left-color: #e74c3c; }

.signal-top { display: flex; justify-content: space-between; align-items: center; }
.symbol { font-size: 18px; font-weight: bold; }
.direction { font-weight: bold; font-size: 13px; padding: 4px 10px; border-radius: 4px; }
.direction.long { background: rgba(39, 174, 96, 0.2); color: #27ae60; }
.direction.short { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

.score { font-size: 22px; font-weight: bold; margin-top: 5px; color: #f1c40f; }

.data-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.data-box {
    background: #161a1e;
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 11px;
    color: #848e9c;
}

.data-box strong {
    display: block;
    color: #eaecef;
    font-size: 13px;
    margin-top: 3px;
}

.level-setup {
    margin-top: 12px;
    padding: 10px;
    border-radius: 7px;
    background: rgba(247, 147, 26, 0.08);
    border: 1px solid rgba(247, 147, 26, 0.3);
    font-size: 12px;
}

.level-setup-title { color: #f7931a; font-weight: bold; margin-bottom: 5px; }

.empty { text-align: center; color: #848e9c; padding: 60px 15px; }
.green { color: #27ae60; }
.red { color: #e74c3c; }
.gray { color: #848e9c; }

@media (max-width: 768px) {
    .data-grid { grid-template-columns: repeat(2, 1fr); }
    .stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>

<div class="header">
    <h1>📈 Bybit Swing Levels Scanner (15m–4h)</h1>

    <div class="controls">
        <button onclick="startScanner()">▶ Запустить</button>
        <button class="stop" onclick="stopScanner()">⏹ Стоп</button>
        <button id="pauseBtn" class="pause" onclick="togglePause()">⏸ Пауза UI</button>
        <button class="clear" onclick="clearSignals()">🗑 Очистить</button>
    </div>

    <div class="controls">
        <label>
            Выдержка уровня (TF):
            <select id="wallAge">
                <option value="120">2 минуты (Тест)</option>
                <option value="300" selected>5 минут (15m TF)</option>
                <option value="900">15 минут (1h-4h TF)</option>
                <option value="1800">30 минут (Major Level)</option>
            </select>
        </label>

        <label>
            Минимальный объём стены:
            <select id="volSens">
                <option value="0.0008">0.08% (Средние стены)</option>
                <option value="0.0015" selected>0.15% (Крупный уровень)</option>
                <option value="0.0030">0.30% (Монументальный)</option>
            </select>
        </label>

        <label>
            Дистанция до стены:
            <select id="maxDist">
                <option value="0.01">до 1.0%</option>
                <option value="0.02" selected>до 2.0% (Успеть на TF)</option>
                <option value="0.03">до 3.0%</option>
            </select>
        </label>

        <label>
            <input type="checkbox" id="soundToggle" checked> 🔔 Звук
        </label>
    </div>

    <div class="status">
        Статус: <span id="status">Остановлен</span>
    </div>

    <div class="stats">
        <div class="stat">TOP <span id="coinCount" class="stat-value">0</span></div>
        <div class="stat">WS <span id="wsStatus" class="stat-value">OFF</span></div>
        <div class="stat">Кандидатов <span id="candidateCount" class="stat-value">0</span></div>
        <div class="stat">Уровней <span id="signalCount" class="stat-value">0</span></div>
    </div>
</div>

<div class="section-title">
    <span>🏛 Подтвержденные среднесрочные уровни (Swing Setups)</span>
    <span id="pauseStatus" style="color: #f7931a; display: none;">[ОБНОВЛЕНИЕ UI НА ПАУЗЕ]</span>
</div>

<div id="signals" class="signals">
    <div id="empty" class="empty">
        Запустите сканер.<br><br>
        Ищем крупные плиты с выдержкой от 5 до 30 минут для торговли на 15m–4h.
    </div>
</div>

<script>
const MAX_SYMBOLS = 100;
const ORDERBOOK_DEPTH = 50;
const MAX_SIGNALS = 15;
const ANALYSIS_INTERVAL = 1000;
const UI_INTERVAL = 1500;
const SYMBOL_REFRESH = 5 * 60 * 1000;
const MIN_WALL_RATIO = 4;

let ws = null;
let running = false;
let uiPaused = false;

let reconnectTimer = null;
let symbolRefreshTimer = null;
let analysisTimer = null;
let uiTimer = null;

const symbols = [];
const symbolRanks = new Map();
const symbolTurnovers = new Map();
const books = new Map();
const trades = new Map();
const wallHistory = new Map();
const signals = new Map();

const statusEl = document.getElementById("status");
const wsEl = document.getElementById("wsStatus");
const coinCountEl = document.getElementById("coinCount");
const candidateCountEl = document.getElementById("candidateCount");
const signalCountEl = document.getElementById("signalCount");
const signalsEl = document.getElementById("signals");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep() {
    if (!document.getElementById("soundToggle").checked) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 520;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    } catch(e){}
}

function now() { return Date.now(); }

function money(value) {
    return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function priceFormat(value) {
    const n = Number(value);
    if (n >= 1000) return n.toFixed(2);
    if (n >= 1) return n.toFixed(4);
    return n.toFixed(6);
}

function percent(value) { return (value * 100).toFixed(2) + "%"; }

function getDynamicThreshold(symbol) {
    const turnover = symbolTurnovers.get(symbol) || 10000000;
    const sens = parseFloat(document.getElementById("volSens").value);
    return Math.max(50000, turnover * sens);
}

function togglePause() {
    uiPaused = !uiPaused;
    const btn = document.getElementById("pauseBtn");
    const status = document.getElementById("pauseStatus");
    if (uiPaused) {
        btn.classList.add("active");
        btn.innerText = "▶ Возобновить UI";
        status.style.display = "inline";
    } else {
        btn.classList.remove("active");
        btn.innerText = "⏸ Пауза UI";
        status.style.display = "none";
    }
}

function createBook(symbol) {
    books.set(symbol, { bids: new Map(), asks: new Map(), lastPrice: null });
}

function applySnapshot(symbol, data) {
    createBook(symbol);
    const book = books.get(symbol);
    if (Array.isArray(data.b)) {
        for (const order of data.b) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (price > 0 && qty > 0) book.bids.set(price, qty);
        }
    }
    if (Array.isArray(data.a)) {
        for (const order of data.a) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (price > 0 && qty > 0) book.asks.set(price, qty);
        }
    }
}

function applyDelta(symbol, data) {
    const book = books.get(symbol);
    if (!book) return;
    if (Array.isArray(data.b)) {
        for (const order of data.b) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (qty === 0) book.bids.delete(price);
            else book.bids.set(price, qty);
        }
    }
    if (Array.isArray(data.a)) {
        for (const order of data.a) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (qty === 0) book.asks.delete(price);
            else book.asks.set(price, qty);
        }
    }
}

function processTrade(data) {
    if (!Array.isArray(data)) return;
    for (const trade of data) {
        const symbol = trade.s;
        const price = parseFloat(trade.p);
        if (symbol && price) {
            const book = books.get(symbol);
            if (book) book.lastPrice = price;
        }
    }
}

function getLocalLiquidity(book, side, currentPrice) {
    if (!book || !currentPrice) return 1;
    const source = side === "Buy" ? book.bids : book.asks;
    const values = [];

    for (const [price, qty] of source) {
        if (Math.abs(price - currentPrice) / currentPrice <= 0.008) {
            const val = price * qty;
            if (val > 0) values.push(val);
        }
    }
    if (values.length === 0) return 1;
    values.sort((a, b) => a - b);
    return values[Math.floor(values.length / 2)];
}

function findWalls(symbol) {
    const book = books.get(symbol);
    if (!book) return [];

    let currentPrice = book.lastPrice;
    if (!currentPrice) return [];

    const result = [];
    const threshold = getDynamicThreshold(symbol);
    const maxDist = parseFloat(document.getElementById("maxDist").value);

    // BUY WALLS (Поддержка)
    for (const [price, qty] of book.bids) {
        const distance = (currentPrice - price) / currentPrice;
        if (distance < 0 || distance > maxDist) continue;
        const value = price * qty;
        const local = getLocalLiquidity(book, "Buy", currentPrice);
        const ratio = value / Math.max(local, 1);

        if (value >= threshold && ratio >= MIN_WALL_RATIO) {
            result.push({ symbol, side: "Buy", price, qty, value, distance, ratio, currentPrice, threshold });
        }
    }

    // SELL WALLS (Сопротивление)
    for (const [price, qty] of book.asks) {
        const distance = (price - currentPrice) / currentPrice;
        if (distance < 0 || distance > maxDist) continue;
        const value = price * qty;
        const local = getLocalLiquidity(book, "Sell", currentPrice);
        const ratio = value / Math.max(local, 1);

        if (value >= threshold && ratio >= MIN_WALL_RATIO) {
            result.push({ symbol, side: "Sell", price, qty, value, distance, ratio, currentPrice, threshold });
        }
    }

    result.sort((a, b) => b.value - a.value);
    return result.slice(0, 3);
}

function updateWallHistory(wall) {
    const key = `${wall.symbol}_${wall.side}_${wall.price}`;
    if (!wallHistory.has(key)) {
        wallHistory.set(key, { firstSeen: now(), lastSeen: now(), lastValue: wall.value });
    } else {
        const item = wallHistory.get(key);
        item.lastSeen = now();
        item.lastValue = wall.value;
    }
    return wallHistory.get(key);
}

function calculateSwingScore(wall, ageSec) {
    let score = 0;

    // 1. Время выдержки стены (До 40 баллов)
    const ageMinutes = ageSec / 60;
    score += Math.min(40, (ageMinutes / 15) * 40);

    // 2. Объём от порога суточной ликвидности (До 35 баллов)
    const ratioToThreshold = wall.value / wall.threshold;
    score += Math.min(35, ratioToThreshold * 15);

    // 3. Дистанция — комфортное время для среднесрочного входа (До 25 баллов)
    if (wall.distance >= 0.004 && wall.distance <= 0.018) {
        score += 25; 
    } else if (wall.distance < 0.004) {
        score += 10; // Уже слишком близко
    }

    return Math.min(100, Math.round(score));
}

function analyzeSymbol(symbol) {
    const book = books.get(symbol);
    if (!book) return;

    const wallsFound = findWalls(symbol);

    for (const wall of wallsFound) {
        const history = updateWallHistory(wall);
        const ageSec = (now() - history.firstSeen) / 1000;
        const requiredAgeSec = parseInt(document.getElementById("wallAge").value);

        if (ageSec < requiredAgeSec) continue;

        const score = calculateSwingScore(wall, ageSec);
        if (score < 50) continue;

        const setup = wall.side === "Buy" ? "LONG (Опоры Уровня)" : "SHORT (Сопротивление)";
        const key = `${symbol}_${wall.side}_${wall.price}`;
        const isNew = !signals.has(key);

        signals.set(key, {
            key, symbol, rank: symbolRanks.get(symbol), setup, score, wall, ageSec, updated: now()
        });

        if (isNew) playBeep();
    }
}

function analyzeAll() {
    if (!running) return;
    for (const symbol of symbols) analyzeSymbol(symbol);

    const expiry = now() - 25000;
    for (const [key, signal] of signals) {
        if (signal.updated < expiry) signals.delete(key);
    }
}

function renderSignals() {
    candidateCountEl.innerText = signals.size;
    if (uiPaused) return;

    const sorted = [...signals.values()].sort((a, b) => b.score - a.score).slice(0, MAX_SIGNALS);
    signalCountEl.innerText = sorted.length;

    if (sorted.length === 0) {
        signalsEl.innerHTML = `
            <div class="empty">
                🔎 Поиск подтвержденных уровней для 15m-4h...<br><br>
                Ожидаем плиты, выстоявшие выбранный таймфрейм.
            </div>`;
        return;
    }

    let html = "";
    for (const s of sorted) {
        const isLong = s.wall.side === "Buy";
        const directionClass = isLong ? "long" : "short";
        
        // Расчет StopLoss и TakeProfit под swing
        const stopLoss = isLong ? s.wall.price * 0.996 : s.wall.price * 1.004;
        const takeProfit = isLong ? s.wall.price * 1.012 : s.wall.price * 0.988;

        html += `
            <div class="signal ${directionClass}">
                <div class="signal-top">
                    <div class="symbol">
                        ${s.symbol} <span class="gray">#${s.rank}</span>
                    </div>
                    <div class="direction ${directionClass}">${s.setup}</div>
                </div>
                
                <div class="score">Уровень Score: ${s.score}/100</div>
                
                <div class="data-grid">
                    <div class="data-box">Ключевой Уровень<strong>${priceFormat(s.wall.price)}</strong></div>
                    <div class="data-box">Текущая цена<strong>${priceFormat(s.wall.currentPrice)}</strong></div>
                    <div class="data-box">Дистанция до входа<strong>${percent(s.wall.distance)}</strong></div>
                    <div class="data-box">Объём плиты<strong>$${money(s.wall.value)}</strong></div>
                    <div class="data-box">Порог для монеты<strong>$${money(s.wall.threshold)}</strong></div>
                    <div class="data-box">Выдержка стены<strong>${(s.ageSec / 60).toFixed(1)} мин</strong></div>
                </div>

                <div class="level-setup">
                    <div class="level-setup-title">🎯 Ориентиры для TradingView / Ордеров:</div>
                    Вход у стены: <b>${priceFormat(s.wall.price)}</b> | 
                    Stop-Loss: <b class="red">${priceFormat(stopLoss)}</b> | 
                    Take-Profit (1:3): <b class="green">${priceFormat(takeProfit)}</b>
                </div>
            </div>`;
    }
    signalsEl.innerHTML = html;
}

function connectWebSocket() {
    if (!running) return;

    if (ws) {
        try { ws.onclose = null; ws.close(); } catch (e) {}
    }

    ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");

    ws.onopen = async () => {
        wsEl.innerText = "ON";
        wsEl.className = "stat-value green";
        statusEl.innerText = "Сканирование среднесрочных уровней активно";
        statusEl.style.color = "#27ae60";

        const args = [];
        for (const symbol of symbols) {
            args.push(`orderbook.${ORDERBOOK_DEPTH}.${symbol}`);
            args.push(`publicTrade.${symbol}`);
        }

        const chunkSize = 10;
        for (let i = 0; i < args.length; i += chunkSize) {
            if (!running || ws.readyState !== WebSocket.OPEN) break;
            const chunk = args.slice(i, i + chunkSize);
            ws.send(JSON.stringify({ op: "subscribe", args: chunk }));
            await new Promise(resolve => setTimeout(resolve, 50));
        }
    };

    ws.onmessage = event => {
        try {
            const data = JSON.parse(event.data);
            if (data.op === "pong") return;
            if (!data.topic) return;

            if (data.topic.startsWith("orderbook.")) {
                const symbol = data.topic.split(".")[2];
                if (data.type === "snapshot") applySnapshot(symbol, data.data);
                else if (data.type === "delta") applyDelta(symbol, data.data);
            } else if (data.topic.startsWith("publicTrade.")) {
                processTrade(data.data);
            }
        } catch (error) {}
    };

    ws.onerror = () => {
        wsEl.innerText = "ERROR";
        wsEl.className = "stat-value red";
    };

    ws.onclose = () => {
        wsEl.innerText = "OFF";
        wsEl.className = "stat-value red";
        if (running) {
            statusEl.innerText = "Переподключение...";
            statusEl.style.color = "#f7931a";
            reconnectTimer = setTimeout(connectWebSocket, 3000);
        }
    };
}

function startPing() {
    setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ op: "ping" }));
        }
    }, 20000);
}

async function loadSymbols() {
    try {
        statusEl.innerText = "Загрузка TOP-100...";
        statusEl.style.color = "#f7931a";

        const response = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const json = await response.json();

        if (!json.result || !Array.isArray(json.result.list)) throw new Error("Invalid response");

        const list = json.result.list
            .filter(item => item.symbol && item.symbol.endsWith("USDT") && parseFloat(item.turnover24h) > 0)
            .sort((a, b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
            .slice(0, MAX_SYMBOLS);

        symbols.length = 0;
        symbolRanks.clear();
        symbolTurnovers.clear();

        list.forEach((item, index) => {
            symbols.push(item.symbol);
            symbolRanks.set(item.symbol, index + 1);
            symbolTurnovers.set(item.symbol, parseFloat(item.turnover24h));
        });

        coinCountEl.innerText = symbols.length;
        return true;
    } catch (error) {
        statusEl.innerText = "Ошибка загрузки TOP";
        statusEl.style.color = "#e74c3c";
        return false;
    }
}

async function startScanner() {
    if (running) return;
    running = true;

    const success = await loadSymbols();
    if (!success) { running = false; return; }

    books.clear();
    trades.clear();
    signals.clear();
    wallHistory.clear();

    connectWebSocket();

    analysisTimer = setInterval(analyzeAll, ANALYSIS_INTERVAL);
    uiTimer = setInterval(renderSignals, UI_INTERVAL);

    symbolRefreshTimer = setInterval(async () => {
        await loadSymbols();
        connectWebSocket();
    }, SYMBOL_REFRESH);
}

function stopScanner() {
    running = false;
    if (analysisTimer) clearInterval(analysisTimer);
    if (uiTimer) clearInterval(uiTimer);
    if (symbolRefreshTimer) clearInterval(symbolRefreshTimer);
    if (reconnectTimer) clearTimeout(reconnectTimer);

    if (ws) {
        try { ws.onclose = null; ws.close(); } catch (e) {}
        ws = null;
    }

    wsEl.innerText = "OFF";
    wsEl.className = "stat-value";
    statusEl.innerText = "Остановлен";
    statusEl.style.color = "#848e9c";
}

function clearSignals() {
    signals.clear();
    renderSignals();
}

startPing();
</script>
</body>
</html>
