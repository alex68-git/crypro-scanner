<script>


/* =====================================================
   CONFIG
===================================================== */


/*
 * ВАЖНО:
 *
 * Для iPhone не пытаемся держать 100 монет.
 *
 * 40 наиболее ликвидных USDT perpetual.
 */

const MAX_SYMBOLS = 40;


/*
 * Orderbook 50.
 */

const ORDERBOOK_DEPTH = 50;


/*
 * Максимум отображаемых сигналов.
 */

const MAX_SIGNALS = 12;


/*
 * Анализ не чаще 2 раз в секунду.
 */

const ANALYSIS_INTERVAL = 700;


/*
 * UI.
 */

const UI_INTERVAL = 1200;


/*
 * Обновляем TOP каждые 10 минут.
 */

const SYMBOL_REFRESH =
    10 * 60 * 1000;


/*
 * Максимальное расстояние стены.
 */

const MAX_WALL_DISTANCE = 0.008;


/*
 * Окно aggressive flow.
 */

const TRADE_WINDOW = 10000;


/*
 * Окно цены.
 */

const PRICE_WINDOW = 60000;


/*
 * Минимальный relative wall ratio.
 *
 * Было 3x.
 *
 * Теперь 5x.
 */

const MIN_WALL_RATIO = 5;


/*
 * Минимальный absolute wall.
 *
 * Это базовый минимум.
 */

const GLOBAL_MIN_WALL = 100000;


/*
 * Минимальный aggressive flow
 * за 10 секунд.
 */

const MIN_TRADE_FLOW = 75000;


/*
 * Максимум сделок в памяти
 * на монету.
 */

const MAX_TRADES_PER_SYMBOL = 400;


/*
 * Максимум уровней orderbook
 * локально.
 */

const MAX_BOOK_LEVELS = 70;


/*
 * WebSocket subscribe batch.
 *
 * Мы сознательно делаем маленькие
 * пачки для стабильности.
 */

const SUBSCRIBE_BATCH_SIZE = 10;


/* =====================================================
   ABSOLUTE THRESHOLDS
===================================================== */


/*
 * Порог зависит от ликвидности
 * актива.
 *
 * Это уже намного строже,
 * чем исходный вариант.
 */

const LIQUIDITY_THRESHOLDS = {

    top5: 1000000,

    top10: 750000,

    top20: 500000,

    top30: 350000,

    top40: 250000

};


/*
 * Специальный минимум
 * для самых крупных активов.
 *
 * Например:
 *
 * BTC / ETH / SOL
 */

const MAJOR_THRESHOLDS = {

    BTCUSDT: 2500000,

    ETHUSDT: 1500000,

    SOLUSDT: 750000,

    XRPUSDT: 500000,

    BNBUSDT: 600000,

    DOGEUSDT: 500000,

    ADAUSDT: 400000,

    SUIUSDT: 350000,

    AVAXUSDT: 350000,

    LINKUSDT: 350000

};


/* =====================================================
   STATE
===================================================== */

let ws = null;

let running = false;

let reconnectTimer = null;

let analysisTimer = null;

let uiTimer = null;

let symbolRefreshTimer = null;

let pingTimer = null;

let watchdogTimer = null;


/*
 * Symbols.
 */

const symbols = [];

const symbolRanks = new Map();

const symbolTurnovers = new Map();


/*
 * Books.
 */

const books = new Map();


/*
 * Trades.
 */

const trades = new Map();


/*
 * Walls.
 */

const wallHistory = new Map();


/*
 * Signals.
 */

const signals = new Map();


/*
 * Statistics.
 */

let lastMarketMessage = 0;

let marketMessageCount = 0;


/* =====================================================
   DOM
===================================================== */

const statusEl =
    document.getElementById("status");

const wsEl =
    document.getElementById("wsStatus");

const coinCountEl =
    document.getElementById("coinCount");

const candidateCountEl =
    document.getElementById("candidateCount");

const signalCountEl =
    document.getElementById("signalCount");

const signalsEl =
    document.getElementById("signals");

const dataWarningEl =
    document.getElementById("dataWarning");


/* =====================================================
   HELPERS
===================================================== */

function now() {

    return Date.now();

}


function money(value) {

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


function priceFormat(value) {

    const n = Number(value);

    if (n >= 1000)
        return n.toFixed(2);

    if (n >= 1)
        return n.toFixed(4);

    return n.toFixed(8);

}


function percent(value) {

    return (
        Number(value) * 100
    ).toFixed(2) + "%";

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/* =====================================================
   DYNAMIC WALL THRESHOLD
===================================================== */

function getBaseThreshold(
    symbol
) {

    /*
     * Специальные активы.
     */

    if (
        MAJOR_THRESHOLDS[symbol]
    ) {

        return MAJOR_THRESHOLDS[
            symbol
        ];

    }


    const rank =
        symbolRanks.get(symbol);


    if (!rank) {

        return 250000;

    }


    if (rank <= 5)
        return LIQUIDITY_THRESHOLDS.top5;


    if (rank <= 10)
        return LIQUIDITY_THRESHOLDS.top10;


    if (rank <= 20)
        return LIQUIDITY_THRESHOLDS.top20;


    if (rank <= 30)
        return LIQUIDITY_THRESHOLDS.top30;


    return LIQUIDITY_THRESHOLDS.top40;

}


/* =====================================================
   DYNAMIC TURNOVER THRESHOLD
===================================================== */

function getDynamicThreshold(
    symbol
) {

    const turnover =
        symbolTurnovers.get(
            symbol
        ) || 0;


    const base =
        getBaseThreshold(
            symbol
        );


    /*
     * Чем выше суточный оборот,
     * тем выше требуемая стена.
     *
     * turnover / 1000
     *
     * 0.002% от оборота.
     */

    const turnoverThreshold =
        turnover * 0.000025;


    /*
     * Не даём dynamic threshold
     * стать слишком большим.
     */

    return Math.max(
        GLOBAL_MIN_WALL,
        base,
        turnoverThreshold
    );

}


/* =====================================================
   CREATE BOOK
===================================================== */

function createBook(
    symbol
) {

    books.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map(),
            lastPrice: null,
            lastUpdate: 0
        }
    );

}


/* =====================================================
   APPLY SNAPSHOT
===================================================== */

function applySnapshot(
    symbol,
    data
) {

    createBook(symbol);

    const book =
        books.get(symbol);


    if (
        Array.isArray(data.b)
    ) {

        for (
            const order of data.b
        ) {

            const price =
                Number(order[0]);

            const qty =
                Number(order[1]);


            if (
                price > 0 &&
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        Array.isArray(data.a)
    ) {

        for (
            const order of data.a
        ) {

            const price =
                Number(order[0]);

            const qty =
                Number(order[1]);


            if (
                price > 0 &&
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    book.lastUpdate =
        now();

}


/* =====================================================
   APPLY DELTA
===================================================== */

function applyDelta(
    symbol,
    data
) {

    const book =
        books.get(symbol);


    if (!book)
        return;


    if (
        Array.isArray(data.b)
    ) {

        for (
            const order of data.b
        ) {

            const price =
                Number(order[0]);

            const qty =
                Number(order[1]);


            if (qty === 0) {

                book.bids.delete(
                    price
                );

            } else {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        Array.isArray(data.a)
    ) {

        for (
            const order of data.a
        ) {

            const price =
                Number(order[0]);

            const qty =
                Number(order[1]);


            if (qty === 0) {

                book.asks.delete(
                    price
                );

            } else {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    /*
     * Защита памяти.
     */

    if (
        book.bids.size >
        MAX_BOOK_LEVELS
    ) {

        trimBook(
            book.bids,
            true
        );

    }


    if (
        book.asks.size >
        MAX_BOOK_LEVELS
    ) {

        trimBook(
            book.asks,
            false
        );

    }


    book.lastUpdate =
        now();

}


/* =====================================================
   TRIM BOOK
===================================================== */

function trimBook(
    map,
    bids
) {

    const entries =
        [...map.entries()]
            .sort(
                (a, b) =>
                    bids
                        ? b[0] - a[0]
                        : a[0] - b[0]
            );


    map.clear();


    entries
        .slice(
            0,
            MAX_BOOK_LEVELS
        )
        .forEach(
            ([price, qty]) => {

                map.set(
                    price,
                    qty
                );

            }
        );

}


/* =====================================================
   PROCESS TRADES
===================================================== */

function processTrade(
    data
) {

    if (
        !Array.isArray(data)
    )
        return;


    for (
        const trade of data
    ) {

        const symbol =
            trade.s;

        const side =
            trade.S;

        const price =
            Number(trade.p);

        const qty =
            Number(trade.v);

        const timestamp =
            Number(trade.T) ||
            now();


        if (
            !symbol ||
            !price ||
            !qty
        )
            continue;


        const value =
            price * qty;


        if (
            !trades.has(symbol)
        ) {

            trades.set(
                symbol,
                []
            );

        }


        const list =
            trades.get(symbol);


        list.push({

            time: timestamp,

            side,

            price,

            qty,

            value

        });


        const book =
            books.get(symbol);


        if (book) {

            book.lastPrice =
                price;

        }


        /*
         * Удаляем старые.
         */

        const cutoff =
            now() -
            PRICE_WINDOW;


        while (
            list.length &&
            (
                list[0].time <
                cutoff
            )
        ) {

            list.shift();

        }


        /*
         * Ограничение памяти.
         */

        if (
            list.length >
            MAX_TRADES_PER_SYMBOL
        ) {

            list.splice(
                0,
                list.length -
                MAX_TRADES_PER_SYMBOL
            );

        }

    }

}


/* =====================================================
   TRADE FLOW
===================================================== */

function getTradeFlow(
    symbol
) {

    const list =
        trades.get(symbol) || [];


    const cutoff =
        now() -
        TRADE_WINDOW;


    let buy = 0;

    let sell = 0;

    let buyCount = 0;

    let sellCount = 0;


    for (
        let i =
            list.length - 1;

        i >= 0;

        i--
    ) {

        const t =
            list[i];


        if (
            t.time <
            cutoff
        )
            break;


        if (
            t.side === "Buy"
        ) {

            buy += t.value;

            buyCount++;

        } else {

            sell += t.value;

            sellCount++;

        }

    }


    const total =
        buy + sell;


    const imbalance =
        total > 0
            ? (
                buy - sell
            ) / total
            : 0;


    return {

        buy,

        sell,

        total,

        imbalance,

        buyCount,

        sellCount

    };

}


/* =====================================================
   PRICE CHANGE
===================================================== */

function getPriceChange(
    symbol
) {

    const list =
        trades.get(symbol) || [];


    if (
        list.length < 2
    )
        return 0;


    const latest =
        list[list.length - 1];


    const cutoff =
        now() -
        PRICE_WINDOW;


    let old = null;


    for (
        let i = 0;

        i < list.length;

        i++
    ) {

        if (
            list[i].time >=
            cutoff
        ) {

            old =
                list[i];

            break;

        }

    }


    if (
        !old ||
        !old.price
    )
        return 0;


    return (
        latest.price -
        old.price
    ) / old.price;

}


/* =====================================================
   LOCAL LIQUIDITY
===================================================== */

function getLocalLiquidity(
    book,
    side,
    currentPrice
) {

    if (
        !book ||
        !currentPrice
    )
        return 1;


    const source =
        side === "Buy"
            ? book.bids
            : book.asks;


    const values = [];


    for (
        const [
            price,
            qty
        ]
        of source
    ) {

        const distance =
            Math.abs(
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance <= 0.003
        ) {

            const value =
                price * qty;


            if (
                value > 0
            ) {

                values.push(
                    value
                );

            }

        }

    }


    if (
        values.length < 3
    )
        return 1;


    values.sort(
        (a, b) =>
            a - b
    );


    /*
     * Вместо одной случайной
     * медианы используем
     * median.
     */

    return values[
        Math.floor(
            values.length / 2
        )
    ];

}


/* =====================================================
   FIND WALLS
===================================================== */

function findWalls(
    symbol
) {

    const book =
        books.get(symbol);


    if (!book)
        return [];


    let currentPrice =
        book.lastPrice;


    /*
     * Fallback mid price.
     */

    if (!currentPrice) {

        const bids =
            [...book.bids.keys()]
                .sort(
                    (a, b) =>
                        b - a
                );

        const asks =
            [...book.asks.keys()]
                .sort(
                    (a, b) =>
                        a - b
                );


        if (
            bids.length &&
            asks.length
        ) {

            currentPrice =
                (
                    bids[0] +
                    asks[0]
                ) / 2;

        }

    }


    if (!currentPrice)
        return [];


    const result = [];

    const threshold =
        getDynamicThreshold(
            symbol
        );


    /*
     * BUY WALL
     */

    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        const distance =
            (
                currentPrice -
                price
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        if (
            value <
            threshold
        )
            continue;


        const local =
            getLocalLiquidity(
                book,
                "Buy",
                currentPrice
            );


        const ratio =
            value /
            Math.max(
                local,
                1
            );


        if (
            ratio <
            MIN_WALL_RATIO
        )
            continue;


        result.push({

            symbol,

            side: "Buy",

            price,

            qty,

            value,

            distance,

            ratio,

            currentPrice

        });

    }


    /*
     * SELL WALL
     */

    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        const distance =
            (
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        if (
            value <
            threshold
        )
            continue;


        const local =
            getLocalLiquidity(
                book,
                "Sell",
                currentPrice
            );


        const ratio =
            value /
            Math.max(
                local,
                1
            );


        if (
            ratio <
            MIN_WALL_RATIO
        )
            continue;


        result.push({

            symbol,

            side: "Sell",

            price,

            qty,

            value,

            distance,

            ratio,

            currentPrice

        });

    }


    result.sort(
        (a, b) =>
            b.value -
            a.value
    );


    return result.slice(
        0,
        5
    );

}


/* =====================================================
   WALL HISTORY
===================================================== */

function updateWallHistory(
    wall
) {

    /*
     * Округляем цену, чтобы
     * небольшие изменения уровня
     * не создавали новую стену.
     */

    const precision =
        wall.price >= 100
            ? 1
            : wall.price >= 1
                ? 3
                : 6;


    const normalizedPrice =
        Number(
            wall.price.toFixed(
                precision
            )
        );


    const key =
        `${wall.symbol}_${wall.side}_${normalizedPrice}`;


    if (
        !wallHistory.has(key)
    ) {

        wallHistory.set(
            key,
            {
                firstSeen: now(),
                lastSeen: now(),
                lastValue: wall.value,
                key
            }
        );

    } else {

        const item =
            wallHistory.get(key);


        item.lastSeen =
            now();


        item.lastValue =
            wall.value;

    }


    return wallHistory.get(
        key
    );

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(
    wall,
    flow,
    priceChange,
    age
) {

    let score = 0;


    /*
     * 1.
     * Absolute size.
     *
     * 25 points.
     */

    const threshold =
        getDynamicThreshold(
            wall.symbol
        );


    const sizeRatio =
        wall.value /
        Math.max(
            threshold,
            1
        );


    const sizeScore =
        Math.min(
            25,
            Math.log10(
                Math.max(
                    sizeRatio,
                    1
                )
            ) * 20
        );


    score += sizeScore;


    /*
     * 2.
     * Relative wall.
     *
     * 20 points.
     */

    const ratioScore =
        Math.min(
            20,
            Math.max(
                0,
                (
                    wall.ratio -
                    4
                ) * 3
            )
        );


    score += ratioScore;


    /*
     * 3.
     * Age.
     *
     * 15 points.
     */

    const ageScore =
        Math.min(
            15,
            age / 1000
        );


    score += ageScore;


    /*
     * 4.
     * Flow.
     *
     * 25 points.
     */

    const alignedFlow =
        wall.side === "Buy"

            ? Math.max(
                0,
                flow.imbalance
            )

            : Math.max(
                0,
                -flow.imbalance
            );


    score +=
        alignedFlow * 25;


    /*
     * 5.
     * Price.
     *
     * 15 points.
     */

    const alignedPrice =
        wall.side === "Buy"

            ? Math.max(
                0,
                priceChange
            )

            : Math.max(
                0,
                -priceChange
            );


    score +=
        Math.min(
            15,
            alignedPrice * 1000
        );


    return Math.min(
        100,
        Math.round(score)
    );

}


/* =====================================================
   SETUP
===================================================== */

function determineSetup(
    wall,
    flow,
    priceChange
) {

    /*
     * BUY WALL
     */

    if (
        wall.side === "Buy"
    ) {

        /*
         * Поддержка.
         */

        if (
            flow.total >=
                MIN_TRADE_FLOW &&
            flow.imbalance >=
                0.15 &&
            priceChange >=
                -0.0005
        ) {

            return "LONG";

        }


        /*
         * Breakdown.
         */

        if (
            flow.total >=
                MIN_TRADE_FLOW &&
            flow.imbalance <=
                -0.25 &&
            priceChange < 0
        ) {

            return "BREAKOUT";

        }

    }


    /*
     * SELL WALL
     */

    if (
        wall.side === "Sell"
    ) {

        /*
         * Resistance.
         */

        if (
            flow.total >=
                MIN_TRADE_FLOW &&
            flow.imbalance <=
                -0.15 &&
            priceChange <=
                0.0005
        ) {

            return "SHORT";

        }


        /*
         * Breakout вверх.
         */

        if (
            flow.total >=
                MIN_TRADE_FLOW &&
            flow.imbalance >=
                0.25 &&
            priceChange > 0
        ) {

            return "BREAKOUT";

        }

    }


    return null;

}


/* =====================================================
   ANALYZE SYMBOL
===================================================== */

function analyzeSymbol(
    symbol
) {

    const book =
        books.get(symbol);


    if (!book)
        return;


    /*
     * Не анализируем
     * полностью мёртвую книгу.
     */

    if (
        now() -
        book.lastUpdate >
        10000
    ) {

        return;

    }


    const walls =
        findWalls(symbol);


    if (
        walls.length === 0
    )
        return;


    const flow =
        getTradeFlow(symbol);


    const priceChange =
        getPriceChange(symbol);


    const requiredAge =
        Number(
            document
                .getElementById(
                    "wallAge"
                )
                .value
        ) * 1000;


    const strict =
        document
            .getElementById(
                "scanMode"
            )
            .value ===
        "strict";


    for (
        const wall of walls
    ) {

        const history =
            updateWallHistory(
                wall
            );


        const age =
            now() -
            history.firstSeen;


        if (
            age <
            requiredAge
        )
            continue;


        /*
         * Strict режим.
         */

        const minimumFlow =
            strict
                ? MIN_TRADE_FLOW *
                    1.5
                : MIN_TRADE_FLOW;


        if (
            flow.total <
            minimumFlow
        )
            continue;


        const setup =
            determineSetup(
                wall,
                flow,
                priceChange
            );


        if (!setup)
            continue;


        const score =
            calculateScore(
                wall,
                flow,
                priceChange,
                age
            );


        const minScore =
            Number(
                document
                    .getElementById(
                        "minScore"
                    )
                    .value
            );


        if (
            score <
            minScore
        )
            continue;


        const key =
            `${wall.symbol}_${wall.side}_${wall.price}`;


        signals.set(
            key,
            {

                key,

                symbol,

                rank:
                    symbolRanks.get(
                        symbol
                    ),

                setup,

                score,

                wall,

                flow,

                priceChange,

                age,

                threshold:
                    getDynamicThreshold(
                        symbol
                    ),

                updated:
                    now()

            }
        );

    }

}


/* =====================================================
   ANALYZE ALL
===================================================== */

function analyzeAll() {

    if (!running)
        return;


    /*
     * Вместо тяжёлой работы
     * каждый тик анализируем
     * только активные книги.
     */

    for (
        const symbol of symbols
    ) {

        analyzeSymbol(
            symbol
        );

    }


    /*
     * Сигнал живёт 6 секунд.
     */

    const expiry =
        now() -
        6000;


    for (
        const [
            key,
            signal
        ]
        of signals
    ) {

        if (
            signal.updated <
            expiry
        ) {

            signals.delete(
                key
            );

        }

    }


    /*
     * Чистим старые стены.
     */

    const historyExpiry =
        now() -
        30000;


    for (
        const [
            key,
            item
        ]
        of wallHistory
    ) {

        if (
            item.lastSeen <
            historyExpiry
        ) {

            wallHistory.delete(
                key
            );

        }

    }

}

/* =====================================================
   SUBSCRIBE IN BATCHES
===================================================== */

function subscribeInBatches() {

    if (
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
    )
        return;


    const args = [];


    for (
        const symbol of symbols
    ) {

        args.push(
            `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
        );

        args.push(
            `publicTrade.${symbol}`
        );

    }


    /*
     * Делим на небольшие
     * сообщения.
     */

    for (
        let i = 0;

        i < args.length;

        i += SUBSCRIBE_BATCH_SIZE
    ) {

        const batch =
            args.slice(
                i,
                i +
                SUBSCRIBE_BATCH_SIZE
            );


        setTimeout(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({

                            op:
                                "subscribe",

                            args:
                                batch

                        })
                    );

                }

            },
            i * 35
        );

    }

}


/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket() {

    if (!running)
        return;


    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }


    statusEl.innerText =
        "Подключение WebSocket...";

    statusEl.style.color =
        "#f7931a";


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        wsEl.innerText =
            "ON";

        wsEl.className =
            "stat-value green";


        statusEl.innerText =
            "WebSocket подключён";

        statusEl.style.color =
            "#27ae60";


        lastMarketMessage =
            now();

        marketMessageCount = 0;


        subscribeInBatches();

    };


    ws.onmessage =
        event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            /*
             * Subscribe response.
             */

            if (
                data.op ===
                "subscribe"
            ) {

                if (
                    data.success ===
                    false
                ) {

                    console.error(
                        "Subscribe error:",
                        data
                    );

                }

                return;

            }


            /*
             * Pong.
             */

            if (
                data.op ===
                "pong"
            ) {

                return;

            }


            if (
                !data.topic
            )
                return;


            lastMarketMessage =
                now();

            marketMessageCount++;


            /*
             * ORDERBOOK.
             */

            if (
                data.topic
                    .startsWith(
                        "orderbook."
                    )
            ) {

                const parts =
                    data.topic.split(".");


                const symbol =
                    parts[2];


                if (
                    data.type ===
                    "snapshot"
                ) {

                    applySnapshot(
                        symbol,
                        data.data
                    );

                }


                else if (
                    data.type ===
                    "delta"
                ) {

                    applyDelta(
                        symbol,
                        data.data
                    );

                }

            }


            /*
             * PUBLIC TRADE.
             */

            else if (
                data.topic
                    .startsWith(
                        "publicTrade."
                    )
            ) {

                processTrade(
                    data.data
                );

            }

        }

        catch (error) {

            console.error(
                "WS parse error:",
                error
            );

        }

    };


    ws.onerror =
        error => {

        console.error(
            "WebSocket error",
            error
        );


        wsEl.innerText =
            "ERROR";

        wsEl.className =
            "stat-value red";

    };


    ws.onclose =
        () => {

        wsEl.innerText =
            "OFF";

        wsEl.className =
            "stat-value red";


        if (
            running
        ) {

            statusEl.innerText =
                "WS разорван — переподключение";

            statusEl.style.color =
                "#f7931a";


            scheduleReconnect();

        }

    };

}


/* =====================================================
   RECONNECT
===================================================== */

function scheduleReconnect() {

    if (
        reconnectTimer
    )
        return;


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;


                if (
                    running
                ) {

                    connectWebSocket();

                }

            },
            3000
        );

}


/* =====================================================
   PING
===================================================== */

function startPing() {

    if (
        pingTimer
    )
        clearInterval(
            pingTimer
        );


    pingTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


/* =====================================================
   WATCHDOG
===================================================== */

function startWatchdog() {

    if (
        watchdogTimer
    )
        clearInterval(
            watchdogTimer
        );


    watchdogTimer =
        setInterval(
            () => {

                if (!running)
                    return;


                const silence =
                    now() -
                    lastMarketMessage;


                /*
                 * Если 12 секунд нет
                 * market data — считаем
                 * соединение подозрительным.
                 */

                if (
                    silence >
                    12000
                ) {

                    dataWarningEl.innerText =
                        "⚠️ Нет market data > 12 сек. Переподключение...";


                    if (
                        ws
                    ) {

                        try {
                            ws.close();
                        } catch (e) {}

                    }

                } else {

                    dataWarningEl.innerText =
                        "";

                }

            },
            5000
        );

}


/* =====================================================
   LOAD TOP
===================================================== */

async function loadSymbols() {

    try {

        statusEl.innerText =
            "Загрузка ликвидных монет...";

        statusEl.style.color =
            "#f7931a";


        const response =
            await fetch(
                "https://api.bybit.com/v5/market/tickers?category=linear",
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Invalid Bybit response"
            );

        }


        const list =
            json.result.list

                .filter(
                    item =>
                        item.symbol &&
                        item.symbol
                            .endsWith(
                                "USDT"
                            ) &&
                        Number(
                            item.turnover24h
                        ) > 0
                )

                .sort(
                    (a, b) =>
                        Number(
                            b.turnover24h
                        ) -
                        Number(
                            a.turnover24h
                        )
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length = 0;

        symbolRanks.clear();

        symbolTurnovers.clear();


        list.forEach(
            (item, index) => {

                symbols.push(
                    item.symbol
                );


                symbolRanks.set(
                    item.symbol,
                    index + 1
                );


                symbolTurnovers.set(
                    item.symbol,
                    Number(
                        item.turnover24h
                    )
                );

            }
        );


        coinCountEl.innerText =
            symbols.length;


        statusEl.innerText =
            `TOP ${symbols.length} загружен`;

        statusEl.style.color =
            "#27ae60";


        return true;

    }

    catch (error) {

        console.error(
            "TOP error:",
            error
        );


        statusEl.innerText =
            "Ошибка загрузки TOP";

        statusEl.style.color =
            "#e74c3c";


        return false;

    }

}

    resetMarketState();


    const success =
        await loadSymbols();


    if (

    ) {

    connectWebSocket();

    startPing();

    startWatchdog();


    analysisTimer =
        setInterval(
            analyzeAll,

    uiTimer =
        setInterval(

            UI_INTERVAL

                await loadSymbols();


                resetMarketState();


                connectWebSocket();

            SYMBOL_REFRESH
        );


    renderSignals();
