}

body {

/* =====================================================
   HEADER
===================================================== */

}

h1 {

===================================================== */

}

===================================================== */

===================================================== */

   SIGNAL CARD
===================================================== */

}

    border-left-color: #e74c3c;
}

}

   CARD TOP
===================================================== */

.signal-top {

.symbol {

}

.direction {

   SCORE
===================================================== */

.score {

/* =====================================================
   DATA GRID
===================================================== */

.data-grid {

.data-box {

}

.data-box strong {

}


/* =====================================================
   REASON
===================================================== */

.reason {

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

}


/* =====================================================
   COLORS
===================================================== */

.green {

}

.red {

}

.orange {

    color: #f7931a;
}

.blue {

    color: #3498db;
}

    color: #848e9c;

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    }

    .stats .stat:last-child {

<script>

/* =====================================================
   CONFIG
===================================================== */


/*
 * TOP-100 монет.
 */

const MAX_SYMBOLS = 100;


/*
 * Bybit orderbook level 50.
 */

const ORDERBOOK_DEPTH = 50;


/*
 * Максимальное количество
 * одновременно отображаемых
 * сигналов.
 */

const MAX_SIGNALS = 10;


/*
 * Интервал анализа.
 */

const ANALYSIS_INTERVAL = 500;


/*
 * Интервал UI.
 */

const UI_INTERVAL = 1000;


/*
 * Обновление TOP.
 *
 * Сам WebSocket при этом
 * не пересоздаётся без
 * необходимости.
 */

const SYMBOL_REFRESH =
    5 * 60 * 1000;


/*
 * Сколько WebSocket соединений.
 */

const WS_CONNECTIONS = 4;


/*
 * Монет на один WebSocket.
 */

const SYMBOLS_PER_WS =
    Math.ceil(
        MAX_SYMBOLS /
        WS_CONNECTIONS
    );


/*
 * Heartbeat Bybit.
 */

const PING_INTERVAL = 20000;


/*
 * Reconnect delay.
 */

const RECONNECT_DELAY = 3000;


/*
 * Максимальное расстояние
 * стены от текущей цены.
 */

const MAX_WALL_DISTANCE = 0.008;


/*
 * Локальная область,
 * используемая для оценки
 * ликвидности.
 */

const LOCAL_LIQUIDITY_DISTANCE =
    0.003;


/*
 * Относительная сила стены.
 */

const MIN_WALL_RATIO = 2.5;


/*
 * Минимальная абсолютная
 * стоимость стены для
 * монет 21-100.
 */

const BASE_THRESHOLDS = {

    top21_50: 150000,

    top51_100: 50000

};


/*
 * Для TOP-20 используем
 * локальную ликвидность.
 */

const TOP20_MIN_MULTIPLIER = 3;


/*
 * Минимальный размер стены
 * TOP-20 даже если локальная
 * ликвидность маленькая.
 */

const TOP20_MIN_ABSOLUTE = {

    top1_5: 250000,

    top6_20: 150000

};


/*
 * Агрессивные сделки.
 */

const TRADE_WINDOW = 10000;


/*
 * Движение цены.
 */

const PRICE_WINDOW = 60000;


/*
 * Сигнал считается свежим
 * столько миллисекунд.
 */

const SIGNAL_EXPIRY = 5000;


/*
 * Максимальное число записей
 * истории стены.
 */

const MAX_WALL_HISTORY = 5000;


/* =====================================================
   STATE
===================================================== */

let running = false;

let reconnectTimers = [];

let pingTimers = [];

let wsConnections = [];

let analysisTimer = null;

let uiTimer = null;

let symbolRefreshTimer = null;


/*
 * TOP-100
 */

const symbols = [];

const symbolRanks = new Map();


/*
 * Order books.
 */

const books = new Map();


/*
 * Trades.
 */

const trades = new Map();


/*
 * Signals.
 */

const signals = new Map();


/*
 * Wall history.
 */

const wallHistory = new Map();


/*
 * Для контроля текущей версии
 * списка символов.
 */

let symbolsVersion = 0;


/* =====================================================
   DOM
===================================================== */

const statusEl =
    document.getElementById(
        "status"
    );

const wsEl =
    document.getElementById(
        "wsStatus"
    );

const coinCountEl =
    document.getElementById(
        "coinCount"
    );

const candidateCountEl =
    document.getElementById(
        "candidateCount"
    );

const signalCountEl =
    document.getElementById(
        "signalCount"
    );

const lastUpdateEl =
    document.getElementById(
        "lastUpdate"
    );

const signalsEl =
    document.getElementById(
        "signals"
    );


/* =====================================================
   HELPERS
===================================================== */

function now() {

    return Date.now();

}


function money(value) {

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


function priceFormat(value) {

    const n =
        Number(value);


    if (!Number.isFinite(n))
        return "-";


    if (n >= 1000)
        return n.toFixed(2);


    if (n >= 1)
        return n.toFixed(4);


    if (n >= 0.01)
        return n.toFixed(6);


    return n.toFixed(8);

}


function percent(value) {

    return (
        Number(value || 0) * 100
    ).toFixed(2) + "%";

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* =====================================================
   WEBSOCKET STATUS
===================================================== */

function updateWSStatus() {

    let connected = 0;


    for (
        const connection
        of wsConnections
    ) {

        if (
            connection &&
            connection.ws &&
            connection.ws.readyState ===
            WebSocket.OPEN
        ) {

            connected++;

        }

    }


    wsEl.innerText =
        `${connected}/${WS_CONNECTIONS}`;


    if (
        connected ===
        WS_CONNECTIONS
    ) {

        wsEl.className =
            "stat-value green";

    }

    else if (
        connected > 0
    ) {

        wsEl.className =
            "stat-value orange";

    }

    else {

        wsEl.className =
            "stat-value red";

    }

}


/* =====================================================
   CREATE BOOK
===================================================== */

function createBook(
    symbol
) {

    if (
        !books.has(symbol)
    ) {

        books.set(
            symbol,
            {

                bids: new Map(),

                asks: new Map(),

                lastPrice: null,

                lastUpdate: now()

            }
        );

    }


    return books.get(
        symbol
    );

}


/* =====================================================
   APPLY SNAPSHOT
===================================================== */

function applySnapshot(
    symbol,
    data
) {

    if (
        !data ||
        !symbol
    )
        return;


    const book =
        createBook(
            symbol
        );


    /*
     * Очень важно:
     * новый snapshot полностью
     * заменяет старый стакан.
     */

    book.bids.clear();

    book.asks.clear();


    if (
        Array.isArray(
            data.b
        )
    ) {

        for (
            const order
            of data.b
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (
                price > 0 &&
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        Array.isArray(
            data.a
        )
    ) {

        for (
            const order
            of data.a
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (
                price > 0 &&
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    book.lastUpdate =
        now();


    /*
     * Если цены ещё нет —
     * определяем mid price.
     */

    updateBookMidPrice(
        book
    );

}


/* =====================================================
   APPLY DELTA
===================================================== */

function applyDelta(
    symbol,
    data
) {

    const book =
        books.get(
            symbol
        );


    if (
        !book ||
        !data
    )
        return;


    if (
        Array.isArray(
            data.b
        )
    ) {

        for (
            const order
            of data.b
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (
                !Number.isFinite(
                    price
                )
            )
                continue;


            if (
                qty === 0
            ) {

                book.bids.delete(
                    price
                );

            }

            else if (
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (
        Array.isArray(
            data.a
        )
    ) {

        for (
            const order
            of data.a
        ) {

            const price =
                parseFloat(
                    order[0]
                );

            const qty =
                parseFloat(
                    order[1]
                );


            if (
                !Number.isFinite(
                    price
                )
            )
                continue;


            if (
                qty === 0
            ) {

                book.asks.delete(
                    price
                );

            }

            else if (
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }


    book.lastUpdate =
        now();


    updateBookMidPrice(
        book
    );

}


/* =====================================================
   UPDATE MID PRICE
===================================================== */

function updateBookMidPrice(
    book
) {

    if (!book)
        return;


    const bids =
        [...book.bids.keys()]
            .sort(
                (a, b) =>
                    b - a
            );


    const asks =
        [...book.asks.keys()]
            .sort(
                (a, b) =>
                    a - b
            );


    if (
        bids.length &&
        asks.length
    ) {

        book.lastPrice =
            (
                bids[0] +
                asks[0]
            ) / 2;

    }

}


/* =====================================================
   PROCESS TRADES
===================================================== */

function processTrade(
    data
) {

    if (
        !Array.isArray(
            data
        )
    )
        return;


    for (
        const trade
        of data
    ) {

        const symbol =
            trade.s;

        const side =
            trade.S;


        const price =
            parseFloat(
                trade.p
            );


        const qty =
            parseFloat(
                trade.v
            );


        const timestamp =
            Number(
                trade.T
            ) || now();


        if (
            !symbol ||
            !Number.isFinite(price) ||
            !Number.isFinite(qty) ||
            price <= 0 ||
            qty <= 0
        )
            continue;


        const value =
            price * qty;


        if (
            !trades.has(
                symbol
            )
        ) {

            trades.set(
                symbol,
                []
            );

        }


        const list =
            trades.get(
                symbol
            );


        list.push({

            time: timestamp,

            side,

            price,

            qty,

            value

        });


        const book =
            books.get(
                symbol
            );


        if (book) {

            book.lastPrice =
                price;

        }

    }

}


/* =====================================================
   CLEAN OLD TRADES
===================================================== */

function cleanupTrades() {

    const cutoff =
        now() -
        PRICE_WINDOW;


    for (
        const [
            symbol,
            list
        ]
        of trades
    ) {

        while (
            list.length &&
            list[0].time <
            cutoff
        ) {

            list.shift();

        }


        if (
            list.length === 0
        ) {

            trades.delete(
                symbol
            );

        }

    }

}


/* =====================================================
   TRADE FLOW
===================================================== */

function getTradeFlow(
    symbol
) {

    const list =
        trades.get(
            symbol
        ) || [];


    const cutoff =
        now() -
        TRADE_WINDOW;


    let buy = 0;

    let sell = 0;

    let buyCount = 0;

    let sellCount = 0;


    for (
        let i =
            list.length - 1;

        i >= 0;

        i--
    ) {

        const trade =
            list[i];


        if (
            trade.time <
            cutoff
        )
            break;


        if (
            trade.side ===
            "Buy"
        ) {

            buy +=
                trade.value;

            buyCount++;

        }

        else if (
            trade.side ===
            "Sell"
        ) {

            sell +=
                trade.value;

            sellCount++;

        }

    }


    const total =
        buy + sell;


    const imbalance =
        total > 0

            ? (
                buy - sell
            ) / total

            : 0;


    return {

        buy,

        sell,

        total,

        imbalance,

        buyCount,

        sellCount

    };

}


/* =====================================================
   PRICE CHANGE
===================================================== */

function getPriceChange(
    symbol
) {

    const list =
        trades.get(
            symbol
        ) || [];


    if (
        list.length < 2
    )
        return 0;


    const latest =
        list[
            list.length - 1
        ];


    const cutoff =
        now() -
        PRICE_WINDOW;


    let old = null;


    for (
        let i = 0;

        i < list.length;

        i++
    ) {

        if (
            list[i].time >=
            cutoff
        ) {

            old =
                list[i];

            break;

        }

    }


    if (
        !old ||
        !old.price
    )
        return 0;


    return (
        latest.price -
        old.price
    ) / old.price;

}


/* =====================================================
   LOCAL LIQUIDITY
===================================================== */

function getLocalLiquidity(
    book,
    side,
    currentPrice
) {

    if (
        !book ||
        !currentPrice
    )
        return 1;


    const source =
        side === "Buy"

            ? book.bids

            : book.asks;


    const values = [];


    for (
        const [
            price,
            qty
        ]
        of source
    ) {

        const distance =
            Math.abs(
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance >
            LOCAL_LIQUIDITY_DISTANCE
        )
            continue;


        const value =
            price * qty;


        if (
            value > 0
        ) {

            values.push(
                value
            );

        }

    }


    if (
        values.length === 0
    )
        return 1;


    values.sort(
        (a, b) =>
            a - b
    );


    /*
     * Вместо одной случайной
     * заявки берём медиану.
     */

    const middle =
        Math.floor(
            values.length / 2
        );


    return values[middle];

}


/* =====================================================
   WALL THRESHOLD
===================================================== */

function getWallThreshold(
    symbol,
    side,
    currentPrice,
    book
) {

    const rank =
        symbolRanks.get(
            symbol
        );


    if (!rank)
        return 50000;


    /*
     * TOP-20:
     *
     * динамический порог
     * от локальной ликвидности.
     */

    if (
        rank <= 20
    ) {

        const local =
            getLocalLiquidity(
                book,
                side,
                currentPrice
            );


        let absoluteMinimum =
            TOP20_MIN_ABSOLUTE
                .top6_20;


        if (
            rank <= 5
        ) {

            absoluteMinimum =
                TOP20_MIN_ABSOLUTE
                    .top1_5;

        }


        return Math.max(

            absoluteMinimum,

            local *
            TOP20_MIN_MULTIPLIER

        );

    }


    /*
     * 21-50.
     */

    if (
        rank <= 50
    ) {

        return BASE_THRESHOLDS
            .top21_50;

    }


    /*
     * 51-100.
     */

    return BASE_THRESHOLDS
        .top51_100;

}


/* =====================================================
   FIND WALLS
===================================================== */

function findWalls(
    symbol
) {

    const book =
        books.get(
            symbol
        );


    if (!book)
        return [];


    let currentPrice =
        book.lastPrice;


    if (!currentPrice) {

        updateBookMidPrice(
            book
        );

        currentPrice =
            book.lastPrice;

    }


    if (!currentPrice)
        return [];


    const result = [];


    /*
     * BUY WALLS
     */

    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        const distance =
            (
                currentPrice -
                price
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        const local =
            getLocalLiquidity(
                book,
                "Buy",
                currentPrice
            );


        const ratio =
            value /
            Math.max(
                local,
                1
            );


        const threshold =
            getWallThreshold(
                symbol,
                "Buy",
                currentPrice,
                book
            );


        if (
            value >=
            threshold &&
            ratio >=
            MIN_WALL_RATIO
        ) {

            result.push({

                symbol,

                side: "Buy",

                price,

                qty,

                value,

                distance,

                ratio,

                currentPrice

            });

        }

    }


    /*
     * SELL WALLS
     */

    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        const distance =
            (
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        const local =
            getLocalLiquidity(
                book,
                "Sell",
                currentPrice
            );


        const ratio =
            value /
            Math.max(
                local,
                1
            );


        const threshold =
            getWallThreshold(
                symbol,
                "Sell",
                currentPrice,
                book
            );


        if (
            value >=
            threshold &&
            ratio >=
            MIN_WALL_RATIO
        ) {

            result.push({

                symbol,

                side: "Sell",

                price,

                qty,

                value,

                distance,

                ratio,

                currentPrice

            });

        }

    }


    result.sort(
        (a, b) =>
            b.value -
            a.value
    );


    return result.slice(
        0,
        8
    );

}


/* =====================================================
   WALL KEY
===================================================== */

function getWallKey(
    wall
) {

    return (
        `${wall.symbol}_` +
        `${wall.side}_` +
        `${wall.price}`
    );

}


/* =====================================================
   WALL HISTORY
===================================================== */

function updateWallHistory(
    wall
) {

    const key =
        getWallKey(
            wall
        );


    if (
        !wallHistory.has(
            key
        )
    ) {

        wallHistory.set(
            key,
            {

                firstSeen:
                    now(),

                lastSeen:
                    now(),

                lastValue:
                    wall.value,

                maxValue:
                    wall.value

            }
        );

    }

    else {

        const history =
            wallHistory.get(
                key
            );


        history.lastSeen =
            now();


        history.lastValue =
            wall.value;


        history.maxValue =
            Math.max(
                history.maxValue,
                wall.value
            );

    }


    return wallHistory.get(
        key
    );

}


/* =====================================================
   CLEAN WALL HISTORY
===================================================== */

function cleanupWallHistory() {

    const cutoff =
        now() -
        30000;


    for (
        const [
            key,
            history
        ]
        of wallHistory
    ) {

        if (
            history.lastSeen <
            cutoff
        ) {

            wallHistory.delete(
                key
            );

        }

    }


    /*
     * Дополнительный лимит.
     */

    if (
        wallHistory.size >
        MAX_WALL_HISTORY
    ) {

        const entries =
            [...wallHistory.entries()]
                .sort(
                    (a, b) =>
                        a[1].lastSeen -
                        b[1].lastSeen
                );


        const removeCount =
            wallHistory.size -
            MAX_WALL_HISTORY;


        for (
            let i = 0;

            i < removeCount;

            i++
        ) {

            wallHistory.delete(
                entries[i][0]
            );

        }

    }

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(
    wall,
    flow,
    priceChange,
    age
) {

    let score = 0;


    /*
     * 1. Размер стены.
     *
     * 20 баллов.
     */

    const sizeBase =
        50000;


    const sizeScore =
        Math.min(

            20,

            Math.max(

                0,

                Math.log10(
                    Math.max(
                        wall.value,
                        1
                    ) /
                    sizeBase
                ) * 10

            )

        );


    score +=
        sizeScore;


    /*
     * 2. Относительная сила.
     *
     * 20 баллов.
     */

    const ratioScore =
        Math.min(

            20,

            Math.max(
                0,
                wall.ratio * 4
            )

        );


    score +=
        ratioScore;


    /*
     * 3. Возраст.
     *
     * 15 баллов.
     */

    const ageScore =
        Math.min(
            15,
            age / 1000
        );


    score +=
        ageScore;


    /*
     * 4. Aggressive flow.
     *
     * 25 баллов.
     */

    const alignedFlow =

        wall.side === "Buy"

            ? Math.max(
                0,
                flow.imbalance
            )

            : Math.max(
                0,
                -flow.imbalance
            );


    score +=
        alignedFlow * 25;


    /*
     * 5. Цена.
     *
     * 20 баллов.
     */

    const alignedPrice =

        wall.side === "Buy"

            ? Math.max(
                0,
                priceChange
            )

            : Math.max(
                0,
                -priceChange
            );


    score += Math.min(

        20,

        alignedPrice * 1000

    );


    return Math.round(
        clamp(
            score,
            0,
            100
        )
    );

}


/* =====================================================
   DETERMINE SETUP
===================================================== */

function determineSetup(
    wall,
    flow,
    priceChange
) {

    /*
     * BUY WALL
     */

    if (
        wall.side ===
        "Buy"
    ) {

        /*
         * Покупатели агрессивны,
         * цена не падает.
         */

        if (
            flow.imbalance >=
            0.15 &&
            priceChange >=
            -0.0003
        ) {

            return "LONG";

        }


        /*
         * Продавцы давят,
         * цена идёт вниз.
         */

        if (
            flow.imbalance <=
            -0.20 &&
            priceChange < 0
        ) {

            return "SHORT";

        }

    }


    /*
     * SELL WALL
     */

    if (
        wall.side ===
        "Sell"
    ) {

        /*
         * Продавцы агрессивны,
         * цена падает.
         */

        if (
            flow.imbalance <=
            -0.15 &&
            priceChange <=
            0.0003
        ) {

            return "SHORT";

        }


        /*
         * Покупатели поглощают
         * SELL wall.
         */

        if (
            flow.imbalance >=
            0.20 &&
            priceChange > 0
        ) {

            return "LONG";

        }

    }


    return null;

}


/* =====================================================
   ANALYZE SYMBOL
===================================================== */

function analyzeSymbol(
    symbol
) {

    const book =
        books.get(
            symbol
        );


    if (!book)
        return;


    /*
     * Если стакан давно
     * не обновлялся —
     * пропускаем его.
     */

    if (
        now() -
        book.lastUpdate >
        10000
    ) {

        return;

    }


    const walls =
        findWalls(
            symbol
        );


    if (
        walls.length === 0
    )
        return;


    const flow =
        getTradeFlow(
            symbol
        );


    const priceChange =
        getPriceChange(
            symbol
        );


    for (
        const wall
        of walls
    ) {

        const history =
            updateWallHistory(
                wall
            );


        const age =
            now() -
            history.firstSeen;


        const requiredAge =
            parseInt(
                document
                    .getElementById(
                        "wallAge"
                    )
                    .value
            ) *
            1000;


        /*
         * Стена должна немного
         * прожить, но не 5-10 секунд.
         */

        if (
            age <
            requiredAge
        )
            continue;


        const setup =
            determineSetup(
                wall,
                flow,
                priceChange
            );


        if (!setup)
            continue;


        const score =
            calculateScore(
                wall,
                flow,
                priceChange,
                age
            );


        const minScore =
            parseInt(
                document
                    .getElementById(
                        "minScore"
                    )
                    .value
            );


        if (
            score <
            minScore
        )
            continue;


        const key =
            getWallKey(
                wall
            );


        signals.set(
            key,
            {

                key,

                symbol,

                rank:
                    symbolRanks.get(
                        symbol
                    ),

                setup,

                score,

                wall,

                flow,

                priceChange,

                age,

                updated:
                    now()

            }
        );

    }

}


/* =====================================================
   ANALYZE ALL
===================================================== */

function analyzeAll() {

    if (!running)
        return;


    cleanupTrades();

    cleanupWallHistory();


    for (
        const symbol
        of symbols
    ) {

        analyzeSymbol(
            symbol
        );

    }


    /*
     * Удаляем старые сигналы.
     */

    const expiry =
        now() -
        SIGNAL_EXPIRY;


    for (
        const [
            key,
            signal
        ]
        of signals
    ) {

        if (
            signal.updated <
            expiry
        ) {

            signals.delete(
                key
            );

        }

    }

}

/* =====================================================
   CREATE WS CONNECTION
===================================================== */

function createWSConnection(
    index,
    chunk,
    version
) {

    if (!running)
        return;


    /*
     * Если версия списка монет
     * уже изменилась —
     * старое соединение не нужно.
     */

    if (
        version !==
        symbolsVersion
    )
        return;


    /*
     * Закрываем только
     * конкретное соединение.
     */

    const existing =
        wsConnections[index];


    if (
        existing &&
        existing.ws
    ) {

        try {

            existing.ws.onclose =
                null;

            existing.ws.onerror =
                null;

            existing.ws.close();

        } catch (e) {}

    }


    if (
        pingTimers[index]
    ) {

        clearInterval(
            pingTimers[index]
        );

        pingTimers[index] =
            null;

    }


    const state = {

        index,

        ws: null,

        generation:
            (existing?.generation || 0) + 1,

        version,

        manualClose: false

    };


    wsConnections[index] =
        state;


    const generation =
        state.generation;


    const ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    state.ws =
        ws;


    ws.onopen = () => {

        /*
         * Проверяем, что это
         * ещё актуальное соединение.
         */

        if (
            wsConnections[index] !==
            state ||
            state.generation !==
            generation
        ) {

            try {
                ws.close();
            } catch (e) {}

            return;

        }


        const args = [];


        for (
            const symbol
            of chunk
        ) {

            args.push(
                `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );

            args.push(
                `publicTrade.${symbol}`
            );

        }


        /*
         * Отправляем подписку.
         */

        if (
            ws.readyState ===
            WebSocket.OPEN
        ) {

            ws.send(
                JSON.stringify({

                    req_id:
                        `scanner_${index}_${generation}`,

                    op:
                        "subscribe",

                    args

                })
            );

        }


        /*
         * Heartbeat.
         */

        pingTimers[index] =
            setInterval(
                () => {

                    if (
                        ws.readyState ===
                        WebSocket.OPEN
                    ) {

                        try {

                            ws.send(
                                JSON.stringify({
                                    op: "ping"
                                })
                            );

                        } catch (error) {

                            console.error(
                                `WS ${index + 1} ping error`,
                                error
                            );

                        }

                    }

                },
                PING_INTERVAL
            );


        updateWSStatus();


        statusEl.innerText =
            "Сканирование активно";


        statusEl.style.color =
            "#27ae60";

    };


    ws.onmessage =
        event => {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                /*
                 * Проверяем актуальность
                 * соединения.
                 */

                if (
                    wsConnections[index] !==
                    state
                )
                    return;


                /*
                 * PONG.
                 */

                if (
                    data.op ===
                    "pong"
                ) {

                    return;

                }


                /*
                 * SUBSCRIBE response.
                 */

                if (
                    data.op ===
                    "subscribe"
                ) {

                    if (
                        data.success === false
                    ) {

                        console.error(
                            `WS ${index + 1} subscription error:`,
                            data
                        );

                    }

                    return;

                }


                if (
                    !data.topic
                )
                    return;


                /*
                 * ORDERBOOK.
                 */

                if (
                    data.topic.startsWith(
                        "orderbook."
                    )
                ) {

                    const parts =
                        data.topic.split(
                            "."
                        );


                    const symbol =
                        parts[2];


                    if (
                        data.type ===
                        "snapshot"
                    ) {

                        applySnapshot(
                            symbol,
                            data.data
                        );

                    }

                    else if (
                        data.type ===
                        "delta"
                    ) {

                        applyDelta(
                            symbol,
                            data.data
                        );

                    }

                    lastUpdateEl.innerText =
                        new Date()
                            .toLocaleTimeString();

                }


                /*
                 * PUBLIC TRADES.
                 */

                else if (
                    data.topic.startsWith(
                        "publicTrade."
                    )
                ) {

                    processTrade(
                        data.data
                    );

                }

            }

            catch (error) {

                console.error(
                    `WS ${index + 1} message error:`,
                    error
                );

            }

        };


    ws.onerror =
        error => {

            console.error(
                `WS ${index + 1} error:`,
                error
            );

        };


    ws.onclose =
        () => {

            /*
             * Не даём старому сокету
             * закрыть состояние нового.
             */

            if (
                wsConnections[index] !==
                state
            ) {

                return;

            }


            if (
                pingTimers[index]
            ) {

                clearInterval(
                    pingTimers[index]
                );

                pingTimers[index] =
                    null;

            }


            updateWSStatus();


            if (!running)
                return;


            /*
             * Защита от двойного
             * reconnect.
             */

            if (
                reconnectTimers[index]
            ) {

                return;

            }


            statusEl.innerText =
                `Переподключение WS ${index + 1}...`;

            statusEl.style.color =
                "#f7931a";


            reconnectTimers[index] =
                setTimeout(
                    () => {

                        reconnectTimers[index] =
                            null;


                        if (
                            !running
                        )
                            return;


                        if (
                            version !==
                            symbolsVersion
                        )
                            return;


                        createWSConnection(
                            index,
                            chunk,
                            version
                        );

                    },
                    RECONNECT_DELAY
                );

        };

}


/* =====================================================
   START ALL WEBSOCKETS
===================================================== */

function startWebSockets() {

    /*
     * Сначала закрываем старые
     * reconnect timers.
     */

    for (
        let i = 0;

        i <
        reconnectTimers.length;

        i++
    ) {

        if (
            reconnectTimers[i]
        ) {

            clearTimeout(
                reconnectTimers[i]
            );

            reconnectTimers[i] =
                null;

        }

    }


    /*
     * Создаём новую версию.
     */

    symbolsVersion++;


    const version =
        symbolsVersion;


    /*
     * Разбиваем TOP-100
     * на 4 группы.
     */

    const chunks = [];


    for (
        let i = 0;

        i <
        WS_CONNECTIONS;

        i++
    ) {

        const start =
            i *
            SYMBOLS_PER_WS;


        const end =
            Math.min(
                start +
                SYMBOLS_PER_WS,
                symbols.length
            );


        chunks.push(
            symbols.slice(
                start,
                end
            )
        );

    }


    /*
     * Создаём 4 WS.
     */

    for (
        let i = 0;

        i <
        WS_CONNECTIONS;

        i++
    ) {

        const chunk =
            chunks[i] || [];


        if (
            chunk.length === 0
        )
            continue;


        /*
         * Небольшая задержка
         * между созданием соединений.
         */

        setTimeout(
            () => {

                if (
                    running &&
                    version ===
                    symbolsVersion
                ) {

                    createWSConnection(
                        i,
                        chunk,
                        version
                    );

                }

            },
            i * 250
        );

    }

}


/* =====================================================
   STOP ALL WEBSOCKETS
===================================================== */

function stopWebSockets() {

    /*
     * Сначала запрещаем
     * reconnect.
     */

    for (
        let i = 0;

        i <
        reconnectTimers.length;

        i++
    ) {

        if (
            reconnectTimers[i]
        ) {

            clearTimeout(
                reconnectTimers[i]
            );

            reconnectTimers[i] =
                null;

        }

    }


    /*
     * Останавливаем ping.
     */

    for (
        let i = 0;

        i <
        pingTimers.length;

        i++
    ) {

        if (
            pingTimers[i]
        ) {

            clearInterval(
                pingTimers[i]
            );

            pingTimers[i] =
                null;

        }

    }


    /*
     * Закрываем все WS.
     */

    for (
        const state
        of wsConnections
    ) {

        if (
            state &&
            state.ws
        ) {

            try {

                state.ws.onclose =
                    null;

                state.ws.onerror =
                    null;

                state.ws.close();

            }

            catch (e) {}

        }

    }


    wsConnections =
        [];

    reconnectTimers =
        [];

    pingTimers =
        [];


    updateWSStatus();

}

                {
                    cache:
                        "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Invalid Bybit response"
            );

        }


        const list =
            json.result.list

                .filter(
                    item => {

                        return (

                            item.symbol &&

                            item.symbol
                                .endsWith(
                                    "USDT"
                                ) &&

                            parseFloat(
                                item.turnover24h
                            ) > 0

                        );

                    }
                )

                .sort(
                    (a, b) =>

                        parseFloat(
                            b.turnover24h
                        ) -

                        parseFloat(
                            a.turnover24h
                        )

                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        if (
            list.length === 0
        ) {

            throw new Error(
                "TOP-100 is empty"
            );

        }


        symbols.length =
            0;


        symbolRanks.clear();


        list.forEach(
            (
                item,
                index
            ) => {

                symbols.push(
                    item.symbol
                );


                symbolRanks.set(
                    item.symbol,
                    index + 1
                );

            }
        );


        coinCountEl.innerText =
            symbols.length;


        return true;

    }

    catch (error) {

        console.error(
            "TOP loading error:",
            error
        );


        statusEl.innerText =
            "Ошибка загрузки TOP";

        statusEl.style.color =
            "#e74c3c";


        return false;

    }

}


/* =====================================================
   REFRESH SYMBOLS
===================================================== */

async function refreshSymbols() {

    if (!running)
        return;


    const oldSymbols =
        [...symbols];


    const success =
        await loadSymbols();


    if (!success)
        return;


    /*
     * Проверяем, изменился ли
     * состав TOP.
     */

    const changed =
        oldSymbols.length !==
        symbols.length ||

        oldSymbols.some(
            (
                symbol,
                index
            ) =>
                symbol !==
                symbols[index]
        );


    if (!changed) {

        statusEl.innerText =
            "Сканирование активно";

        statusEl.style.color =
            "#27ae60";

        return;

    }


    /*
     * Если TOP реально изменился,
     * только тогда пересоздаём WS.
     */

    books.clear();

    trades.clear();

    wallHistory.clear();

    signals.clear();


    stopWebSockets();

    startWebSockets();

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner() {

    if (running)
        return;


    running = true;


    /*
     * Начальная загрузка.
     */

    const success =
        await loadSymbols();


    if (!success) {

        running = false;

        return;

    }


    /*
     * Чистое состояние.
     */

    books.clear();

    trades.clear();

    wallHistory.clear();

    signals.clear();


    /*
     * Запуск WebSocket.
     */

    startWebSockets();


    /*
     * Анализ.
     */

    analysisTimer =
        setInterval(
            analyzeAll,
            ANALYSIS_INTERVAL
        );


    /*
     * UI.
     */

    uiTimer =
        setInterval(
            renderSignals,
            UI_INTERVAL
        );


    /*
     * TOP refresh.
     */

    symbolRefreshTimer =
        setInterval(
            refreshSymbols,
            SYMBOL_REFRESH
        );


    statusEl.innerText =
        "Сканирование активно";

    statusEl.style.color =
        "#27ae60";

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner() {

    running = false;


    if (
        analysisTimer
    ) {

        clearInterval(
            analysisTimer
        );

        analysisTimer =
            null;

    }


    if (
        uiTimer
    ) {

        clearInterval(
            uiTimer
        );

        uiTimer =
            null;

    }


    if (
        symbolRefreshTimer
    ) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer =
            null;

    }


    stopWebSockets();


    books.clear();

    trades.clear();

    wallHistory.clear();

    signals.clear();


    statusEl.innerText =
        "Остановлен";

    statusEl.style.color =
        "#848e9c";


    renderSignals();

}


/* =====================================================
   CLEAR SIGNALS
===================================================== */

function clearSignals() {

    signals.clear();

    renderSignals();

}


/* =====================================================
   INITIALIZATION
===================================================== */

renderSignals();


console.log(
    "🐋 Bybit Whale Flow Scanner"
);

console.log(
    "TOP:",
    MAX_SYMBOLS
);

console.log(
    "WebSockets:",
    WS_CONNECTIONS
);

console.log(
    "Symbols per WS:",
    SYMBOLS_PER_WS
);

console.log(
    "OrderBook depth:",
    ORDERBOOK_DEPTH
);

console.log(
    "Dynamic TOP-20 thresholds: ON"
);

console.log(
    "WebSocket reconnect protection: ON"
);

console.log(
    "Heartbeat: 20 seconds"
);
