<script>

/* =====================================================
   CONFIG
===================================================== */

const MAX_SYMBOLS = 100;

const ORDERBOOK_DEPTH = 50;

const ANALYSIS_INTERVAL = 500;

const UI_INTERVAL = 500;

const SYMBOL_REFRESH =
    5 * 60 * 1000;


/*
 * Максимальное расстояние,
 * на котором ищем стены.
 */

const MAX_WALL_DISTANCE = 0.008;


/*
 * Локальная ликвидность:
 * ±0.30%
 */

const LOCAL_LIQUIDITY_DISTANCE = 0.003;


/*
 * Минимальный возраст стены.
 */

const MIN_WALL_AGE = 4000;


/*
 * Сколько секунд держим
 * историю сделок.
 */

const TRADE_WINDOW = 10000;

const PRICE_WINDOW = 60000;


/*
 * Стена должна занимать
 * существенную часть стакана.
 */

const MIN_WALL_SHARE = 0.10;


/*
 * Минимальная доля стены
 * для сильной ситуации.
 */

const STRONG_WALL_SHARE = 0.18;


/*
 * Насколько близко должна быть
 * цена к стене для WATCH.
 */

const DEFAULT_WATCH_DISTANCE = 0.0015;


/*
 * После касания ждём
 * подтверждение отбоя.
 */

const REJECTION_WINDOW = 8000;


/*
 * Максимальный пробой уровня,
 * после которого ситуация отменяется.
 */

const LEVEL_BREAK_DISTANCE = 0.001;


/* =====================================================
   STATE
===================================================== */

let ws = null;

let running = false;

let reconnectTimer = null;

let symbolRefreshTimer = null;

let analysisTimer = null;

let uiTimer = null;

let pingTimer = null;


/*
 * TOP монеты
 */

const symbols = [];

const symbolRanks = new Map();


/*
 * Order books
 */

const books = new Map();


/*
 * Trades
 */

const trades = new Map();


/*
 * История стен
 */

const wallHistory = new Map();


/*
 * Торговые ситуации
 */

const setups = new Map();


/* =====================================================
   DOM
===================================================== */

const statusEl =
    document.getElementById(
        "status"
    );

const wsEl =
    document.getElementById(
        "wsStatus"
    );

const coinCountEl =
    document.getElementById(
        "coinCount"
    );

const candidateCountEl =
    document.getElementById(
        "candidateCount"
    );

const signalCountEl =
    document.getElementById(
        "signalCount"
    );

const signalsEl =
    document.getElementById(
        "signals"
    );


/* =====================================================
   HELPERS
===================================================== */

function now() {

    return Date.now();

}


function money(value) {

    return Number(value)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 0
            }
        );

}


function priceFormat(value) {

    const n =
        Number(value);

    if (n >= 1000)
        return n.toFixed(2);

    if (n >= 1)
        return n.toFixed(4);

    if (n >= 0.01)
        return n.toFixed(6);

    return n.toFixed(8);

}


function pct(value) {

    return (
        value * 100
    ).toFixed(2) + "%";

}


/* =====================================================
   DYNAMIC THRESHOLD
===================================================== */


/*
 * Порог самой стены.
 *
 * Мы НЕ используем один
 * $250k для всех монет.
 */

function getMinimumWall(
    symbol,
    localLiquidity
) {

    const rank =
        symbolRanks.get(
            symbol
        ) || 100;


    /*
     * Стена должна быть
     * минимум 10% локальной
     * ликвидности.
     */

    let threshold =
        localLiquidity *
        MIN_WALL_SHARE;


    /*
     * Минимумы в зависимости
     * от ранга.
     */

    let rankMinimum;


    if (rank <= 5) {

        rankMinimum = 100000;

    }

    else if (rank <= 20) {

        rankMinimum = 50000;

    }

    else if (rank <= 50) {

        rankMinimum = 25000;

    }

    else {

        rankMinimum = 10000;

    }


    threshold =
        Math.max(
            threshold,
            rankMinimum
        );


    return threshold;

}


/* =====================================================
   BOOK
===================================================== */

function createBook(symbol) {

    books.set(
        symbol,
        {
            bids: new Map(),
            asks: new Map(),
            lastPrice: null
        }
    );

}


/* =====================================================
   SNAPSHOT
===================================================== */

function applySnapshot(
    symbol,
    data
) {

    createBook(symbol);

    const book =
        books.get(symbol);


    if (Array.isArray(data.b)) {

        for (const row of data.b) {

            const price =
                Number(row[0]);

            const qty =
                Number(row[1]);


            if (
                price > 0 &&
                qty > 0
            ) {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (Array.isArray(data.a)) {

        for (const row of data.a) {

            const price =
                Number(row[0]);

            const qty =
                Number(row[1]);


            if (
                price > 0 &&
                qty > 0
            ) {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }

}


/* =====================================================
   DELTA
===================================================== */

function applyDelta(
    symbol,
    data
) {

    const book =
        books.get(symbol);


    if (!book)
        return;


    if (Array.isArray(data.b)) {

        for (const row of data.b) {

            const price =
                Number(row[0]);

            const qty =
                Number(row[1]);


            if (qty === 0) {

                book.bids.delete(
                    price
                );

            } else {

                book.bids.set(
                    price,
                    qty
                );

            }

        }

    }


    if (Array.isArray(data.a)) {

        for (const row of data.a) {

            const price =
                Number(row[0]);

            const qty =
                Number(row[1]);


            if (qty === 0) {

                book.asks.delete(
                    price
                );

            } else {

                book.asks.set(
                    price,
                    qty
                );

            }

        }

    }

}


/* =====================================================
   TRADES
===================================================== */

function processTrade(data) {

    if (!Array.isArray(data))
        return;


    for (const trade of data) {

        const symbol =
            trade.s;

        const side =
            trade.S;

        const price =
            Number(trade.p);

        const qty =
            Number(trade.v);

        const timestamp =
            Number(trade.T) ||
            now();


        if (
            !symbol ||
            !price ||
            !qty
        )
            continue;


        const value =
            price * qty;


        if (!trades.has(symbol)) {

            trades.set(
                symbol,
                []
            );

        }


        const list =
            trades.get(symbol);


        list.push({

            time: timestamp,

            side,

            price,

            qty,

            value

        });


        const book =
            books.get(symbol);


        if (book) {

            book.lastPrice =
                price;

        }


        const cutoff =
            now() -
            PRICE_WINDOW;


        while (
            list.length &&
            list[0].time <
            cutoff
        ) {

            list.shift();

        }

    }

}


/* =====================================================
   TRADE FLOW
===================================================== */

function getTradeFlow(symbol) {

    const list =
        trades.get(symbol) ||
        [];


    const cutoff =
        now() -
        TRADE_WINDOW;


    let buy = 0;

    let sell = 0;


    for (
        let i = list.length - 1;
        i >= 0;
        i--
    ) {

        const t =
            list[i];


        if (
            t.time <
            cutoff
        )
            break;


        if (
            t.side === "Buy"
        ) {

            buy += t.value;

        }

        else {

            sell += t.value;

        }

    }


    const total =
        buy + sell;


    const imbalance =
        total > 0
            ? (buy - sell) / total
            : 0;


    return {

        buy,
        sell,
        total,
        imbalance

    };

}


/* =====================================================
   PRICE CHANGE
===================================================== */

function getPriceChange(symbol) {

    const list =
        trades.get(symbol) ||
        [];


    if (
        list.length < 2
    )
        return 0;


    const latest =
        list[list.length - 1];


    const cutoff =
        now() -
        PRICE_WINDOW;


    let old = null;


    for (
        let i = 0;
        i < list.length;
        i++
    ) {

        if (
            list[i].time >=
            cutoff
        ) {

            old =
                list[i];

            break;

        }

    }


    if (
        !old ||
        !old.price
    )
        return 0;


    return (
        latest.price -
        old.price
    ) / old.price;

}


/* =====================================================
   CURRENT PRICE
===================================================== */

function getCurrentPrice(book) {

    if (
        book &&
        book.lastPrice
    ) {

        return book.lastPrice;

    }


    if (
        !book
    )
        return null;


    const bids =
        [...book.bids.keys()]
            .sort(
                (a, b) => b - a
            );

    const asks =
        [...book.asks.keys()]
            .sort(
                (a, b) => a - b
            );


    if (
        bids.length &&
        asks.length
    ) {

        return (
            bids[0] +
            asks[0]
        ) / 2;

    }


    return null;

}


/* =====================================================
   LOCAL LIQUIDITY
===================================================== */


/*
 * Суммируем реальную
 * ликвидность вокруг цены.
 *
 * Важно:
 * это НЕ размер одной заявки.
 */

function getLocalLiquidity(
    book,
    currentPrice
) {

    if (
        !book ||
        !currentPrice
    ) {

        return {

            bid: 0,

            ask: 0,

            total: 0

        };

    }


    let bid = 0;

    let ask = 0;


    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        const distance =
            Math.abs(
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance <=
            LOCAL_LIQUIDITY_DISTANCE
        ) {

            bid +=
                price * qty;

        }

    }


    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        const distance =
            Math.abs(
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance <=
            LOCAL_LIQUIDITY_DISTANCE
        ) {

            ask +=
                price * qty;

        }

    }


    return {

        bid,

        ask,

        total:
            bid + ask

    };

}


/* =====================================================
   FIND WALLS
===================================================== */

function findWalls(symbol) {

    const book =
        books.get(symbol);


    if (!book)
        return [];


    const currentPrice =
        getCurrentPrice(book);


    if (!currentPrice)
        return [];


    const liquidity =
        getLocalLiquidity(
            book,
            currentPrice
        );


    /*
     * Жёсткий фильтр:
     *
     * если вся локальная
     * ликвидность < $10k
     *
     * монета не интересует.
     */

    const minimumLiquidity =
        Number(
            document
                .getElementById(
                    "minLiquidity"
                )
                .value
        );


    if (
        liquidity.total <
        minimumLiquidity
    ) {

        return [];

    }


    const result = [];


    const threshold =
        getMinimumWall(
            symbol,
            liquidity.total
        );


    /*
     * BUY WALL
     */

    for (
        const [
            price,
            qty
        ]
        of book.bids
    ) {

        const distance =
            (
                currentPrice -
                price
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        const share =
            liquidity.total > 0
                ? value /
                  liquidity.total
                : 0;


        if (
            value >= threshold &&
            share >= MIN_WALL_SHARE
        ) {

            result.push({

                symbol,

                side: "Buy",

                price,

                qty,

                value,

                distance,

                share,

                currentPrice,

                liquidity

            });

        }

    }


    /*
     * SELL WALL
     */

    for (
        const [
            price,
            qty
        ]
        of book.asks
    ) {

        const distance =
            (
                price -
                currentPrice
            ) /
            currentPrice;


        if (
            distance < 0 ||
            distance >
            MAX_WALL_DISTANCE
        )
            continue;


        const value =
            price * qty;


        const share =
            liquidity.total > 0
                ? value /
                  liquidity.total
                : 0;


        if (
            value >= threshold &&
            share >= MIN_WALL_SHARE
        ) {

            result.push({

                symbol,

                side: "Sell",

                price,

                qty,

                value,

                distance,

                share,

                currentPrice,

                liquidity

            });

        }

    }


    result.sort(
        (a, b) => {

            /*
             * Сначала учитываем
             * относительную силу стены.
             */

            const sa =
                a.share * 100 +
                a.value / 1000000;

            const sb =
                b.share * 100 +
                b.value / 1000000;


            return sb - sa;

        }
    );


    return result.slice(
        0,
        8
    );

}


/* =====================================================
   WALL HISTORY
===================================================== */

function updateWallHistory(wall) {

    /*
     * Цена уровня округляется
     * чтобы небольшое изменение
     * количества не создавало
     * новый уровень.
     */

    const key =
        `${wall.symbol}_${wall.side}_${wall.price}`;


    if (
        !wallHistory.has(key)
    ) {

        wallHistory.set(
            key,
            {

                firstSeen: now(),

                lastSeen: now(),

                lastValue:
                    wall.value,

                maxValue:
                    wall.value,

                touches: 0,

                lastPrice:
                    wall.currentPrice,

                minPrice:
                    wall.currentPrice,

                maxPrice:
                    wall.currentPrice

            }
        );

    }


    const history =
        wallHistory.get(key);


    history.lastSeen =
        now();


    history.lastValue =
        wall.value;


    history.maxValue =
        Math.max(
            history.maxValue,
            wall.value
        );


    history.lastPrice =
        wall.currentPrice;


    history.minPrice =
        Math.min(
            history.minPrice,
            wall.currentPrice
        );


    history.maxPrice =
        Math.max(
            history.maxPrice,
            wall.currentPrice
        );


    return history;

}


/* =====================================================
   WALL EXISTS
===================================================== */

function wallStillExists(
    setup
) {

    const book =
        books.get(
            setup.symbol
        );


    if (!book)
        return false;


    const source =
        setup.side === "Buy"
            ? book.bids
            : book.asks;


    const qty =
        source.get(
            setup.wallPrice
        );


    if (!qty)
        return false;


    const value =
        setup.wallPrice *
        qty;


    /*
     * Если стена уменьшилась
     * более чем на 65%,
     * считаем её исчезнувшей.
     */

    if (
        value <
        setup.initialWallValue *
        0.35
    ) {

        return false;

    }


    return true;

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(
    wall,
    flow,
    rejection
) {

    let score = 0;


    /*
     * Размер.
     */

    const size =
        Math.min(
            25,
            Math.log10(
                Math.max(
                    wall.value,
                    1
                ) /
                10000
            ) * 12
        );


    score +=
        Math.max(
            0,
            size
        );


    /*
     * Доля локальной
     * ликвидности.
     */

    const shareScore =
        Math.min(
            25,
            wall.share * 100
        );


    score +=
        shareScore;


    /*
     * Возраст.
     */

    const age =
        wall.age / 1000;


    score +=
        Math.min(
            15,
            age
        );


    /*
     * Поглощение.
     */

    score +=
        Math.min(
            20,
            Math.abs(
                flow.imbalance
            ) * 40
        );


    /*
     * Реакция цены.
     */

    score +=
        Math.min(
            15,
            rejection * 10000
        );


    return Math.min(
        100,
        Math.round(score)
    );

}


/* =====================================================
   CREATE / UPDATE SETUP
===================================================== */

function getSetupKey(wall) {

    return (
        wall.symbol +
        "_" +
        wall.side +
        "_" +
        wall.price
    );

}


/* =====================================================
   ANALYZE WALL
===================================================== */

function analyzeWall(wall) {

    const key =
        getSetupKey(wall);


    const history =
        updateWallHistory(wall);


    const age =
        now() -
        history.firstSeen;


    wall.age =
        age;


    /*
     * Слишком свежая стена.
     */

    if (
        age <
        MIN_WALL_AGE
    ) {

        return;

    }


    /*
     * Если уже есть сетап,
     * обновляем его.
     */

    let setup =
        setups.get(key);


    if (!setup) {

        setup = {

            key,

            symbol:
                wall.symbol,

            side:
                wall.side,

            wallPrice:
                wall.price,

            initialWallValue:
                wall.value,

            state:
                "WATCH",

            created:
                now(),

            touched:
                false,

            rejection:
                0,

            score:
                0,

            lastUpdate:
                now(),

            wall,

            flow:
                null,

            liquidity:
                wall.liquidity

        };


        setups.set(
            key,
            setup
        );

    }


    setup.wall =
        wall;

    setup.lastUpdate =
        now();


    const flow =
        getTradeFlow(
            wall.symbol
        );


    setup.flow =
        flow;


    const currentPrice =
        wall.currentPrice;


    const distance =
        wall.distance;


    /*
     * WATCH distance.
     */

    const watchDistance =
        Number(
            document
                .getElementById(
                    "watchDistance"
                )
                .value
        );


    /*
     * Цена рядом со стеной.
     */

    if (
        distance <=
        watchDistance
    ) {

        setup.touched =
            true;

    }


    /*
     * BUY WALL
     *
     * Для LONG нам нужны:
     *
     * 1. цена рядом с BUY wall
     * 2. агрессивные продажи
     * 3. цена не пробивает стену
     * 4. затем появляется рост
     */

    if (
        wall.side === "Buy"
    ) {

        const levelBreak =
            (
                wall.price -
                currentPrice
            ) /
            wall.price;


        /*
         * Цена ниже стены.
         */

        if (
            levelBreak >
            LEVEL_BREAK_DISTANCE
        ) {

            setup.state =
                "CANCELLED";

            setup.cancelReason =
                "BUY wall пробита";


            return;

        }


        /*
         * Продавцы атакуют стену.
         */

        const sellingPressure =
            flow.imbalance <
            -0.12;


        /*
         * Появляется восстановление.
         */

        const recovery =
            flow.imbalance >
            -0.05;


        /*
         * Цена начинает расти.
         */

        const priceChange =
            getPriceChange(
                wall.symbol
            );


        const priceRecovery =
            priceChange >
            0.00015;


        /*
         * Сначала должно быть
         * давление продавцов.
         */

        if (
            setup.touched &&
            sellingPressure
        ) {

            setup.state =
                "ABSORBING";

        }


        /*
         * После давления —
         * восстановление.
         */

        if (
            setup.touched &&
            setup.state ===
            "ABSORBING" &&
            recovery &&
            priceRecovery
        ) {

            setup.state =
                "ENTRY";

            setup.direction =
                "LONG";

            setup.rejection =
                priceChange;

        }

    }


    /*
     * SELL WALL
     *
     * Для SHORT:
     *
     * агрессивные покупки
     * бьют в стену,
     * цена не проходит,
     * появляется снижение.
     */

    if (
        wall.side === "Sell"
    ) {

        const levelBreak =
            (
                currentPrice -
                wall.price
            ) /
            wall.price;


        if (
            levelBreak >
            LEVEL_BREAK_DISTANCE
        ) {

            setup.state =
                "CANCELLED";

            setup.cancelReason =
                "SELL wall пробита";


            return;

        }


        const buyingPressure =
            flow.imbalance >
            0.12;


        const rejection =
            flow.imbalance <
            0.05;


        const priceChange =
            getPriceChange(
                wall.symbol
            );


        const priceDrop =
            priceChange <
            -0.00015;


        if (
            setup.touched &&
            buyingPressure
        ) {

            setup.state =
                "ABSORBING";

        }


        if (
            setup.touched &&
            setup.state ===
            "ABSORBING" &&
            rejection &&
            priceDrop
        ) {

            setup.state =
                "ENTRY";

            setup.direction =
                "SHORT";

            setup.rejection =
                Math.abs(
                    priceChange
                );

        }

    }


    /*
     * ENTRY не должен жить вечно.
     */

    if (
        setup.state ===
        "ENTRY"
    ) {

        if (
            now() -
            setup.created >
            REJECTION_WINDOW
        ) {

            /*
             * После подтверждённого
             * входа оставляем ACTIVE.
             */

            setup.state =
                "ACTIVE";

        }

    }


    /*
     * Score.
     */

    setup.score =
        calculateScore(
            wall,
            flow,
            setup.rejection || 0
        );


    /*
     * Если score слишком маленький,
     * ENTRY не показываем.
     */

    const minScore =
        Number(
            document
                .getElementById(
                    "minScore"
                )
                .value
        );


    if (
        (
            setup.state ===
            "ENTRY"
        ) &&
        setup.score <
        minScore
    ) {

        setup.state =
            "ABSORBING";

    }

}


/* =====================================================
   ANALYZE ALL
===================================================== */

function analyzeAll() {

    if (!running)
        return;


    /*
     * Сначала находим
     * актуальные стены.
     */

    for (
        const symbol
        of symbols
    ) {

        const walls =
            findWalls(symbol);


        for (
            const wall
            of walls
        ) {

            analyzeWall(
                wall
            );

        }

    }


    /*
     * Проверяем старые ситуации.
     */

    for (
        const [
            key,
            setup
        ]
        of setups
    ) {

        if (
            setup.state ===
            "CANCELLED"
        )
            continue;


        /*
         * Стена исчезла.
         */

        if (
            !wallStillExists(
                setup
            )
        ) {

            setup.state =
                "CANCELLED";

            setup.cancelReason =
                "Стена исчезла";


            continue;

        }


        /*
         * WATCH/ABSORBING
         * не держим бесконечно.
         */

        if (
            now() -
            setup.created >
            30000 &&
            (
                setup.state ===
                "WATCH" ||
                setup.state ===
                "ABSORBING"
            )
        ) {

            setups.delete(
                key
            );

        }

    }

}


/* =====================================================
   STATE TEXT
===================================================== */

function getStateText(
    setup
) {

    if (
        setup.state ===
        "WATCH"
    ) {

        return "🟡 WATCH";

    }


    if (
        setup.state ===
        "ABSORBING"
    ) {

        return "🟠 ПОГЛОЩЕНИЕ";

    }


    if (
        setup.state ===
        "ENTRY"
    ) {

        return setup.direction ===
            "LONG"
                ? "🟢 LONG ENTRY"
                : "🔴 SHORT ENTRY";

    }


    if (
        setup.state ===
        "ACTIVE"
    ) {

        return setup.direction ===
            "LONG"
                ? "🟢 LONG ACTIVE"
                : "🔴 SHORT ACTIVE";

    }


    if (
        setup.state ===
        "CANCELLED"
    ) {

        return "⚪ CANCELLED";

    }


    return setup.state;

}


/* =====================================================

        [...setups.values()]

            .sort(

                    const priority = {

                        ENTRY: 5,

                        ACTIVE: 4,

                        ABSORBING: 3,

                        WATCH: 2

                    };


                    const pa =
                        priority[
                            a.state
                        ] || 0;

                    const pb =
                        priority[
                            b.state
                        ] || 0;


                    if (
                        pa !== pb
                    )
                        return pb - pa;

                        b.score -
                        a.score
                    );

/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket() {

    if (!running)
        return;


    if (ws) {

        try {
            ws.close();
        } catch (e) {}

    }


    ws =
        new WebSocket(
            "wss://stream.bybit.com/v5/public/linear"
        );


    ws.onopen = () => {

        wsEl.innerText =
            "ON";

        wsEl.className =
            "stat-value green";


        statusEl.innerText =
            "Сканирование активно";

        statusEl.style.color =
            "#27ae60";


        const args = [];


        for (
            const symbol
            of symbols
        ) {

            args.push(
                `orderbook.${ORDERBOOK_DEPTH}.${symbol}`
            );

            args.push(
                `publicTrade.${symbol}`
            );

        }


        /*
         * Отправляем подписку.
         */

        ws.send(
            JSON.stringify({

                op: "subscribe",

                args

            })
        );

    };


    ws.onmessage = event => {

        try {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.op ===
                "pong"
            )
                return;


            if (
                !data.topic
            )
                return;


            /*
             * ORDERBOOK
             */

            if (
                data.topic
                    .startsWith(
                        "orderbook."
                    )
            ) {

                const parts =
                    data.topic
                        .split(".");


                const symbol =
                    parts[2];


                if (
                    data.type ===
                    "snapshot"
                ) {

                    applySnapshot(
                        symbol,
                        data.data
                    );

                }

                else if (
                    data.type ===
                    "delta"
                ) {

                    applyDelta(
                        symbol,
                        data.data
                    );

                }

            }


            /*
             * TRADES
             */

            else if (
                data.topic
                    .startsWith(
                        "publicTrade."
                    )
            ) {

                processTrade(
                    data.data
                );

            }

        }

        catch (error) {

            console.error(
                "WS error:",
                error
            );

        }

    };


    ws.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );


        wsEl.innerText =
            "ERROR";

        wsEl.className =
            "stat-value red";

    };


    ws.onclose = () => {

        wsEl.innerText =
            "OFF";

        wsEl.className =
            "stat-value red";


        if (running) {

            statusEl.innerText =
                "Переподключение...";

            statusEl.style.color =
                "#f7931a";


            reconnectTimer =
                setTimeout(
                    connectWebSocket,
                    3000
                );

        }

    };

}


/* =====================================================
   PING
===================================================== */

function startPing() {

    if (pingTimer)
        return;


    pingTimer =
        setInterval(
            () => {

                if (
                    ws &&
                    ws.readyState ===
                    WebSocket.OPEN
                ) {

                    ws.send(
                        JSON.stringify({
                            op: "ping"
                        })
                    );

                }

            },
            20000
        );

}


/* =====================================================
   LOAD TOP 100
===================================================== */

async function loadSymbols() {

    try {

        statusEl.innerText =
            "Загрузка TOP-100...";

        statusEl.style.color =
            "#f7931a";


        const response =
            await fetch(

                "https://api.bybit.com/v5/market/tickers?category=linear"

            );


        const json =
            await response.json();


        if (
            !json.result ||
            !Array.isArray(
                json.result.list
            )
        ) {

            throw new Error(
                "Invalid Bybit response"
            );

        }


        const list =
            json.result.list

                .filter(
                    item => {

                        return (

                            item.symbol &&

                            item.symbol
                                .endsWith(
                                    "USDT"
                                ) &&

                            Number(
                                item.turnover24h
                            ) > 0

                        );

                    }
                )

                .sort(
                    (a, b) => {

                        return (
                            Number(
                                b.turnover24h
                            ) -
                            Number(
                                a.turnover24h
                            )
                        );

                    }
                )

                .slice(
                    0,
                    MAX_SYMBOLS
                );


        symbols.length = 0;

        symbolRanks.clear();


        list.forEach(
            (item, index) => {

                symbols.push(
                    item.symbol
                );


                symbolRanks.set(
                    item.symbol,
                    index + 1
                );

            }
        );


        coinCountEl.innerText =
            symbols.length;


        return true;

    }

    catch (error) {

        console.error(
            "TOP error:",
            error
        );


        statusEl.innerText =
            "Ошибка загрузки TOP";

        statusEl.style.color =
            "#e74c3c";


        return false;

    }

}


/* =====================================================
   START
===================================================== */

async function startScanner() {

    if (running)
        return;


    running = true;


    const success =
        await loadSymbols();


    if (!success) {

        running = false;

        return;

    }


    books.clear();

    trades.clear();

    wallHistory.clear();

    setups.clear();


    connectWebSocket();

    startPing();


    analysisTimer =
        setInterval(
            analyzeAll,
            ANALYSIS_INTERVAL
        );


    uiTimer =
        setInterval(
            renderSignals,
            UI_INTERVAL
        );


    symbolRefreshTimer =
        setInterval(
            async () => {

                await loadSymbols();


                books.clear();

                trades.clear();

                wallHistory.clear();

                setups.clear();


                connectWebSocket();

            },
            SYMBOL_REFRESH
        );

}


/* =====================================================
   STOP
===================================================== */

function stopScanner() {

    running = false;


    if (analysisTimer) {

        clearInterval(
            analysisTimer
        );

        analysisTimer = null;

    }


    if (uiTimer) {

        clearInterval(
            uiTimer
        );

        uiTimer = null;

    }


    if (symbolRefreshTimer) {

        clearInterval(
            symbolRefreshTimer
        );

        symbolRefreshTimer = null;

    }


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer = null;

    }


    if (ws) {

        try {
            ws.close();
        }
        catch (e) {}

        ws = null;

    }


    wsEl.innerText =
        "OFF";

    wsEl.className =
        "stat-value";


    statusEl.innerText =
        "Остановлен";

    statusEl.style.color =
        "#848e9c";

}


/* =====================================================
   CLEAR
===================================================== */

function clearSignals() {

    setups.clear();

    wallHistory.clear();

    renderSignals();

}
