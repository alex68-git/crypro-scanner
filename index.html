body {

    <div id="empty" class="empty">

<script>
/* =====================================================
   CONFIG & STATE
===================================================== */
const MAX_SYMBOLS = 100;
const ORDERBOOK_DEPTH = 50;
const MAX_SIGNALS = 15;
const ANALYSIS_INTERVAL = 1000;
const UI_INTERVAL = 1500;
const SYMBOL_REFRESH = 5 * 60 * 1000;
const MIN_WALL_RATIO = 3;

const MAX_WALL_DISTANCE = 0.012; // 1.2% до стены для уровня
const TRADE_WINDOW = 30000;      // 30 сек окно потока
const PRICE_WINDOW = 120000;     // 2 мин окно цены

let ws = null;
let running = false;
let uiPaused = false;

let reconnectTimer = null;
let symbolRefreshTimer = null;
let analysisTimer = null;
let uiTimer = null;

const symbols = [];
const symbolRanks = new Map();
const symbolTurnovers = new Map(); // Суточный объем
const books = new Map();
const trades = new Map();
const wallHistory = new Map();
const signals = new Map();

/* =====================================================
   DOM & AUDIO
===================================================== */
const statusEl = document.getElementById("status");
const wsEl = document.getElementById("wsStatus");
const coinCountEl = document.getElementById("coinCount");
const candidateCountEl = document.getElementById("candidateCount");
const signalCountEl = document.getElementById("signalCount");
const signalsEl = document.getElementById("signals");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep() {
    if (!document.getElementById("soundToggle").checked) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.1;
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } catch(e){}
}

/* =====================================================
   HELPERS & DYNAMIC THRESHOLD
===================================================== */
function now() { return Date.now(); }

function money(value) {
    return Number(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
}

function priceFormat(value) {
    const n = Number(value);
    if (n >= 1000) return n.toFixed(2);
    if (n >= 1) return n.toFixed(4);
    return n.toFixed(8);
}

function percent(value) { return (value * 100).toFixed(2) + "%"; }

// Расчет динамического порога стены от 24h объема
function getDynamicThreshold(symbol) {
    const turnover = symbolTurnovers.get(symbol) || 10000000;
    const sens = parseFloat(document.getElementById("volSens").value);
    
    // Минимальный порог не менее $30,000 в любом случае
    return Math.max(30000, turnover * sens);
}

function togglePause() {
    uiPaused = !uiPaused;
    const btn = document.getElementById("pauseBtn");
    const status = document.getElementById("pauseStatus");
    if (uiPaused) {
        btn.classList.add("active");
        btn.innerText = "▶ Возобновить UI";
        status.style.display = "inline";
    } else {
        btn.classList.remove("active");
        btn.innerText = "⏸ Пауза UI";
        status.style.display = "none";
    }
}

/* =====================================================
   DATA PROCESSING
===================================================== */
function createBook(symbol) {
    books.set(symbol, { bids: new Map(), asks: new Map(), lastPrice: null });
}

function applySnapshot(symbol, data) {
    createBook(symbol);
    const book = books.get(symbol);
    if (Array.isArray(data.b)) {
        for (const order of data.b) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (price > 0 && qty > 0) book.bids.set(price, qty);
        }
    }
    if (Array.isArray(data.a)) {
        for (const order of data.a) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (price > 0 && qty > 0) book.asks.set(price, qty);
        }
    }
}

function applyDelta(symbol, data) {
    const book = books.get(symbol);
    if (!book) return;
    if (Array.isArray(data.b)) {
        for (const order of data.b) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (qty === 0) book.bids.delete(price);
            else book.bids.set(price, qty);
        }
    }
    if (Array.isArray(data.a)) {
        for (const order of data.a) {
            const price = parseFloat(order[0]), qty = parseFloat(order[1]);
            if (qty === 0) book.asks.delete(price);
            else book.asks.set(price, qty);
        }
    }
}

function processTrade(data) {
    if (!Array.isArray(data)) return;
    for (const trade of data) {
        const symbol = trade.s, side = trade.S;
        const price = parseFloat(trade.p), qty = parseFloat(trade.v);
        const timestamp = Number(trade.T) || now();
        if (!symbol || !price || !qty) continue;

        if (!trades.has(symbol)) trades.set(symbol, []);
        const list = trades.get(symbol);
        list.push({ time: timestamp, side, price, qty, value: price * qty });

        const book = books.get(symbol);
        if (book) book.lastPrice = price;

        const cutoff = now() - PRICE_WINDOW;
        while (list.length && list[0].time < cutoff) list.shift();
    }
}

function getTradeFlow(symbol) {
    const list = trades.get(symbol) || [];
    const cutoff = now() - TRADE_WINDOW;
    let buy = 0, sell = 0;

    for (let i = list.length - 1; i >= 0; i--) {
        const t = list[i];
        if (t.time < cutoff) break;
        if (t.side === "Buy") buy += t.value;
        else sell += t.value;
    }
    const total = buy + sell;
    const imbalance = total > 0 ? (buy - sell) / total : 0;
    return { buy, sell, total, imbalance };
}

function getPriceChange(symbol) {
    const list = trades.get(symbol) || [];
    if (list.length < 2) return 0;
    const latest = list[list.length - 1];
    const cutoff = now() - PRICE_WINDOW;
    let old = null;

    for (let i = 0; i < list.length; i++) {
        if (list[i].time >= cutoff) { old = list[i]; break; }
    }
    if (!old || !old.price) return 0;
    return (latest.price - old.price) / old.price;
}

function getLocalLiquidity(book, side, currentPrice) {
    if (!book || !currentPrice) return 1;
    const source = side === "Buy" ? book.bids : book.asks;
    const values = [];

    for (const [price, qty] of source) {
        if (Math.abs(price - currentPrice) / currentPrice <= 0.004) {
            const val = price * qty;
            if (val > 0) values.push(val);
        }
    }
    if (values.length === 0) return 1;
    values.sort((a, b) => a - b);
    return values[Math.floor(values.length / 2)];
}

/* =====================================================
   ANALYSIS & SCORE
===================================================== */
function findWalls(symbol) {
    const book = books.get(symbol);
    if (!book) return [];

    let currentPrice = book.lastPrice;
    if (!currentPrice) {
        const bids = [...book.bids.keys()].sort((a, b) => b - a);
        const asks = [...book.asks.keys()].sort((a, b) => a - b);
        if (bids.length && asks.length) currentPrice = (bids[0] + asks[0]) / 2;
    }
    if (!currentPrice) return [];

    const result = [];
    const threshold = getDynamicThreshold(symbol);

    // BUY WALLS
    for (const [price, qty] of book.bids) {
        const distance = (currentPrice - price) / currentPrice;
        if (distance < 0 || distance > MAX_WALL_DISTANCE) continue;
        const value = price * qty;
        const local = getLocalLiquidity(book, "Buy", currentPrice);
        const ratio = value / Math.max(local, 1);

        if (value >= threshold && ratio >= MIN_WALL_RATIO) {
            result.push({ symbol, side: "Buy", price, qty, value, distance, ratio, currentPrice, threshold });
        }
    }

    // SELL WALLS
    for (const [price, qty] of book.asks) {
        const distance = (price - currentPrice) / currentPrice;
        if (distance < 0 || distance > MAX_WALL_DISTANCE) continue;
        const value = price * qty;
        const local = getLocalLiquidity(book, "Sell", currentPrice);
        const ratio = value / Math.max(local, 1);

        if (value >= threshold && ratio >= MIN_WALL_RATIO) {
            result.push({ symbol, side: "Sell", price, qty, value, distance, ratio, currentPrice, threshold });
        }
    }

    result.sort((a, b) => b.value - a.value);
    return result.slice(0, 4);
}

function updateWallHistory(wall) {
    const key = `${wall.symbol}_${wall.side}_${wall.price}`;
    if (!wallHistory.has(key)) {
        wallHistory.set(key, { firstSeen: now(), lastSeen: now(), lastValue: wall.value });
    } else {
        const item = wallHistory.get(key);
        item.lastSeen = now();
        item.lastValue = wall.value;
    }
    return wallHistory.get(key);
}

function calculateScore(wall, flow, priceChange, ageSec) {
    let score = 0;

    // 1. Отношение размера к динамическому порогу (До 25 б.)
    const thresholdRatio = wall.value / wall.threshold;
    score += Math.min(25, thresholdRatio * 10);

    // 2. Отношение к стакану (До 20 б.)
    score += Math.min(20, wall.ratio * 4);

    // 3. Выдержка стены (До 25 б.) — чем дольше стоит, тем надежнее уровень
    score += Math.min(25, (ageSec / 60) * 12.5);

    // 4. Поток и защита уровня (До 30 б.)
    // Если цена близко к BUY плите и идет отскок — это идеальный LONG
    if (wall.side === "Buy") {
        if (priceChange >= 0) score += 15; // Отскакиваем вверх
        if (flow.imbalance > -0.1) score += 15; // Нет тотального давления продавцов
    } else {
        if (priceChange <= 0) score += 15; // Отскакиваем вниз
        if (flow.imbalance < 0.1) score += 15;
    }

    return Math.min(100, Math.round(score));
}

function analyzeSymbol(symbol) {
    const book = books.get(symbol);
    if (!book) return;

    const wallsFound = findWalls(symbol);
    const flow = getTradeFlow(symbol);
    const priceChange = getPriceChange(symbol);

    for (const wall of wallsFound) {
        const history = updateWallHistory(wall);
        const ageSec = (now() - history.firstSeen) / 1000;
        const requiredAgeSec = parseInt(document.getElementById("wallAge").value);

        // Фильтр строгого времени стояния стены (1 или 2 минуты)
        if (ageSec < requiredAgeSec) continue;

        // Сетапы для среднесрока: Либо удержание уровня, либо отскок
        let setup = wall.side === "Buy" ? "LONG LEVEL" : "SHORT LEVEL";

        const score = calculateScore(wall, flow, priceChange, ageSec);
        const minScore = parseInt(document.getElementById("minScore").value);
        if (score < minScore) continue;

        const key = `${symbol}_${wall.side}_${wall.price}`;
        const isNew = !signals.has(key);

        signals.set(key, {
            key, symbol, rank: symbolRanks.get(symbol), setup, score, wall, flow, priceChange, ageSec, updated: now()
        });

        if (isNew && score >= 75) playBeep();
    }
}

function analyzeAll() {
    if (!running) return;
    for (const symbol of symbols) analyzeSymbol(symbol);

    // Сигнал висит на экране долго (пока стену не уберут на 15+ секунд)
    const expiry = now() - 15000;
    for (const [key, signal] of signals) {
        if (signal.updated < expiry) signals.delete(key);
    }
}

/* =====================================================
   RENDER
===================================================== */
function renderSignals() {
    candidateCountEl.innerText = signals.size;

    if (uiPaused) return; // Если нажата пауза, не перерисовываем экран

    const sorted = [...signals.values()].sort((a, b) => b.score - a.score).slice(0, MAX_SIGNALS);
    signalCountEl.innerText = sorted.length;

    if (sorted.length === 0) {
        signalsEl.innerHTML = `
            <div class="empty">
                🔎 Поиск подтвержденных уровней...<br><br>
                Ждем плиты, которые выстоят выбранное время (1-2 мин).
            </div>`;
        return;
    }

    let html = "";
    for (const s of sorted) {
        const isLong = s.wall.side === "Buy";
        const directionClass = isLong ? "long" : "short";
        const wallSideText = isLong ? "🛡 BUY LEVEL (Плита)" : "🛑 SELL LEVEL (Плита)";

        html += `
            <div class="signal ${directionClass}">
                <div class="signal-top">
                    <div class="symbol">
                        ${s.symbol} <span class="gray">#${s.rank}</span>
                    </div>
                    <div class="direction ${directionClass}">${s.setup}</div>
                </div>
                
                <div class="score">Score: ${s.score}/100</div>
                
                <div class="data-grid">
                    <div class="data-box">Тип уровня<strong>${wallSideText}</strong></div>
                    <div class="data-box">Цена стены (Уровень)<strong>${priceFormat(s.wall.price)}</strong></div>
                    <div class="data-box">Объём плиты<strong>$${money(s.wall.value)}</strong></div>
                    <div class="data-box">Порог монеты (24h)<strong>$${money(s.wall.threshold)}</strong></div>
                    <div class="data-box">Время жизни плиты<strong>${(s.ageSec / 60).toFixed(1)} мин (${Math.round(s.ageSec)} сек)</strong></div>
                    <div class="data-box">До стены<strong>${percent(s.wall.distance)}</strong></div>
                    <div class="data-box">Плотность к стакану<strong>${s.wall.ratio.toFixed(1)}x</strong></div>
                    <div class="data-box">Реакция цены (2 мин)<strong>${percent(s.priceChange)}</strong></div>
                </div>

                <div class="reason">
                    💡 <b>Анализ уровня:</b> Плита стоит уже <b>${(s.ageSec / 60).toFixed(1)} мин</b>. 
                    Размер превышает порог суточной ликвидности монеты в <b>${(s.wall.value / s.wall.threshold).toFixed(1)} раз</b>.
                </div>
            </div>`;
    }
    signalsEl.innerHTML = html;
}

/* =====================================================
   WEBSOCKET (PACKET SUBSCRIPTION)
===================================================== */
function connectWebSocket() {
    if (!running) return;

    if (ws) {
        try { ws.onclose = null; ws.close(); } catch (e) {}
    }

    ws = new WebSocket("wss://stream.bybit.com/v5/public/linear");

    ws.onopen = async () => {
        wsEl.innerText = "ON";
        wsEl.className = "stat-value green";
        statusEl.innerText = "Сканирование активно";
        statusEl.style.color = "#27ae60";

        const args = [];
        for (const symbol of symbols) {
            args.push(`orderbook.${ORDERBOOK_DEPTH}.${symbol}`);
            args.push(`publicTrade.${symbol}`);
        }

        const chunkSize = 10;
        for (let i = 0; i < args.length; i += chunkSize) {
            if (!running || ws.readyState !== WebSocket.OPEN) break;
            const chunk = args.slice(i, i + chunkSize);
            ws.send(JSON.stringify({ op: "subscribe", args: chunk }));
            await new Promise(resolve => setTimeout(resolve, 50));
        }
    };

    ws.onmessage = event => {
        try {
            const data = JSON.parse(event.data);
            if (data.op === "pong") return;
            if (!data.topic) return;

            if (data.topic.startsWith("orderbook.")) {
                const symbol = data.topic.split(".")[2];
                if (data.type === "snapshot") applySnapshot(symbol, data.data);
                else if (data.type === "delta") applyDelta(symbol, data.data);
            } else if (data.topic.startsWith("publicTrade.")) {
                processTrade(data.data);
            }
        } catch (error) {}
    };

    ws.onerror = () => {
        wsEl.innerText = "ERROR";
        wsEl.className = "stat-value red";
    };

    ws.onclose = () => {
        wsEl.innerText = "OFF";
        wsEl.className = "stat-value red";
        if (running) {
            statusEl.innerText = "Переподключение...";
            statusEl.style.color = "#f7931a";
            reconnectTimer = setTimeout(connectWebSocket, 3000);
        }
    };
}

function startPing() {
    setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ op: "ping" }));
        }
    }, 20000);
}

/* =====================================================
   LOAD SYMBOLS & CONTROL
===================================================== */
async function loadSymbols() {
    try {
        statusEl.innerText = "Загрузка TOP-100...";
        statusEl.style.color = "#f7931a";

        const response = await fetch("https://api.bybit.com/v5/market/tickers?category=linear");
        const json = await response.json();

        if (!json.result || !Array.isArray(json.result.list)) throw new Error("Invalid response");

        const list = json.result.list
            .filter(item => item.symbol && item.symbol.endsWith("USDT") && parseFloat(item.turnover24h) > 0)
            .sort((a, b) => parseFloat(b.turnover24h) - parseFloat(a.turnover24h))
            .slice(0, MAX_SYMBOLS);

        symbols.length = 0;
        symbolRanks.clear();
        symbolTurnovers.clear();

        list.forEach((item, index) => {
            symbols.push(item.symbol);
            symbolRanks.set(item.symbol, index + 1);
            symbolTurnovers.set(item.symbol, parseFloat(item.turnover24h));
        });

        coinCountEl.innerText = symbols.length;
        return true;
    } catch (error) {
        statusEl.innerText = "Ошибка загрузки TOP";
        statusEl.style.color = "#e74c3c";
        return false;
    }
}

async function startScanner() {
    if (running) return;
    running = true;

    const success = await loadSymbols();
    if (!success) { running = false; return; }

    books.clear();
    trades.clear();
    signals.clear();
    wallHistory.clear();

    connectWebSocket();

    analysisTimer = setInterval(analyzeAll, ANALYSIS_INTERVAL);
    uiTimer = setInterval(renderSignals, UI_INTERVAL);

    symbolRefreshTimer = setInterval(async () => {
        await loadSymbols();
        connectWebSocket();
    }, SYMBOL_REFRESH);
}

function stopScanner() {
    running = false;
    if (analysisTimer) clearInterval(analysisTimer);
    if (uiTimer) clearInterval(uiTimer);
    if (symbolRefreshTimer) clearInterval(symbolRefreshTimer);
    if (reconnectTimer) clearTimeout(reconnectTimer);

    if (ws) {
        try { ws.onclose = null; ws.close(); } catch (e) {}
        ws = null;
    }

    wsEl.innerText = "OFF";
    wsEl.className = "stat-value";
    statusEl.innerText = "Остановлен";
    statusEl.style.color = "#848e9c";
}

function clearSignals() {
    signals.clear();
    renderSignals();
}

startPing();
</script>
